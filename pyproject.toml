[project]
name = "fabrik"
version = "0.1.0"
description = "Deployment automation CLI for AI-powered infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Özgür Başak" }
]

dependencies = [
    "click>=8.1.0",
    "evalplus>=0.3.0",
    # Terminal-Bench 1.x (legacy `tb` CLI). Its newest dataset, terminal-bench-core==0.1.1,
    # is SUPERSEDED — kept only so an old score can be reproduced with --allow-stale.
    "terminal-bench>=0.2.18",
    # Terminal-Bench 2.x lives here, NOT in `terminal-bench`: a different package, CLI
    # (`harbor run`) and dataset (terminal-bench/terminal-bench-2-1 — 89 tasks, 16
    # categories). This is the CURRENT benchmark; scripts/kilo-benchmarks/dataset_freshness.py
    # refuses to bench the 1.x set.
    "harbor>=0.18.0",
    "fastapi>=0.115.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "psutil>=6.0.0",
    "uvicorn[standard]>=0.30.0",
    "jsonschema>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "hypothesis>=6.100.0",
    "mutmut>=3.6.0",  # diff-scoped ADVISORY mutation testing (Behavior Contract substance-mechanical layer)
]

[project.scripts]
fabrik = "fabrik.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrik"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# Vendored fabrik-lib module — canonical-owned, kept byte-identical to /opt/fabrik-lib on re-vendor.
# We do NOT lint/format vendored code (reformatting would fork it from canonical); the final_gate
# ruff scope already skips it (_RUFF_ROOTS = scripts/, src/) — this mirrors that for raw ruff/editors.
extend-exclude = ["libs/subagents", "libs/web_scrape"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long
    "B904",   # raise from - CLI exits don't need chaining
    "SIM102", # nested if - sometimes clearer
    "SIM105", # contextlib.suppress - explicit try/except more readable
    "SIM117", # nested with - sometimes clearer
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
exclude = [
    "^scripts/",  # Standalone scripts, not part of package
    "^tests/",
    "^templates/",
]

[[tool.mypy.overrides]]
module = ["rich.*", "yaml.*", "httpx.*", "dotenv.*", "psutil.*", "uptime_kuma_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--ignore=tests/test_pipeline_runner.py"
markers = [
    "requires_fabrik_env: marks tests requiring /opt/fabrik environment (skipped in CI)",
]

[tool.hypothesis]
database = ".hypothesis"
