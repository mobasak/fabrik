[project]
name = "fabrik"
version = "0.1.0"
description = "Deployment automation CLI for AI-powered infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Özgür Başak" }
]

dependencies = [
    "click>=8.1.0",
    "evalplus>=0.3.0",
    # Terminal-Bench 1.x (legacy `tb` CLI). Its newest dataset, terminal-bench-core==0.1.1,
    # is SUPERSEDED — kept only so an old score can be reproduced with --allow-stale.
    "terminal-bench>=0.2.18",
    # Terminal-Bench 2.x lives here, NOT in `terminal-bench`: a different package, CLI
    # (`harbor run`) and dataset (terminal-bench/terminal-bench-2-1 — 89 tasks, 16
    # categories). This is the CURRENT benchmark; scripts/kilo-benchmarks/dataset_freshness.py
    # refuses to bench the 1.x set.
    "harbor>=0.18.0",
    "fastapi>=0.115.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "psutil>=6.0.0",
    "uvicorn[standard]>=0.30.0",
    "jsonschema>=4.17.0",
    # scripts/sysadmin/prune_transcripts.py reads session-recall's index_state through the
    # read-only role (D-736 C.2 rule 8) — the one dependency the retention plan authorises.
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # W-162398ef (operator-authorised): a hung test is a failure, never a stuck run
    "pytest-timeout>=2.3.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "hypothesis>=6.100.0",
    "mutmut>=3.6.0",  # diff-scoped ADVISORY mutation testing (Behavior Contract substance-mechanical layer)
    # Authorised by plan 2026-09-05-plan-2-glitchtip-deny-by-default T01: the vendored
    # scaffold scrubber (templates/scaffold/python/glitchtip_init.py) is IMPORTED and
    # EXECUTED by its guards, so the hub venv must carry what it imports.
    "sentry-sdk[fastapi]>=2.18.0",
    "structlog>=24",
    # Authorised by the coordinator 2026-10-18 (W-0ae9b7e1, D-1013): the vendored fastapi-user-auth
    # settings.py builds TypeAdapter(EmailStr) at import, so the hub's saas wiring tests need it.
    "email-validator>=2.0",
    # Authorised by the coordinator 2026-10-18 (W-ab242b11 slice 2, D-1013): the chat tests drive a
    # real throwaway redis-server; 45-testing-strategy.md bans an in-memory Redis stand-in.
    "redis>=5.0",
]

[project.scripts]
fabrik = "fabrik.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrik"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# Vendored fabrik-lib module — canonical-owned, kept byte-identical to /opt/fabrik-lib on re-vendor.
# We do NOT lint/format vendored code (reformatting would fork it from canonical); the final_gate
# ruff scope already skips it (_RUFF_ROOTS = scripts/, src/) — this mirrors that for raw ruff/editors.
# templates/scaffold/python/glitchtip_init.py is vendored the same way (site-provisioner's scrubber,
# byte-parity graded by T01) — the same convention, not a per-file rule ignore (2026-09-05).
extend-exclude = ["libs/subagents", "libs/web_scrape", "libs/alerting", "libs/competitor_intel", "libs/cost_budget.py", "libs/deep_research", "libs/web_tools.py", "templates/scaffold/python/glitchtip_init.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long
    "B904",   # raise from - CLI exits don't need chaining
    "SIM102", # nested if - sometimes clearer
    "SIM105", # contextlib.suppress - explicit try/except more readable
    "SIM117", # nested with - sometimes clearer
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
exclude = [
    "^scripts/",  # Standalone scripts, not part of package
    "^tests/",
    "^templates/",
]

[[tool.mypy.overrides]]
module = ["rich.*", "yaml.*", "httpx.*", "dotenv.*", "psutil.*", "uptime_kuma_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--ignore=tests/test_pipeline_runner.py -m 'not needs_network'"
# Per-test limit (pytest-timeout, W-162398ef). The INI key, not `--timeout` in addopts: with the plugin
# absent the key only warns, the flag refuses every run (exit 4). Memory is capped separately — a
# runaway grows ~300 MB/s, faster than any timeout (tests/memguard.py, scripts/capped_run.sh).
# 600, not the scaffold's 120: this is a hang detector, and hub tests that run the real completion
# gate take longer than 120 s (test_final_gate_advisory_display.py: 209 s, measured 2026-10-17, D-935).
timeout = 600
markers = [
    "requires_fabrik_env: marks tests requiring /opt/fabrik environment (skipped in CI)",
    "lints: runs tests/test_command_rules.py with the D-1236 ledger lints switched on (command_rules.LINTS); the older fixture tests run with them off",
    "needs_network: performs a REAL package install or build (pnpm/npm/uv). Excluded from the default run by addopts — measured 2026-09-02: it is what made `pytest tests/test_scaffold*.py` never finish. Run explicitly with `-m needs_network`.",
]

[tool.hypothesis]
database = ".hypothesis"
