# Rules-corpus CLAIMS REGISTER — every external-world assertion the packs rely on,
# as a dated, re-verifiable row. (Rules pass 2026-09-01: the drift that matters is
# CLAIMS, not version strings — the Alpine rationale went silently false while its
# rule stayed right; no regex sees that.)
#
# CONTRACT
# - Grown file-by-file by the rules currency pass: evaluating a pack extracts its
#   external claims here, dated, with the source that grounded them.
# - `rules_currency_watch.py --claims` (weekly cron rider) mails infra every claim
#   whose last_verified is older than its window — the mail carries the verify
#   hints, so the receiving session re-researches EXACTLY the stale claims and
#   bumps the dates (or fixes the pack when the world moved).
# - Version LITERALS (python:X.Y, node:N) are additionally auto-watched against
#   endoflife.date by the same script — kind: version rows marked `auto: true`
#   page within a week of an upstream release, not at window expiry.
# - A claim REFUTED by re-verification = fix the pack in the same change and
#   supersede the row (new row, old one gets `superseded: <date>`), mirroring the
#   decision-ledger discipline.
#
# window_days guidance: 90 fast-moving (versions, tool landscape) · 180 practices
# and rationales · 365 stable standards/deprecations.

