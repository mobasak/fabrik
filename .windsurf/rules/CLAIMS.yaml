    pack: core/10-python.md
    claim: "Python current stable is 3.14 (packs pin python:3.14)"
    kind: version
    auto: true            # endoflife.date watcher pages on release, not window
    verify: "https://endoflife.date/api/python.json"
    window_days: 90
    last_verified: 2026-09-01

