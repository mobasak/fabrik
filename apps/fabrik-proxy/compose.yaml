services:
  fabrik-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64  # Mandatory for x86_64 VPS
    container_name: fabrik-proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fabrik-proxy.rule=Host(`proxy.vps1.ocoron.com`)"
      - "traefik.http.routers.fabrik-proxy.entrypoints=websecure"
      - "traefik.http.routers.fabrik-proxy.tls=true"
      - "traefik.http.routers.fabrik-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.services.fabrik-proxy.loadbalancer.server.port=8000"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres-main
      - DB_PORT=5432
      - DB_NAME=proxy_management
      - APP_ENV=production
      - DB_USER=ozgur
      - DB_PASSWORD=${DB_PASSWORD}
      - WEBSHARE_API_KEY=${WEBSHARE_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:  # Mandatory for the compose deploy — Traefik v3 filters unhealthy containers
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/health || curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fabrik
    env_file:
      - .env


networks:
  fabrik:
    external: true
