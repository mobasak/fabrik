services:
  image-broker:
    image: zo4ggs4g880skwkocwwkscgk_image-broker:2afd21177e26613719076e2245975f660e1d2fe2
    container_name: image-broker
    restart: unless-stopped
    env_file: .env
    volumes:
      - image-cache:/app/cache
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.image-broker.rule=Host(`images.vps1.ocoron.com`)"
      - "traefik.http.routers.image-broker.entrypoints=websecure"
      - "traefik.http.routers.image-broker.tls=true"
      - "traefik.http.routers.image-broker.tls.certresolver=letsencrypt"
      - "traefik.http.routers.image-broker.middlewares=authelia-forward@docker,gzip@docker"
      - "traefik.http.services.image-broker.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  image-cache:
    external: true
    name: zo4ggs4g880skwkocwwkscgk_image-cache

networks:
  coolify:
    external: true
