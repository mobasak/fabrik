# n8n workflow automation — the live stack is /opt/n8n/compose.yaml on vps1; this is its mirror.
# ARM64: supported (linux/amd64, linux/arm64).
# n8n v1.0+ removed basic auth: the first run opens a setup wizard that creates the owner account, and
# Authelia fronts the instance (authelia-forward@docker below).
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - fabrik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`auto.vps1.ocoron.com`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.middlewares=authelia-forward@docker"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

volumes:
  n8n-data:
    external: true              # Pre-created from UUID volume copy

networks:
  fabrik:
    external: true
