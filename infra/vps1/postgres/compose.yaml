services:
  postgres-main:
    image: postgres:18.6-alpine
    platform: linux/amd64
    container_name: postgres-main
    restart: unless-stopped
    env_file: .env
    volumes:
    - postgres18-data:/var/lib/postgresql
    networks:
    - fabrik
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
    - 10.99.0.1:5432:5432
volumes:
  postgres18-data:
    external: true
networks:
  fabrik:
    external: true
