services:
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    restart: unless-stopped
    environment:
      TOKEN: "${BROWSERLESS_TOKEN}"
      CONCURRENT: "10"
      TIMEOUT: "60000"
    networks:
      - fabrik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.browserless.rule=Host(`browser.vps1.ocoron.com`)"
      - "traefik.http.routers.browserless.entrypoints=websecure"
      - "traefik.http.routers.browserless.tls=true"
      - "traefik.http.routers.browserless.tls.certresolver=letsencrypt"
      - "traefik.http.routers.browserless.middlewares=gzip@docker"
      - "traefik.http.services.browserless.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          # 3G, a PROVISIONAL raise from 2G (W-30b7ce3f, 2026-10-21): over 7 days the working set's p99 was
          # 1805 MiB and it was OOM-killed 5 times at the 2048 MiB limit — the peak is censored by that limit,
          # so true demand at CONCURRENT 10 is unknown. If OOM kills continue at 3G, lower CONCURRENT rather
          # than raising this again. vps1 had 6.0 GiB available and its limits summed to ~2x its RAM.
          memory: 3G

networks:
  fabrik:
    external: true
