services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:latest
    container_name: backrest
    hostname: vps1
    restart: unless-stopped
    env_file: .env              # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: Europe/Istanbul
    volumes:
      # Backrest's own state
      - /opt/backrest/data:/data
      - /opt/backrest/config:/config
      - /opt/backrest/cache:/cache
      - /opt/backrest/tmp:/tmp
      # Backup source mounts (path-preserving — container sees same paths as host
      # so restic snapshot paths == host paths; no restore-time path mangling).
      # Replaced the W2-original /backup-opt /backup-volumes /backup-postgres
      # naming on 2026-06-01 (Step 5 of DR-in-hours track).
      - /opt:/opt:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      # Host-state backup sources (DR-in-hours track, host-state plan).
      # Each is the minimum subtree the plan paths reference.
      - /etc:/etc:ro
      - /usr/local/bin:/usr/local/bin:ro
      - /root/.ssh:/root/.ssh:ro
      - /home/ozgur/.ssh:/home/ozgur/.ssh:ro
      # Pre-backup.sh runs pg_dumpall via this — kept rw for docker.sock access.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Restic password (legacy compat — config.json still references it).
      - /opt/backrest/.restic-password:/restic-password:ro
    networks:
      - fabrik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.rule=Host(`backup.vps1.ocoron.com`)"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.tls=true"
      - "traefik.http.routers.backrest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backrest.middlewares=authelia-forward@docker"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  fabrik:
    external: true
