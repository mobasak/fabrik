services:
  site-provisioner:
    image: qokoksogwsk0c04gcs4swwgs_site-provisioner:ec6f5e87577b46f84c833974f532c737781f656b
    container_name: site-provisioner
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "if [ -f alembic.ini ]; then alembic upgrade head || exit 1; fi &&
      uvicorn api.main:app --host 0.0.0.0 --port 8001"
    networks:
      - fabrik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fabrik"
      - "traefik.http.routers.site-provisioner.rule=Host(`provision.vps1.ocoron.com`)"
      - "traefik.http.routers.site-provisioner.entrypoints=websecure"
      - "traefik.http.routers.site-provisioner.tls=true"
      - "traefik.http.routers.site-provisioner.tls.certresolver=letsencrypt"
      - "traefik.http.routers.site-provisioner.middlewares=site-provisioner-ipallowlist"
      - "traefik.http.middlewares.site-provisioner-ipallowlist.ipallowlist.sourcerange=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,172.93.160.197/32,31.206.44.18/32"
      - "traefik.http.services.site-provisioner.loadbalancer.server.port=8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  fabrik:
    external: true
