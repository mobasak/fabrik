services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: meilisearch
    restart: unless-stopped
    env_file: .env              # MEILI_MASTER_KEY
    environment:
      MEILI_ENV: production
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
      MEILI_HTTP_ADDR: "0.0.0.0:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meilisearch.rule=Host(`search.vps1.ocoron.com`)"
      - "traefik.http.routers.meilisearch.entrypoints=websecure"
      - "traefik.http.routers.meilisearch.tls=true"
      - "traefik.http.routers.meilisearch.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.routers.meilisearch.middlewares=gzip@docker"
      - "traefik.http.services.meilisearch.loadbalancer.server.port=7700"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  meilisearch-data:
    external: true              # Pre-created from bs0wo48k4gwo440gcowscoc8-211159651770:/meili_data

networks:
  coolify:
    external: true
