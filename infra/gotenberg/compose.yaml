services:
  gotenberg:
    image: gotenberg/gotenberg:8.32.0
    container_name: gotenberg
    restart: unless-stopped
    environment:
      GOTENBERG_API_ENABLE_BASIC_AUTH: "true"
      GOTENBERG_API_BASIC_AUTH_USERNAME: gotenberg
      GOTENBERG_API_BASIC_AUTH_PASSWORD: "${GOTENBERG_API_BASIC_AUTH_PASSWORD}"
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotenberg.rule=Host(`pdf.vps1.ocoron.com`)"
      - "traefik.http.routers.gotenberg.entrypoints=websecure"
      - "traefik.http.routers.gotenberg.tls=true"
      - "traefik.http.routers.gotenberg.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gotenberg.middlewares=gzip@docker"
      - "traefik.http.services.gotenberg.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  coolify:
    external: true
