services:
  wordpress:
    image: wordpress:php8.3-fpm
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD}"
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: ocoron_prod_
    volumes:
      - wp_html:/var/www/html
      - /opt/ocoron-com/php-fpm/zz-fabrik-listen.conf:/usr/local/etc/php-fpm.d/zz-fabrik-listen.conf:ro
    command:
      - /bin/sh
      - -c
      - |
        # Install WP-CLI (php8.3-fpm image doesn't include it, unlike apache)
        curl -fsSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        chmod +x /usr/local/bin/wp
        # Start PHP-FPM
        php-fpm
    networks:
      - ocoron-com-internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - wp_html:/var/www/html:ro
      - /opt/ocoron-com/php-fpm/zz-fabrik-listen.conf:/usr/local/etc/php-fpm.d/zz-fabrik-listen.conf:ro
      - /opt/ocoron-com/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
      - ocoron-com-internal
    labels:
      - traefik.enable=true
      - "traefik.http.routers.ocoron-com.rule=Host(`ocoron.com`)"
      - traefik.http.routers.ocoron-com.entrypoints=websecure
      - traefik.http.routers.ocoron-com.tls=true
      - traefik.http.routers.ocoron-com.tls.certresolver=letsencrypt
      - traefik.http.services.ocoron-com.loadbalancer.server.port=80
      - "traefik.http.routers.ocoron-com-www.rule=Host(`www.ocoron.com`)"
      - traefik.http.routers.ocoron-com-www.entrypoints=websecure
      - traefik.http.routers.ocoron-com-www.tls=true
      - traefik.http.routers.ocoron-com-www.middlewares=ocoron-com-www-redirect
      - "traefik.http.middlewares.ocoron-com-www-redirect.redirectregex.regex=^https://www\\.ocoron\\.com/(.*)"
      - "traefik.http.middlewares.ocoron-com-www-redirect.redirectregex.replacement=https://ocoron.com/$$"
      - traefik.http.routers.ocoron-com.middlewares=ocoron-com-rate-limit
      - "traefik.http.routers.ocoron-com-xmlrpc.rule=Host(`ocoron.com`) && Path(`/xmlrpc.php`)"
      - traefik.http.routers.ocoron-com-xmlrpc.entrypoints=websecure
      - traefik.http.routers.ocoron-com-xmlrpc.tls=true
      - traefik.http.routers.ocoron-com-xmlrpc.tls.certresolver=letsencrypt
      - traefik.http.routers.ocoron-com-xmlrpc.priority=100
      - traefik.http.routers.ocoron-com-xmlrpc.middlewares=ocoron-com-block-xmlrpc
      - traefik.http.middlewares.ocoron-com-block-xmlrpc.replacepathregex.regex=.*
      - traefik.http.middlewares.ocoron-com-block-xmlrpc.replacepathregex.replacement=/wp-login.php?blocked=xmlrpc
      - traefik.http.middlewares.ocoron-com-rate-limit.ratelimit.average=10
      - traefik.http.middlewares.ocoron-com-rate-limit.ratelimit.burst=20
      - traefik.http.middlewares.ocoron-com-rate-limit.ratelimit.period=1m
    depends_on:
      - wordpress

  db:
    image: mariadb:10.11
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: "${WP_DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ocoron-com-internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-bookworm
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ocoron-com-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: debian:bookworm-slim
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: wordpress
      DB_USER: wp_user
      DB_PASSWORD: "${WP_DB_PASSWORD}"
      R2_ENDPOINT: "https://066f5cf1dfe20ba18549a592809aa080.r2.cloudflarestorage.com"
      R2_ACCESS_KEY: "${R2_ACCESS_KEY}"
      R2_SECRET_KEY: "${R2_SECRET_KEY}"
      R2_BUCKET: "ocoron-com-backups"
      SITE_NAME: "ocoron-com"
    volumes:
      - /opt/ocoron-com/backup:/scripts:ro
      - wp_html:/wordpress/wp-content:ro
      - backup_data:/backups
    networks:
      - ocoron-com-internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update && apt-get install -y --no-install-recommends mariadb-client awscli gzip cron && rm -rf /var/lib/apt/lists/*
        echo "0 3 * * * root /scripts/backup.sh daily" >> /etc/cron.d/backup
        echo "0 4 * * 0 root /scripts/backup.sh weekly" >> /etc/cron.d/backup
        chmod 0644 /etc/cron.d/backup
        cron -f
    depends_on:
      db:
        condition: service_healthy

volumes:
  wp_html:
  db_data:
  redis_data:
  backup_data:

networks:
  coolify:
    external: true
  ocoron-com-internal:
