# The REFERENCE pack — competitor discovery (brand-identity-creator's content, verbatim, now DATA).
# The firecrawl/exa/brave names + the "competitor"/"marketplace"/"Instagram" vocab live HERE, never in
# the engine. Swap this file for another pack and the same engine researches a different domain.

query_plan_prompt: |
  [stage:query-plan] You are a market-research query planner. Produce ONLY a JSON object of the shape
  {"firecrawl": [..], "exa": [..], "brave": [..]} — ranked query strings per leg, localized to the home
  market's language. Firecrawl/Brave queries may use `site:`; Exa queries are plain neural phrasings.
  Include marketplace and Instagram-shop patterns and category synonyms. Over-generate: at least 6
  Brave-syntax queries, so reallocated budget from a dead leg has queries to spend.

shortlist_prompt: |
  [stage:shortlist] Merge and dedupe these search rows into a shortlist of REAL, distinct competitor
  companies (never the brand itself, never marketplaces-as-companies). Produce ONLY a JSON array, at
  most {cap} items, each {"name": .., "url": ..}.

verify_prompt: |
  [stage:extract] From each candidate's page text, produce ONLY a JSON array of evidence-based competitor
  cards, exactly this closed shape per card:
  {"name","url","verified","evidence","positioning","price_tier","market_presence","source_urls"}.
  `verified` may be true ONLY with quoted evidence of market presence (ships-to, local storefront,
  marketplace listing) in `evidence`. Quote positioning from the rival's own words. Unverifiable
  candidates ship with verified=false — never dropped.

shortlist_cap: 12
verify_cap: 8

legs:
  - {name: firecrawl, cap: 4, include_market: true, num_results: 5}
  - {name: exa, cap: 4, num_results: 5}
  - {name: brave, cap: 2, is_free: true, num_results: 5}

card_schema:
  - {name: name, type: str}
  - {name: url, type: str}
  - {name: verified, type: bool, default: false}
  - {name: evidence, type: str}
  - {name: positioning, type: str}
  - {name: price_tier, type: str}
  - {name: market_presence, type: list}
  - {name: source_urls, type: list}

# {subject} = the first non-empty of brief_keys; {market} = the home market. site:/marketplace patterns.
fallback_templates:
  firecrawl:
    - "{subject} {market}"
    - "{subject} online shop {market}"
  exa:
    - "companies selling {subject} in {market}"
    - "best {subject} brands {market}"
  brave:
    - "{subject} {market}"
    - "{subject} site:instagram.com {market}"
    - "buy {subject} {market}"

brief_keys: [industry, brand_name]
subject_name_key: brand_name
demote_rule: [verified, evidence]   # verified→false unless evidence is non-empty
