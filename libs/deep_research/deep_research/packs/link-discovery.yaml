# A SECOND, deliberately-different pack — the genericity litmus (success #3). Different leg NAMES
# ("web"/"news"), a different card schema, different prompts, a different subject key. Proves the engine
# researches this with ZERO engine edit — only the pack changed.

query_plan_prompt: |
  [stage:query-plan] You are a source-discovery query planner. Produce ONLY a JSON object of the shape
  {"web": [..], "news": [..]} — ranked query strings per leg for finding authoritative pages and recent
  coverage about the topic. Over-generate news queries so reallocated budget has somewhere to go.

shortlist_prompt: |
  [stage:shortlist] Merge and dedupe these rows into a shortlist of at most {cap} distinct authoritative
  sources (one per outlet). Produce ONLY a JSON array, each {"name": .., "url": ..}.

verify_prompt: |
  [stage:extract] From each candidate's page text, produce ONLY a JSON array of source cards, exactly:
  {"name","url","credible","summary"}. `credible` is true ONLY with a datable byline/publisher in
  `summary`. Unverifiable sources ship with credible=false — never dropped.

shortlist_cap: 8
verify_cap: 4

legs:
  - {name: web, cap: 3, num_results: 5}
  - {name: news, cap: 2, is_free: true, num_results: 5}

card_schema:
  - {name: name, type: str}
  - {name: url, type: str}
  - {name: credible, type: bool, default: false}
  - {name: summary, type: str}

fallback_templates:
  web:
    - "{subject} overview {market}"
    - "{subject} official site"
  news:
    - "{subject} news {market}"
    - "latest {subject}"

brief_keys: [topic, subject]
subject_name_key: topic
demote_rule: [credible, summary]
