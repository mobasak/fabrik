name: CI

on: [push, pull_request]

jobs:
  duplicate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jscpd
        # Pinned: an unpinned bump to 5.0.9 silently re-scored pre-existing
        # duplication and tipped CI red on 2026-06-13. Bump deliberately.
        run: npm install -g jscpd@5.0.9

      - name: Install uv
        # CI bootstrap: bare pip acceptable here (no uv available yet)
        run: pip install uv

      - name: Install Python dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run duplicate check
        run: python -m scripts.enforcement.check_duplicates --report duplicate-report.json

      - name: Upload duplicate report
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-report
          path: duplicate-report.json
        if: always()
