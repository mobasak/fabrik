name: Supabase keep-alive

# Supabase free-tier projects auto-pause after ~7 days with no DATABASE activity.
# This workflow runs DAILY and registers real Postgres activity so the `fabrik`
# project stays warm without manual un-pausing.
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LESSONS LEARNED (2026-06-20 warning → 2026-06-21 actual pause)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# The original workflow pinged ONLY `/auth/v1/health` twice weekly. It passed
# successfully every Mon + Thu since setup BUT the project still got paused
# because:
#   • `/auth/v1/health` is GoTrue's own health endpoint — it NEVER touches
#     Postgres. Supabase's inactivity detector counts DB queries only.
#   • Twice-weekly cadence left 3.5-day gaps. Combined with the auth-only
#     ping (which Supabase ignored), the project saw 12+ days of "no activity"
#     before pause.
#
# CONFIRMED DEAD ENDS:
#   • `/rest/v1/<nonexistent-table>` returns HTTP 404 with PGRST205 from
#     PostgREST's own schema cache WITHOUT hitting Postgres. No activity.
#     Verified empirically by run 27881428015 on 2026-06-20.
#   • `/rest/v1/` root returns 401 for anon keys (OpenAPI spec is service_role
#     only) — masks real failures behind a false 4xx-OK.
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WHAT THIS WORKFLOW NOW DOES (post-2026-06-21 hardening)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Step 1: GET /auth/v1/health
#         Proves project is reachable + not paused/down. Does NOT count as
#         activity by itself.
#
# Step 2a: GET /rest/v1/keepalive_ping?select=*&limit=1  (PRIMARY PATH)
#          Reads the dedicated single-row table. PostgREST resolves the table
#          via its schema cache, then executes a SELECT against Postgres. HTTP
#          200 with the row = clean real DB activity. Same pattern as
#          /opt/trade-intelligence/scripts/supabase_keepalive.py (uses
#          `qualified_companies`) which has never been paused.
#
# Step 2b: POST /auth/v1/token?grant_type=password with bogus credentials
#          (FALLBACK — only runs if Step 2a returns non-200; that means the
#          keepalive_ping table was dropped, schema cache hasn't reloaded,
#          or anon GRANT was revoked).
#          GoTrue always SELECTs auth.users to verify credentials — even bogus
#          ones — before returning 400 invalid_credentials. The SELECT IS the
#          activity signal.
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# THE keepalive_ping TABLE (created 2026-06-21 via psql + pooler)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Schema as actually deployed (NOT the simpler version originally documented):
#   CREATE TABLE public.keepalive_ping (
#     id smallint PRIMARY KEY DEFAULT 1,
#     last_ping timestamptz NOT NULL DEFAULT now(),
#     CONSTRAINT keepalive_ping_singleton CHECK (id = 1)
#   );
#   GRANT SELECT ON public.keepalive_ping TO anon, authenticated;
#   ALTER TABLE public.keepalive_ping ENABLE ROW LEVEL SECURITY;
#   CREATE POLICY keepalive_ping_anon_select ON public.keepalive_ping
#     FOR SELECT TO anon, authenticated USING (true);
#
# Rationale:
#   • Singleton (id = 1) prevents row growth — table stays 24 kB forever.
#   • RLS + explicit anon policy = defense in depth (anon SELECT works,
#     INSERT/UPDATE/DELETE blocked at GRANT + RLS layers).
#   • Single column `last_ping` allows future enhancement (UPSERT to record
#     the workflow's own activity timestamp — currently SELECT-only).
#
# To recreate the table from scratch (e.g., new project), connect via:
#   psql "postgresql://postgres.${REF}:${SUPABASE_DB_PASSWORD}@aws-0-${REGION}.pooler.supabase.com:6543/postgres"
# Then run the schema above + `NOTIFY pgrst, 'reload schema';` to refresh
# PostgREST's cache so HTTP 200 is immediate (otherwise ~10 minutes).
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# OPERATOR SETUP (one-time, already done)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Repo secret: SUPABASE_FABRIK_ANON_KEY (Supabase dashboard → Project Settings
# → API → anon public key). The project ref is not secret.
#
# Optional future-proofing (not yet done): add SUPABASE_ACCESS_TOKEN repo
# secret with a `sbp_*` PAT from https://supabase.com/dashboard/account/tokens
# — this would let a future workflow auto-restore if a pause ever does happen
# via POST https://api.supabase.com/v1/projects/{ref}/restore.
#
# Scope: keeps ONLY `fabrik` warm. `trade-intelligence` runs its own keepalive
# via WSL systemd timer (queries `qualified_companies`). `ComplianceDesk` is
# left paused intentionally.

on:
  schedule:
    # DAILY at 06:00 UTC. Was Mon+Thu, but 2026-06-21 pause incident
    # demonstrated the twice-weekly cadence + auth-only ping combo left no margin:
    # last successful Thu run was 2026-06-18; pause email arrived 2026-06-21 before
    # the next Mon run. Daily cadence + real DB activity (auth.users SELECT via bogus
    # token or keepalive_ping table SELECT) gives 7x more chances to register activity
    # within Supabase's 7-day inactivity window.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  # Serialize runs but NEVER cancel in-flight. The whole point of this workflow
  # is to register DB activity — cancelling a running ping (e.g., manual test
  # racing the scheduled run) would defeat the purpose. Queue instead.
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Cap the job — curl --max-time 30 means each ping is bounded; the whole
    # job should finish in under 60s. 5 minutes is a generous ceiling.
    timeout-minutes: 5
    steps:
      - name: Ping fabrik (auth health + DB activity)
        env:
          REF: xjmsceegyztgtcpywhry
          KEY: ${{ secrets.SUPABASE_FABRIK_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::SUPABASE_FABRIK_ANON_KEY secret not set — add it in repo settings (see workflow header)."
            exit 1
          fi

          # ── Step 1: Auth health (reachability check, no DB hit) ──
          auth_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" "https://${REF}.supabase.co/auth/v1/health")
          echo "fabrik /auth/v1/health returned HTTP $auth_code"
          case "$auth_code" in
            200) echo "auth-health OK (project reachable)" ;;
            401|403) echo "::error::auth failed (HTTP $auth_code) — anon key wrong/disabled"; exit 1 ;;
            *) echo "::error::fabrik unreachable (HTTP $auth_code) — project may be paused or down"; exit 1 ;;
          esac

          # ── Step 2: DB activity ping ──
          # Try the operator-created keepalive_ping table first (if it exists);
          # fall back to bogus-auth token grant (always hits auth.users in Postgres).

          # Step 2a (optional, only if operator created the table per workflow header):
          # GET /rest/v1/keepalive_ping?select=*&limit=1
          db_resp=$(curl -s --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -w "\nHTTP_CODE:%{http_code}" \
            "https://${REF}.supabase.co/rest/v1/keepalive_ping?select=*&limit=1")
          db_code=$(echo "$db_resp" | grep -oP 'HTTP_CODE:\K[0-9]+')
          db_body=$(echo "$db_resp" | sed 's/HTTP_CODE:[0-9]*$//' | head -c 500)
          echo "fabrik /rest/v1/keepalive_ping returned HTTP $db_code"
          if [ "$db_code" = "200" ]; then
            echo "✅ DB activity OK via keepalive_ping table (real Postgres SELECT, cleanest signal)"
            echo "✅ Both pings succeeded — fabrik keep-alive complete"
            exit 0
          fi
          echo "keepalive_ping table not present (got $db_code) — falling back to auth-token ping"

          # Step 2b (fallback, always works): POST /auth/v1/token with bogus creds.
          # GoTrue looks up the email in auth.users → not found → returns 400.
          # The auth.users SELECT is the activity signal.
          tok_resp=$(curl -s --max-time 30 -X POST \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"email":"keepalive-ping-no-such-user@invalid.fabrik.test","password":"x"}' \
            -w "\nHTTP_CODE:%{http_code}" \
            "https://${REF}.supabase.co/auth/v1/token?grant_type=password")
          tok_code=$(echo "$tok_resp" | grep -oP 'HTTP_CODE:\K[0-9]+')
          tok_body=$(echo "$tok_resp" | sed 's/HTTP_CODE:[0-9]*$//' | head -c 500)
          echo "fabrik /auth/v1/token returned HTTP $tok_code"
          echo "body: $tok_body"
          case "$tok_code" in
            # 400 with "invalid_grant" or "invalid_credentials" = auth.users was queried
            # in Postgres → activity registered. This is the success path.
            400)
              if echo "$tok_body" | grep -qE '"error":"invalid_grant"|"error_code":"invalid_credentials"|"code":"invalid_credentials"'; then
                echo "✅ DB activity OK via auth.users SELECT (bogus token request → invalid_grant)"
              else
                echo "::warning::unexpected 400 body: $tok_body — counting as success anyway since GoTrue must have queried Postgres"
              fi
              ;;
            # 200 means we accidentally guessed valid creds (impossible — would be a
            # major security incident). Bail loudly.
            200)
              echo "::error::keepalive returned HTTP 200 — bogus creds somehow validated. SECURITY: rotate anon key + investigate."
              exit 1
              ;;
            *)
              echo "::error::auth-token ping failed (HTTP $tok_code): $tok_body"
              exit 1
              ;;
          esac

          echo "✅ Both pings succeeded — fabrik keep-alive complete (auth reachable + auth.users SELECT registered as DB activity)"
