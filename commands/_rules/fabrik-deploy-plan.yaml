/run/fabrik-autoheal/pause.owner || echo OWNERSHIP-LOST'\"` — the guard proves BOTH files live before refreshing (a heartbeat that silently re-created a vanished pause would hide that the healer was LIVE during the gap), so an `OWNERSHIP-LOST` heartbeat means the window is no longer intact — ours taken, or the pause gone — and the sensitive step STOPS while the deploy's fresh two-file probe disambiguates (theft → the halt protocol; vanished → the deploy's full re-open procedure); NEVER re-take a lost window (a bare touch or redirect gets Permission denied; the deploy executes the runbook verbatim and may not add sudo mid-run); wait for a `PAUSED` line newer than the touch in the healer's log before starting the sensitive step — BOUNDED: the healer ticks every minute, so no `PAUSED` line within 5 minutes means its cron is absent or wedged on that target → the deploy halts; author no unbounded wait (an already-in-flight healer tick is not retroactively paused); the close step is STEM-GUARDED — tested form, single-backslash `\\\"` escapes, operators-AND-their-arguments whole at end-of-line when wrapping: `ssh <alias> \"sudo bash -c '[ -f /run/fabrik-autoheal/pause.owner ] && grep -q \\\"^<plan-stem> \\\" /run/fabrik-autoheal/pause.owner && rm -f /run/fabrik-autoheal/pause /run/fabrik-autoheal/pause.owner || echo OWNERSHIP-LOST'\"` (removes ONLY while the owner still carries this plan's stem — a >2h suspension can hand the window to another actor: never remove theirs; the step's VERIFICATION is CONDITIONAL, never rc alone (`OWNERSHIP-LOST` exits 0): PASS = both files gone, OR the output is `OWNERSHIP-LOST` with a FOREIGN owner confirmed by a fresh `cat` — FOREIGN means the owner's FIRST TOKEN is not THIS plan's stem; a non-empty owner is not itself foreign (the window is closed FOR US — proceed, noting it); both files present WITHOUT a foreign owner = the `rm` itself failed (read-only fs, EBUSY) → step failure; `pause` GONE with `pause.owner` still OURS = a partial `rm` (a half-landed close) — re-run the guarded close ONCE (the guard passes on our own owner and removes the orphan); `pause` present with owner ABSENT = FOREIGN — the operator's own bare-touch-no-owner contract per the healer's header: NEVER remove it, the conservative default; any OTHER outcome → the conservative default: stop, report the raw state, never remove foreign files — the 2h self-heal bounds residue) — ordered so the close comes AFTER any rollback the window's steps might need"
