- id: dp-status-literal
  # class: grammar
  baseline: 'Status-literal convention: arrows in this document describe TRANSITIONS — the plan FILE always carries only the target literal (`Status: CONVERGED`, `Status: IN-PROGRESS`, `Status: BLOCKED — <step> <why>`, `Status: EXECUTED <date>`; an arrow written into the file makes the status invisible to every gate regex)'
