- id: dp-end-halted
  # class: ban
  baseline: 'Halted — two flavors, both complete and honest: (a) a RUNBOOK/BATTERY halt (Phases 1-3) ran the full halt protocol (Phase 2 step 3: rollbacks per the plan with fenced proof, the `⛔` ledger row, the window closed, the literal line `Status: BLOCKED — <step id> <why>` — the file carries only the target status, never arrow notation — committed AND pushed) and the `BLOCKED: <step> — <evidence> — <rollback taken>` report names the route back (`/fabrik-deploy-plan-review`); (b) an ADMINISTRATIVE stop (Phase 5 — a missing record, an unconfirmable window) NEVER unwinds the live deploy: the service stays up, nothing rolls back, the plan stays `IN-PROGRESS`, and the report reads `BLOCKED: <admin issue> — deploy LIVE, close-out incomplete — operator decision`'
  text:
  - 'a RUNBOOK/BATTERY halt (Phases 1-3) ran the full halt protocol (Phase 2 step 3: rollbacks per the plan with fenced proof, the `⛔` ledger row, the window closed, `Status: BLOCKED` committed AND pushed)'
  - 'an ADMINISTRATIVE stop (Phase 5) NEVER unwinds the live deploy: the service stays up, nothing rolls back, the plan stays `IN-PROGRESS`, and the report reads `BLOCKED: <admin issue> — deploy LIVE, close-out incomplete — operator decision`'
  - 'The successor: once the issue resolves, a re-dispatch whose ledger shows EVERY runbook step `✅` and the battery green runs the CLOSE-OUT ONLY (Phase 5 alone — gate 2''s one `IN-PROGRESS` acceptance; it never re-runs the runbook)'
