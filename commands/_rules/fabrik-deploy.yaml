  - '`pause` absent, OUR stem, an orphan owner or a ≥2h foreign pause → OPEN (ONE invocation, as root — a bare redirect runs as the login user and is denied; OWNER FIRST, pause second)'
  - ssh <alias> "sudo bash -c 'mkdir -p /run/fabrik-autoheal && printf \"%s %s\n\" <plan-stem> <ISO-8601-UTC> > /run/fabrik-autoheal/pause.owner && touch /run/fabrik-autoheal/pause'"
  - 'then capture the touch timestamp and verify BOTH landed (fenced `stat` + `cat pause.owner`): a different stem = a clobber race → the halt protocol, removing nothing; owner OURS with the pause missing → re-run the full open ONCE and re-verify, still short = step failure → the halt protocol'
  - A LIVE foreign pause → wait (60s/bound), still live → the halt protocol
- id: dp-win-confirm
  # class: ban
  baseline: 'Confirm the window is live BEFORE the sensitive step starts: `sudo journalctl -t fabrik-autoheal --since ''<the touch timestamp>''` shows a `PAUSED` line newer than the touch (the `sudo` is load-bearing: the fleet user is not in `adm`/`systemd-journal`, and an unprivileged read returns rc=0 with NO entries — a false "nothing found"; the healer ticks every minute and an in-flight tick is not retroactively paused)'
  text:
  - 'Confirm the window is live BEFORE the sensitive step: `sudo journalctl -t fabrik-autoheal --since ''<the touch timestamp>''` must show a `PAUSED` line newer than the touch (the `sudo` is load-bearing: the fleet user is not in `adm`/`systemd-journal`, so an unprivileged read returns rc=0 with NO entries; an in-flight tick is not retroactively paused)'
  - 'BOUNDED: no `PAUSED` line within 5 minutes → the halt protocol — never start the sensitive step on an unconfirmed window'
  - 'A `SKIP-RUN` line is an ACTIVE-healer signal, never a benign transient: a previous healer instance STILL HOLDS the run lock — keep waiting for `PAUSED` within the same bound, starting nothing while `SKIP-RUN` is the latest word'
- id: dp-win-close
  # class: ban
  baseline: A shell `trap` is NOT a safety net here — each command runs in a fresh shell, so an `EXIT` trap fires when that call ends, not when the deploy does
  text:
  - A shell `trap` is NOT a safety net here — each command runs in a fresh shell, so an `EXIT` trap fires when that call ends, not when the deploy does
  - The closing `rm` of BOTH files, STEM-GUARDED (it verifies `pause.owner` carries THIS plan's stem; on lost ownership never remove theirs, note `OWNERSHIP-LOST` and treat the window as closed for us), is an explicit runbook step
  - On a halt, rollbacks needing the window run FIRST, then close it (BOTH files, fresh `stat` on each) as the LAST target act. If the session dies outright, the pause's 2h staleness self-heal is the last-resort backstop
- id: dp-win-expiry
  # class: ban
  baseline: 'The pause expires at 2h — a window that can run longer re-`touch`es both files at each step boundary per the plan''s labeled STEM-GUARDED heartbeat steps (the guard proves BOTH files live before refreshing — it never silently re-creates a vanished pause) — an `OWNERSHIP-LOST` heartbeat is DISAMBIGUATED by a fresh probe of both files: owner FOREIGN → the window expired and another actor took it — the sensitive step STOPS (the halt protocol; the thief''s own touch keeps the healer paused, but that protection is BORROWED and revocable without notice — run the rollbacks promptly and record that); the pause ABSENT (owner still OURS, or both files gone — a reboot (`/run` is tmpfs), a cleanup, or the healer header''s documented operator `rm`) → the window VANISHED and the healer may have been LIVE during the gap — FIRST read its actions: `sudo journalctl -t fabrik-autoheal --since ''<the last successful touch>''` — a `RESTARTED` line naming a container this deploy touches means the sensitive work was interfered with → the halt protocol, never a resume (an unrelated `RESTARTED` proves the gap was live — record it in the ledger row); a clean log → RE-OPEN via the plan''s FULL open procedure — verify both landed AND re-confirm the PAUSED line before the sensitive work resumes (step 2''s 5-minute bound and its `SKIP-RUN` rule apply — and post-reboot `SKIP-RUN` is IMPOSSIBLE: the lock died with the tmpfs, so silence there just means cron has not ticked yet, while a `SKIP-RUN` line means a live instance is restarting containers RIGHT NOW)'
  text:
  - The pause expires at 2h — a longer window re-`touch`es both files at each step boundary via the plan's STEM-GUARDED heartbeat steps (the guard proves BOTH files live before refreshing — it never silently re-creates a vanished pause); never trust a single touch past 2h. On `OWNERSHIP-LOST`, probe both files fresh
  - 'owner FOREIGN → another actor took the window: the sensitive step STOPS (the halt protocol; the thief''s touch keeps the healer paused, but that protection is BORROWED and revocable without notice — roll back promptly and record that)'
  - 'pause ABSENT (owner still OURS, or both files gone — a reboot (`/run` is tmpfs), a cleanup, or the healer header''s documented operator `rm`) → the healer may have been LIVE: FIRST read `sudo journalctl -t fabrik-autoheal --since ''<the last successful touch>''`'
  - 'A `RESTARTED` line naming a container this deploy touches → the halt protocol, never a resume (an unrelated `RESTARTED` proves the gap was live — record it in the ledger row); a clean log → RE-OPEN via the plan''s FULL open procedure, verify both landed AND re-confirm `PAUSED` (step 2''s 5-minute bound and its `SKIP-RUN` rule apply — post-reboot `SKIP-RUN` is IMPOSSIBLE: the lock died with the tmpfs, so silence there just means cron has not ticked yet, while a `SKIP-RUN` line means a live instance is restarting containers RIGHT NOW)'
  - NEVER re-take a window another actor HOLDS
- id: dp-win-conservative
  # class: ban
  baseline: 'ANY other outcome (owner absent with the pause present — always FOREIGN, the operator''s own bare-touch contract; OUR stem AND the pause both still on disk after an `OWNERSHIP-LOST` — a guard/probe contradiction; an unrecognized output) → the CONSERVATIVE default: stop the sensitive work, run the halt protocol promptly, never remove foreign files, report the raw state — the 2h self-heal bounds every residue. Never trust a single touch past 2h'
  text:
  - 'ANY other outcome (owner absent with the pause present — always FOREIGN, the operator''s own bare-touch contract; OUR stem AND the pause both still on disk after an `OWNERSHIP-LOST` — a guard/probe contradiction; an unrecognized output) → the CONSERVATIVE default: stop the sensitive work, run the halt protocol promptly, never remove foreign files, report the raw state — the 2h self-heal bounds every residue'
- id: dp-opgate
  # class: behavioural
  baseline: 'An `OPERATOR-GATE` step is never run BY YOU — it is a mid-session operator handoff, in two shapes the plan declares per step: verify-in-session (the act''s result is immediately checkable — e.g. notarization before a staple) → name the exact act and its expected result, then END THE TURN on that handoff — first PUSH the ledger commits (the task-end law binds mid-run pauses too; an unpushed suspension gets hook-blocked), and close the turn with the block below, written as plain lines, not inside a code fence:'
  text:
  - An `OPERATOR-GATE` step is never run BY YOU — it is a mid-session operator handoff, in two shapes the plan declares
  - verify-in-session (result immediately checkable) → name the exact act and its expected result, PUSH the ledger commits first, then END THE TURN with this block, written as plain lines, not inside a code fence
  - Keep promise/obligation constructions ('I'll run it', '<work> is outstanding') out of the `STATE:` line and every other line; the well-formed block itself, never a bare `NEXT:` phrase, that the deferral check exempts
- id: dp-halt-reply
  # class: ban
  baseline: with the `STATE:` line (and every other line) free of promise/obligation constructions ('I'll run it', '<work> is outstanding') — it is the well-formed block itself, never a bare `NEXT:` phrase, that the deferral check exempts — and on the operator's reply run the step's VERIFICATION column and continue; verify-deferred (the act's result is inherently slow — a store review measured in days) → the handoff IS this surface's completion
  text:
  - On the reply run the step's VERIFICATION column; "halt" or a refusal → the halt protocol
- id: dp-deferred
  # class: grammar
  baseline: with the `STATE:` line (and every other line) free of promise/obligation constructions ('I'll run it', '<work> is outstanding') — it is the well-formed block itself, never a bare `NEXT:` phrase, that the deferral check exempts — and on the operator's reply run the step's VERIFICATION column and continue; verify-deferred (the act's result is inherently slow — a store review measured in days) → the handoff IS this surface's completion
  text:
  - verify-deferred (inherently slow, e.g. a store review) → the handoff IS the completion
  - 'The deferred-gate battery rule: when the NEXT step is the terminal DEFERRED gate, run the battery FIRST, write AND COMMIT `— ✅ BATTERY <UTC timestamp> <n>/<n> PASS`, and verify the row exists before the handoff print'
  - Then print the Gate-2 handoff ONCE (Phase 4), write AND COMMIT `— ✅ <step id> <UTC timestamp> HANDED-OFF`, and close out
  - A deferred gate is by AUTHORING RULE the runbook's FINAL step (the review enforces this); runbook steps AFTER it are a plan defect → the halt protocol
- id: dp-fail
  # class: prose
  baseline: 'On failure — the plan''s `retryable` column decides, then the HALT PROTOCOL (ending 2) runs:'
  text:
  - 'On failure the plan''s `retryable` column decides: a retryable step → up to twice more (three attempts); rollback is the exit action of an abandoned step, not a between-attempts reflex (apply per-attempt cleanup only where the plan''s rollback column orders it); a non-retryable step → its FIRST failure is terminal'
- id: dp-halt-protocol
  # class: ban
  baseline: 'The halt protocol, in order: execute the failed step''s rollback and prove it landed (fenced output); execute the plan''s rollback for every step THIS run completed that requires it (inside the maintenance window where they need it — Phase 1 step 3; a `NON-RERUNNABLE` step''s surviving effects are recorded, not improvised around); close any window THIS RUN OPENED (BOTH files, verified — a foreign pause on the target is NEVER removed: it is a sibling''s or the operator''s, and the tolerance-exceeded halt path by definition holds no window of its own); write'
  text:
  - 'Then the halt protocol, in order: execute the failed step''s rollback and prove it landed (fenced output); execute the plan''s rollback for every step THIS run completed that requires it (inside the window where needed; a `NON-RERUNNABLE` step''s surviving effects are recorded, not improvised around); close any window THIS RUN OPENED (BOTH files, verified — a foreign pause on the target is NEVER removed: it is a sibling''s or the operator''s, and the tolerance-exceeded halt path by definition holds no window of its own)'
  - 'write + commit the `⛔` row (its `<rollback taken>` field lists exactly what was unwound and what deliberately survived); set the literal line `Status: BLOCKED — <step id> <why>`, commit AND push; report `BLOCKED: <step> — <evidence> — <rollback taken>` naming `/fabrik-deploy-plan-review`'
  - 'No improvisation: an unanticipated situation is a plan defect — the same protocol, PLAN-DEFECT flavor; never redesign the deploy mid-run'
- id: dp-battery
  # class: ban
  baseline: Run the plan's verification battery in full — write-path probe, queue-drain, companion reachability, cert/ACME diagnostics, same-origin probes for VPS; installability + first-run smoke for stores — as the plan authored for its surface — each item PASS with fenced output; on full PASS write + commit the ledger row `— ✅ BATTERY <UTC timestamp> <n>/<n> PASS` (the record the close-out-only re-entry keys on)
  text:
  - Run the plan's verification battery in full — write-path probe, queue-drain, companion reachability, cert/ACME diagnostics, same-origin probes for VPS; installability + first-run smoke for stores — as the plan authored for its surface, each item PASS with fenced output; on full PASS write + commit `— ✅ BATTERY <UTC timestamp> <n>/<n> PASS` (the record the close-out-only re-entry keys on)
  - 'Any FAIL means the deploy is NOT done: fix via the plan''s rollback/retry path or run the halt protocol (a rollback needing healing protection RE-OPENS a window via Phase 1''s full procedure and closes it last)'
  - Never report a deploy complete on a partial battery
- id: dp-store-credential
  # class: ban
  baseline: 'Mobile / extension / desktop runbooks (and a VPS runbook with a deferred terminal gate — same flow, ''artifact'' = the SHA + target) execute up to — never through — the operator''s gated act: build the artifact from the pushed SHA (for the DEFERRED shape the battery already ran in Phase 2 — its branch verifies the `✅ BATTERY` row before its print; an in-session-terminal runbook batteries AFTER the runbook per Phase 3 — the exit gate binds every surface at its own slot), prepare listing/rollout content'
  text:
  - 'Mobile / extension / desktop runbooks (and a VPS runbook with a deferred terminal gate — same flow, ''artifact'' = the SHA + target) execute up to — never through — the operator''s gated act: build the artifact from the pushed SHA (for the DEFERRED shape the battery already ran in Phase 2 — its branch verifies the `✅ BATTERY` row before its print; an in-session-terminal runbook batteries AFTER the runbook per Phase 3 — the exit gate binds every surface at its own slot), prepare listing/rollout content'
  - 'The credential rule: publish acts and ALL store-dashboard actions are the operator''s — no upload, no draft submission, no dashboard click, whatever a plan says (a plan cannot sanction what the corpus forbids — that contradiction is a plan defect: the halt protocol, PLAN-DEFECT flavor)'
  - A credentialed BUILD step is legal only where the release path already runs it (cloud `eas build` — `/fabrik-release`'s own MOBILE step); any other credentialed act (an Apple notarization submission, a signing service) is `OPERATOR-GATE` — executed as Phase 2 step 1's handoff, its shape (in-session vs deferred) per the plan's declaration
- id: dp-store-handoff
  # class: prose
  baseline: 'For the DEFERRED shape the handoff print already happened in Phase 2 — never repeat it; its content is defined per the convention `/fabrik-release`''s surface paths define — the artifact (path/build id; VPS analogue: the SHA + target), the checklist verdicts, and the one action only the human takes — and proceed to Phase 5, the completion stamp recording "handed to the operator gate: <the action>"'
  text:
  - 'For the DEFERRED shape the handoff print already happened in Phase 2 — never repeat it; a terminal IN-SESSION gate already handed off there needs no second print. Its content is defined per the convention `/fabrik-release`''s surface paths define and states the artifact (path/build id; VPS: the SHA + target), the checklist verdicts and the one human action; Phase 5''s stamp records "handed to the operator gate: <the action>"'
- id: dp-window-closed
  # class: ban
  baseline: Confirm the maintenance window is closed FIRST (VPS surfaces whose plan bracketed a window — store surfaces and windowless plans skip this step)
  text:
  - 'Confirm the window is closed FIRST (VPS plans that bracketed one — store surfaces and windowless plans skip this step): every `window-close` row `✅` (of the COMPLETED run, on a close-out-only re-dispatch) AND no `pause` or `pause.owner` carries OUR stem (fenced `stat` + `cat`)'
  - An OUR-stem leftover → re-run our stem-guarded `window-close` ONCE (verify both files gone, never rc alone); still there → ending 2b (admin stop — deploy LIVE; report the stuck close; the pause self-heals at 2h), as is the probe itself failing (target unreachable post-deploy) — never unwind
  - 'A foreign or ownerless pause is NOT ours (an operator''s or a sibling''s — the triad always writes our stem with our pause): never remove it; note it in the report and proceed'
- id: dp-review-artifact
  # class: ban
  baseline: Verify the review artifact exists on disk (`ls docs/development/reviews/<plan-stem>-review.md`)
  text:
  - Verify the review artifact exists (`ls docs/development/reviews/<plan-stem>-review.md`)
  - Missing → `git log --oneline --diff-filter=AM -- <path> | head -1` (never a lowercase `--diff-filter=d`, which silently returns NOTHING), then `git restore --source <that commit> -- <path>` and `git add` it
  - 'Never in history → `BLOCKED: convergence record missing — operator decision (the deploy is live; the record must be regenerated honestly, never fabricated)`'
- id: dp-executed
  # class: grammar
  baseline: 'Write the literal `Status: EXECUTED <date>` + a one-line completion stamp (what shipped — or the store handoff — and the battery verdict) — and mint the `docs/DECISIONS.md` row for it in this same flip commit (the ledger duty''s "built X at Y" trigger: what deployed, where, the battery verdict; classified at mint — a routine deploy is reversible-by-redeploy, the plain row suffices) — citing `Whole-plan review: docs/development/reviews/<plan-stem>-review.md` (`check_convergence.py` refuses an `EXECUTED` plan without that stem-matched, quiet-pass citation), and archive (`git mv docs/development/plans/<plan>.md docs/development/plans/archived/<plan>.md`)'
  text:
  - 'Write the literal `Status: EXECUTED <date>` + a one-line stamp (what shipped or the store handoff, and the battery verdict) — and mint the `docs/DECISIONS.md` row for it in this same flip commit (the ledger duty''s "built X at Y" trigger: what deployed, where, the battery verdict; classified at mint — a routine deploy is reversible-by-redeploy, the plain row suffices)'
  - 'citing `Whole-plan review: docs/development/reviews/<plan-stem>-review.md` (`check_convergence.py` refuses an `EXECUTED` plan without that stem-matched, quiet-pass citation), and archive (`git mv docs/development/plans/<plan>.md docs/development/plans/archived/<plan>.md`)'
- id: dp-commit-push
  # class: grammar
  baseline: Commit the flip + archive + the step-3 `docs/DECISIONS.md` row — plus the recovered artifact when step 2's recovery ran — together (ONE commit; explicit pathspecs covering the ledger row AND BOTH halves of the `git mv` — committing the destination alone leaves the pre-flip plan alive at the old path, a proven double-deploy vector — with the provenance trailers) and PUSH — an uncommitted flip is an unfinished task, and an unpushed one can be silently reverted by the next pre-commit stash cycle, losing the record that the deploy ran
  text:
  - Commit the flip + archive + the `docs/DECISIONS.md` row (+ any recovered artifact) together (ONE commit; explicit pathspecs covering the ledger row AND BOTH halves of the `git mv`
  - with the provenance trailers) and PUSH
- id: dp-handoff
  # class: behavioural
  baseline: 'Hand off — `/fabrik-deploy-verify` (VPS: fresh-probe certification of the live service — the hand-off names the contract version and the container leg the plan was authored against, so the verify run''s Phase 0 header read and Phase 6 legs are checked against the SAME facts this deploy pre-flighted) or, for store surfaces, the operator''s publish act — stated as the block below, written as plain lines, not inside a code fence:'
  text:
  - Hand off — `/fabrik-deploy-verify` (VPS; name the contract version and container leg the plan was authored against) or, for stores, the operator's publish act, as this block written as plain lines, not inside a code fence
