  baseline: '`Status: CONVERGED` — the ONLY executable status (allowlist, not denylist). Anything else refuses with its route: `DRAFT`/`PLANNED` → `run /fabrik-deploy-plan-review first` · `BLOCKED` → `a halted deploy — the review''s re-entry re-converges it` · `IN-PROGRESS` → ONE narrow acceptance: a ledger showing every runbook step `✅` + the `✅ BATTERY` row = an admin-stopped COMPLETE deploy → run Phase 5 (close-out) only; any other `IN-PROGRESS` → `a deploy is live or died mid-run — operator confirms it is dead, then the review audits the ledger and flips it BLOCKED` · `EXECUTED` → `consumed — author a new plan` · absent/unrecognized → `not a deploy plan` · a `CONVERGED` plan whose ledger''s LATEST run shows every step `✅` + `✅ BATTERY` → refuse (`a completed deploy re-converged without consuming its record — operator decision: /fabrik-deploy-verify or a new plan`) · and even at `CONVERGED`, an UNADJUDICATED `⛔ PLAN-DEFECT` row refuses (`the recorded defect was never re-converged — run /fabrik-deploy-plan-review`; mechanical — read the rows, don''t re-judge)'
