  - 'ONE acceptance: every runbook step `✅` + the `✅ BATTERY` row = an admin-stopped COMPLETE deploy → Phase 5 only'
  - '`a deploy is live or died mid-run — operator confirms it is dead, then the review audits the ledger and flips it BLOCKED`'
  - '`EXECUTED` → `consumed — author a new plan`'
