- id: dp-fresh-run
  # class: prose
  baseline: 'Every dispatch is a FRESH run of a CONVERGED plan — there is no mid-runbook resume protocol: a halted deploy unwinds (the rollback columns exist precisely for this), routes back through `/fabrik-deploy-plan-review`, and returns as an AMENDED, re-converged plan whose runbook already accounts for anything that deliberately survived the halt'
