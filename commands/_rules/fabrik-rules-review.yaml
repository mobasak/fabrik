  baseline: 'PROJECT mode (any `/opt/<project>` with a `project.yaml`): audit THIS project''s code against its synced packs ¦ The packs are a read-only synced copy here (gate: `check_synced_unmodified.py`) — never edit them locally; a defect IN a pack (contradiction, false-positive, dead glob) discovered mid-audit is recorded as a finding and filed upstream via `/fabrik-upstream`, never fixed in place'
