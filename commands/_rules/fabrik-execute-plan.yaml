- id: e17-the-fabrik-review-at-a-phase-boundary
  # class: behavioural
  baseline: The `/fabrik-review` at a phase boundary opens its OWN nested record — the storage parks this run in the record's `stack` and the child's `done` restores it (01M280CV7) — so a green phase gate never reads as "the plan is done" — and every close NAMES its own run, so a retried `done` from the nested review can never end the plan by accident (it is refused)
