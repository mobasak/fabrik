  baseline: 'When enumerating a live Postgres, the enumeration is bounded two ways and must be un-bounded explicitly (youtube 01M17T8Z — the documented method would have shipped a FROZEN contract silently missing 7 of 79 real entities, 3 of them carrying a live production bug): (1) enumerate ALL non-system schemas via `information_schema.schemata` first — never assume `public`; (2) cross-check the table + FK counts via `pg_class`/`pg_constraint` directly (privilege-agnostic) — `information_schema` respects SELECT privilege and silently hides every table the connecting role has no GRANT on (`pg_class.relacl IS NULL` ⇒ invisible), so its count is "visible to this role in N", never "exists"'
