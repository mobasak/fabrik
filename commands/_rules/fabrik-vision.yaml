    baseline: "# Vision Summary: [Product Name] ⏎  ⏎ ## Product Vision ⏎ [3-5 sentences. What is this product? What problem does it solve? For whom? Derived from research — not invented.] ⏎  ⏎ ## Personas ⏎ - **[Name]** — [who they are, what they need] ⏎  ⏎ ## Value Streams ⏎ [How this product generates value — revenue, cost savings, productivity. Any BEAT problem-to-solve from ⏎ the rivals dossier (Phase 2) that survived Phase 3's reality-challenges is here too, citing the dossier ⏎ row it came from — a BEAT candidate with no citation is not grounded.] ⏎ - [Stream 1] ⏎  ⏎ ## Full Feature Inventory ⏎ [Every feature the vision describes, numbered. This is the COMPLETE scope. Nothing silently dropped. ⏎ Any MATCH candidate from the rivals dossier (Phase 2) that survived Phase 3's reality-challenges is here ⏎ too, citing the dossier row it came from — a MATCH candidate with no citation is not grounded.] ⏎ 1. [Feature name] — [one-line description] (small/medium/large) [— dossier: <row>, if a MATCH candidate] ⏎  ⏎ ## Backing Services (from VPS) ⏎ [Which existing VPS services this vision will use — grounded in agents-fabrik.md] ⏎ - postgres-main:5432 — [what for] ⏎ - redis-main:6379 — [what for] ⏎  ⏎ ## External Services ⏎ [Third-party dependencies outside the VPS. Each MUST be live-grounded per Phase 3 — a memory-based ⏎ claim is a defect. No entry ships without a cited source + fetch date.] ⏎ - [Service] — [what for] · [cost tier + REAL pricing] · [rate limits / auth model] · **source:** [URL] (fetched YYYY-MM-DD) ⏎  ⏎ ## Technology Decisions ⏎ [Every major technology choice RESOLVED — not deferred. /fabrik-epics reads these and does NOT ⏎ re-decide them. Fill ONLY bullets relevant to this vision — omit N/A bullets entirely. Any pricing-wedge ⏎ finding from the rivals dossier (Phase 2) that shapes a positioning-adjacent choice below cites the ⏎ dossier's wedge row.] ⏎ - **Auth:** [`fabrik-lib/fastapi-user-auth` Pattern A (user-facing, DEFAULT — the app issues its own JWTs) ⏎ + Authelia (admin) / Authelia only / custom — state which and why. Supabase Auth is legacy/migration-only ⏎ per `agents-fabrik.md § Supabase` — pick it only for a project already on it.] ⏎ - **Database:** [postgres-main (DEFAULT) / Supabase (legacy — plan migration) — state which holds what] ⏎ - **Search:** [MeiliSearch / pgvector / none] ⏎ - **Billing:** [Paddle (international MoR) / iyzico (Turkish domestic) / RevenueCat + IAP (mobile digital ⏎ goods — Paddle does NOT apply in-app) / none — state pricing model. Stripe is NOT available to a TR entity.] ⏎ - **File storage:** [`fabrik-lib/storage` (Backblaze B2 backend, DEFAULT) / none — state what's stored. ⏎ Supabase Storage is legacy/migration-only.] ⏎ - **Notifications (internal/ops):** [Apprise (already deployed) / direct API / none] ⏎ - **Email (transactional):** [Resend (default, 3k/mo free) / escalate to Postmark for critical auth mail — ⏎ state what triggers emails] ⏎ - **Email (marketing):** [Resend Broadcasts (start) / Listmonk + SES (at scale) / none — MUST be a ⏎ separate stream from transactional] ⏎ - **RAG pipeline:** [none / search-only (embeddings + retriever) / search + classification / full ⏎ intelligence (+ generator + summarizer) — state what corpus is being searched and what users need from ⏎ it. See `.windsurf/rules/core/65-rag-search.md § Epic Decomposition` for the component guide.] ⏎ - **Background processing:** [file-worker needed? state what runs async: transcription, PDF gen, AI ⏎ inference, batch imports, scheduled jobs / none] ⏎ - **Consumed microservices:** [site-provisioner for DNS / none — image-broker is retired/not deployed] ⏎ - **Watchdog sidecar + cost-budget:** [**accept-defaults** (state the values you are accepting — read them ⏎ from `WatchdogConfig`) / **raise** (state the per-project `daily_budget_usd` + `daily_invocations_cap` ⏎ per `cost-budget.md`) / **opt-out** (`watchdog: {enabled: false}` — no paid AI APIs / no cost-sensitive ⏎ ops) — ⚠️ `cost-budget.md:28` makes the **cost CAP** mandatory for any project that runs the watchdog (or ⏎ calls paid AI APIs); it does **not** mandate the watchdog itself — and on the `fabrik apply` path the ⏎ sidecar is **on by default** regardless, so the live question is the cap, not the sidecar. Without a cap ⏎ a feedback loop (the sidecar diagnosing the sidecar) could empty the budget overnight] ⏎ - **Domain structure:** [subdomains needed, e.g., api.X, app.X, admin.X] ⏎ - **Scaffold types:** [list all scaffold types this vision needs. Valid: python-api, python-api-gpu, ⏎ node-api, saas-skeleton, file-api, file-worker, docusaurus, chrome-extension, mobile-app, desktop-app, ⏎ static-site. **wordpress is NOT a valid type here.**] ⏎ - **Target host (per service, `target_vps:`):** [`vps1` (hub, default) / `vps2` or `vps3` (spoke)] ⏎ - **Documentation site:** [SaaS scaffolds: vendor `/opt/fabrik-lib/docs-site/`. Non-SaaS: N/A] ⏎  ⏎ ## fabrik-lib Verdict ⏎ [One row per capability. \"Didn't check fabrik-lib\" is a defect.] ⏎  ⏎ | Capability | Verdict | Module + one-line why | Upstream note | ⏎ |---|---|---|---| ⏎ | [end-user auth] | vendor | `fastapi-user-auth` — Pattern A covers it | — | ⏎ | [PDF export] | vendor+enhance | `pdf-extract` — needs one new adapter | `UPSTREAM_FEEDBACK.md` | ⏎ | [the novel core] | build | nothing fits because [why] | 🆕 fabrik-lib candidate: `name · purpose · why ≥2 types · interface` | ⏎  ⏎ ## Rejected Alternatives ⏎ [What was considered and NOT picked, and why. Without this, /fabrik-epics re-litigates the same decision.] ⏎ - [Option] — rejected: [violates hard constraint X / higher TCO / more maintenance / duplicates project Y] ⏎  ⏎ ## Constraints ⏎ [20-constraint verification. Each states its status: all clear / conflict / unknown.] ⏎ - x86_64: all clear ⏎ - Budget: [status] ⏎  ⏎ ## Out of Scope (Vision Level) ⏎ [What is explicitly NOT being built — even if adjacent. \"Everything else\" is not acceptable. A white-space ⏎ finding from the rivals dossier (Phase 2) that this vision deliberately does NOT chase belongs here, ⏎ citing the dossier's white-space row — never silently omitted.] ⏎ - [Exclusion 1] ⏎  ⏎ ## Open Questions ⏎ [Unresolved items. If none: \"None — research was comprehensive.\"] ⏎ - [Question 1] ⏎  ⏎ ## Scale Assessment ⏎ - Feature count: [N] ([X] small, [Y] medium, [Z] large) ⏎ - Epic-count signal: [single epic / ~N epics — informational, /fabrik-epics decides the actual cut] ⏎ - Reasoning: [why this classification]"
