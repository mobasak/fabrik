  baseline: 'Grounding — before drafting, not after review. For the group you pick: the command''s current text read WHOLE; the tool''s own runtime output when a verdict is about a gate, a check or a tool, and its code, read live, when the edit restates the gate''s conditions — every condition and value copied, never the prose describing them; `docs/DECISIONS.md`, `docs/STRATEGIC_BACKLOG.md` and the decisions or binding-constraints section of each spec the command cites, for the subject (a ruling already made is POINTED at, never restated here; a row already sized as spec work sends this run to PHASE 2''s spec-chain shape with no edit); `/opt/fabrik-lib/README.md`''s module table and the project''s own `scripts/` when the edit names a capability, so the text points at what exists; and the packs `python scripts/select_rules.py --changed <target>` prints, which the edit obeys'
