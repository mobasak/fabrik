  baseline: 'THE DISPATCH STEP (D-191): run `python3 /opt/fabrik/scripts/sysadmin/dispatch_headroom.py --units <N> [--risky <R>] [--mechanical <M>]` and dispatch exactly the `SEATS:` and mix it prints, in ONE message, each seat a distinct unit × angle brief with its model token — stamped BEFORE they go out with `python3 scripts/command_run.py dispatch --seats <n>`, and closed with `python3 scripts/command_run.py round --seats <n> --findings <n> --confirmed <c> --own-fix <n> …`'
