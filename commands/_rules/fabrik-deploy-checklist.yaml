  baseline: 'A `--rows-from` merge checks the leg files before it counts them (`_rows_for` calls `check_leg_rows`): a leg file could otherwise reach CONFIRMED through which row ids appear, how many times each appears, which comparison keys a row carries, and what its `match` holds — so every contract row appears exactly once, with the three comparison keys all or none, a tri-state `match` and a known status, or the merge exits 64. A contract frozen before the template had `check_leg_rows` merges its legs unchecked until a re-freeze copies the template''s check in'
