- id: rq-next-rows-merge-into-slices-by-name
  section: "## Phase 4 — Converge (the loop — you are here after EVERY pass, not once)"
  baseline: "Under the workflow, pass 2 and the closing pass are NEW `Workflow` invocations with `pass: <n>`, the next pass number (unbounded), and each slice's `ledger` in `args`, built from the pass file with `python3 scripts/review_loop_ledger.py next <scratch>/pass-<n>.json --ids <the confirmed ids>` (it prints `{name, ledger}` rows: each `ledger` goes on the `args.slices` entry of the same `name`, which keeps its `files`); with `--args <a scratch copy of the run file>`, added whenever that file exists, it prints each slice whole, so its stdout, plus each `not carried` slice a fix hunk touched, is the next launch's `slices`, and it carries the open claims the `--ids` leave out; read its stderr either way (`/opt/fabrik/docs/reference/review-loop-workflow.md`) — each claim stated as the DEFECT — `DEFECT_PRESENT` the defect persists · `DEFECT_ABSENT` it is absent (the fix holds, or an earlier refutation still holds — re-run and never cited) · `NEW` a defect the fix introduced (an older run's `STILL_TRUE` / `NOW_FALSE` rows read as `DEFECT_PRESENT` / `DEFECT_ABSENT`, and `review_loop_ledger.py read` flags a seat that reports a defect present but raises no candidate, and two seats that disagree) — never `resumeFromRunId` (a resumed run re-runs the fan-out; `/opt/fabrik/docs/reference/review-loop-workflow.md`)"
  current: "Under the workflow, pass 2 and the closing pass are NEW `Workflow` invocations with `pass: <n>`, the next pass number (unbounded), and each slice's `ledger` in `args`, built from the pass file with `python3 scripts/review_loop_ledger.py next <scratch>/pass-<n>.json --ids <the confirmed ids>` (it prints `{name, ledger}` rows: each `ledger` goes on the `args.slices` entry of the same `name`, which keeps its `files`); with `--args <a scratch copy of the run file>`, added whenever that file exists, it prints each slice whole, so its stdout, plus each `not carried` slice a fix hunk touched, is the next launch's `slices`, and it carries the open claims the `--ids` leave out; read its stderr either way (`/opt/fabrik/docs/reference/review-loop-workflow.md`) — each claim stated as the DEFECT — `DEFECT_PRESENT` the defect persists · `DEFECT_ABSENT` it is absent (the fix holds, or an earlier refutation still holds — re-run and never cited) · `NEW` a defect the fix introduced (an older run's `STILL_TRUE` / `NOW_FALSE` rows read as `DEFECT_PRESENT` / `DEFECT_ABSENT`, and `review_loop_ledger.py read` flags a seat that reports a defect present but raises no candidate, and two seats that disagree) — never `resumeFromRunId` (a resumed run re-runs the fan-out; `/opt/fabrik/docs/reference/review-loop-workflow.md`)"
  text:
