line says (a slice it left with one finder gets its second in the next wave) — (`<repo root>`: the session's own checkout, `git rev-parse --show-toplevel` — in a worktree, the worktree) (chunk 5, D-347/D-348; contract: `/opt/fabrik/docs/reference/review-loop-workflow.md`): the script runs the two finders per slice with a schema whose `files_read` lists every file the seat opened, unions their candidates, DIFFS `files_read` against the slice (a gap is logged and the slice is UNVERIFIED until read), prints the two finders' capture-recapture estimate of unseen candidates as advice, runs one fresh Sonnet refuter per slice that EXECUTES every candidate's check and returns the command and output (a refutation without them is `unverified`), and hands you ONE ledger carrying each slice's `closable` flag and its `open` reasons"
  text:
  - "named unread, as that line says (a slice it left with one finder gets its second in the next wave)"
