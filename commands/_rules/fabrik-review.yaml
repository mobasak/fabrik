- id: rq-fixture-equal-to-own-constant-is-test-quality-finding
  class: ban
  section: '## Phase 1 — Independent finders (recall)'
  baseline: '(if yes, it proves nothing — it was written after the code and never watched fail); asserting on mock behavior / `*-mock` test IDs instead of real behavior; test-only methods on production classes (a method only ever called from tests); over-mocking that removes a side-effect the test depends on (mock at the wrong level → passes for the wrong reason); incomplete mocks (fewer fields than the real API returns → passes in test, fails in integration); mock setup that is >50% of the test; a wall-clock TIME BOMB — code calling `datetime.now()`/`time.time()`/`date.today()` while its callers or tests inject a `now` (the test is green only while real time sits inside its fixture''s window; live case: a 7-pass converged review stamped one clean, red two weeks later); a fixture that IS the code''s own constant — a test whose expected value is read from the very constant whose VALUE is the behaviour under test stays green whatever that constant says, so the finder mutates that constant on a copy under its scratch dir and the test must go red; a value compared with itself, or a matcher softened until it cannot fail (a substring where the contract is equality, a regex widened to `.*`) — both pass on the coder''s own proofs, so each is mutated the same way'
