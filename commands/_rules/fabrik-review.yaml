- id: rq-close-order-stages-before-in-progress-gate-2
  section: "## Reporting"
  baseline: "Stage your own files (the gate's ruff leg lints only staged changes and unpushed commits), then run `final_gate.py --check --json` — this and every other `final_gate.py` run this command makes, the pre-pin runs above included, goes under `/opt/fabrik/scripts/capped_run.sh --` in the background, since an uncapped semgrep leg has killed sessions mid-close; wait for its exit before the next step and take the JSON from its output without capped_run's own `capped_run:` lines; an exit 137 (`capped_run: killed at the memory ceiling`) or 124 (`capped_run: stopped at the …s time limit`), with or without that line, is no gate result, neither embedded nor declared, and is re-run with a larger `--mem` or `--timeout`; and since capped_run runs the gate UNCAPPED when no user systemd manager answers, `systemctl --user show-environment` exits 0 before the first gate run, or no gate runs from this session — while the receipt still reads `Status: IN-PROGRESS` (`check_convergence.py` and `check_review_coverage.py` both skip an in-flight receipt)"
