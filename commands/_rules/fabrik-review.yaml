- id: rq-agent-tool-seat-pin-import-placement
  section: "## Phase 1 — Independent finders (recall)"
  baseline: "Do not write a brief that assumes a kill (01M25Y93M, adjudicated against fabrik-lib-dev1's filing) · a mutant counts as dead only as `/opt/fabrik/commands/_fragments/term-coverage.md` rule (4) says, never on an exit code alone · never bare-grep a tracked path — `git show <sha>:<path> > <scratch>/<file>`, redirected like any large output, because a large stdout is saved by the harness under `$HOME` · a seat that MEASURES by importing code imports the PIN (a `git archive <sha>` extract with the pinned files overlaid), never `sys.path.insert` the live tree, puts the directory that holds the top-level import name (`<extract>/src` for `import fabrik`) at the index of the first entry ending in `site-packages` or `dist-packages` (at the end when there is none), never at index 0, where a package named like a stdlib module shadows the stdlib, runs every probe as `python -P -B` with any PYTHONPATH entries dropped from sys.path (without `-P` the working directory, the live repo, sits ahead of the extract) — `PIN_IMPORT` in `.claude/workflows/fabrik-review-loop.js` is the recipe — and prints the module's `__file__` beside every result (a sibling's uncommitted edit in the live tree once fed three measurements) · a later pass's brief states the ledger's high-water mark — its last row id and the receipt's sha at dispatch (in the committed-fix form below, the draft's last row id and md5) — never a hand-typed row range · every helper or probe file a seat writes goes in its OWN scratch dir (`<scratch_dir>/seat-p<pass>-<digest8>-<slice>-<model>/`, made with `mkdir -p` before its first write), never the dispatcher's scratchpad root, and never under a name that collides with an importable package (a seat's `h11.py` there shadowed the real `h11` for every process run from that dir) · Python `time.sleep` in fixture scripts, never a foreground shell sleep · a quote verified against a session transcript filters out the Stop-hook feedback, the skill-invocation payloads and the re-invocation notice (all arrive as `type: user`; a brief's ARGUMENTS text is not the operator's words) and prefilters the raw line by timestamp before parsing (a 793 MB session file parses in under a second that way, ~40 s otherwise) · the Read tool truncates a long file on a token cap with NO marker — read in offset pages and confirm the last line — and cuts one over-long LINE just as silently (this file carries lines of several KB): read such a line whole with `sed -n '<n>p' <file> | fold -w 200`, never conclude from its visible half · print a DENOMINATOR, and the commit (or the pin's md5) it was measured at, beside every count, and the match count beside any grep piped through `cut` · a probe of a served build reads the port the server actually bound, from its own output, or serves the files with no port at all (Playwright `page.route`), never a port the brief assumed · HARD TIME BOX 15 minutes · report `MACHINERY:` last"
