  baseline: "Size it with `python3 /opt/fabrik/scripts/sysadmin/dispatch_headroom.py --slices sonnet=N,haiku=N` (SEATS is Σ slices, no floor padding; run it however small the partition; a `SEATS: 0` or a refusal is a CLAIM — read its reason line and name what binds — a cap, or your own invocation — before it is a reason to stop), stamp BEFORE they go out with `python3 scripts/command_run.py dispatch --seats <n>` so sibling sessions subtract them — `<n>` the `SEATS:` `dispatch_headroom.py` just printed plus one refuter per slice (an upper bound: a slice with no candidate starts none), never a planned count — and close the pass with `round --seats` equal to that stamp, which releases it whole (a smaller number keeps the rest reserved), then launch them as ONE `Workflow` call — `Workflow({scriptPath: \"<repo root>/.claude/workflows/fabrik-review-loop.js\", args: {pass: 1, surface, base_sha, digest, pins_dir, pin_manifest, scratch_dir, brief, slices: [{name, files, priority}]}})` (`scratch_dir` is this run's `RUN-SCRATCH:` folder — the path after `RUN-SCRATCH: ` up to the next space on the line `start` printed (a trailing `(adopted from …)` is not part of it), or the session scratchpad when it printed `none` or nothing) (`pins_dir`, and `<scratch>` in this command's `review_loop_ledger.py` calls, go under the run's `SCRATCH:` folder — the path on the line `start` printed that begins `SCRATCH:`, kept on disk across a WSL shutdown (D-836), so an interrupted pass resumes from it — or the session scratchpad when `start` printed no line that begins `SCRATCH:`, and so do the briefs and fix lists the lead writes for each pass, so a resumed review has them (the seats' candidates, verdicts, notes and `files_read` are already in the pass files there); only the seats' copies go under `scratch_dir`) — when `dispatch_headroom.py` prints TRIMMED, the slices' `models` together use exactly the per-model seats its COST line funds, and a slice left without a seat is named unread, as that line says (a slice it left with one finder gets its second in the next wave) — (`<repo root>`: the session's own checkout, `git rev-parse --show-toplevel` — in a worktree, the worktree) (chunk 5, D-347/D-348; contract: `/opt/fabrik/docs/reference/review-loop-workflow.md`): the script runs the two finders per slice with a schema whose `files_read` lists every file the seat opened, unions their candidates, DIFFS `files_read` against the slice (a gap is logged and the slice is UNVERIFIED until read), prints the two finders' capture-recapture estimate of unseen candidates as advice, runs one fresh Sonnet refuter per slice that EXECUTES every candidate's check and returns the command and output (a refutation without them is `unverified`), and hands you ONE ledger carrying each slice's `closable` flag and its `open` reasons"
