- id: fr-class-ledger-persists-across-rounds
  class: behavioural
  baseline: 'The class ledger persists across rounds: re-sweep it, never re-scope it — a pass that invents a fresh brief is why a review runs 30 rounds instead of 4. A class check must LOAD the artefact it grades — a grep for the wording that describes a defect matches the artifact''s own correction and is refuted by any rewording; narrowing such a check is not converging (01M25Q9S0)'
