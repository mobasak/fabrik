- id: rq-finder-that-returns-nothing-is-failed-seat
  section: "## Phase 1 — Independent finders (recall)"
  baseline: "A finder that returns nothing is a FAILED seat (re-dispatch it), never a clean round; a refuter that returns nothing leaves its candidates to Phase 2. The 16 failure classes are the HUNT LIST every seat carries over its own slice, not the partition — the partition is by FILE, so two seats never read one file's logic and no candidate is claimed twice"
