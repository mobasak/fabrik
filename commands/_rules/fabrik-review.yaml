- id: rq-committed-fix-draft-init-moves-the-tip
  section: "## Reporting"
  baseline: "Both exit proofs live in `docs/development/reviews/YYYY-MM-DD-<scope>-review.md` (created before Pass 1 per the Termination contract — except the committed-fix form, whose fixes are committed during the review: it keeps a generated DRAFT in the run's `SCRATCH:` folder and makes the receipt once, after the last fix commit, as the Termination contract's Persist obligation says; skeleton via `python scripts/review_receipt.py --init --changed <paths> --scope <slug> [--range <base>..HEAD]` — a plan's whole-plan receipt takes `--out docs/development/reviews/<plan>-review.md` instead (`/fabrik-execute-plan` D7) — `--range` is REQUIRED for committed work: `--init` hashes `git diff HEAD` by default, and on the committed surface Phase 0 mandates that is empty, so it exits 1 with *\"the surface is EMPTY … pass `--range <base>..HEAD` for committed work\"*; a fix committed after the draft's `--init` moves the tip, which is why that form writes the receipt itself only at the close (`--init --lane --changed <every path in base..last> --scope <slug> --range <base>..<last fix commit>`, its rows carried from the draft — `--init` never overwrites, and `--restamp` re-anchors only a working-tree receipt); a plan's whole-plan receipt is born before Pass 1 and its fixes ride the finishing commit (`/fabrik-execute-plan` D7) — the rubric run, the `Surface:` hash, the standing rows, the ledger/phase shapes and the `## Residual` section, every verdict slot `UNCHECKED` under `Status: IN-PROGRESS`) — the adjudicated Coverage Checklist (every row: verdict + evidence naming the files/paths hunted), the numbered Pass Ledger AND the `## Residual` rows"
