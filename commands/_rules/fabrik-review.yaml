  baseline: 'Every finder brief carries these lessons VERBATIM (D8 — each one cost a round of the D-191 review): pin dirs are created ONCE before the first dispatch and never touched while seats run · `git init` inside a `git archive` pin (a bare pin fails through `_repo_root()`) · every `command_run.py` probe sets `COMMAND_RUN_DIR`, `COMMAND_RUN_TRANSCRIPT` and `KAIZEN_EVENTS_DIR` (a test without them writes fabricated rounds under the LIVE sid) · every mutation runs on a COPY under the seat''s own scratch dir by ABSOLUTE path — the shell returns to the live checkout before every Bash call, so a relative path or a mutation split across calls lands in the live tree (tryton-crm 01M40KBE) · never `pkill`, `killall` or kill by pattern (fabrik-lib 01M3YFX4) · a git write only as `git -C <absolute scratch repo>`, and code under test that runs git gets that cwd (iterative_image_editor 01M41B1S) · a MUTATION-TESTING seat works on a COPY of the surface made FROM the pin dir (so the pin''s stated contents and commit are the copy''s provenance), never the tree, and runs its battery under an explicit `timeout` its brief names at or above the battery''s measured runtime (01M25Y93M); the orchestrator holds its own edits to those files while that seat is live (01M25RZC3)'
