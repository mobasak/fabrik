- id: fr-routed-up-review-names-trigger
  class: prose
  baseline: 'A routed-up review names the trigger in its surface: `--surface "ROUTED-UP: step 1 — <the trigger> · <the diff range>"` — the ledger''s only positive witness that `/fabrik-review-scoped`''s route-up fired (no code detects a route-up — the record carries it only because the caller writes that surface string); its `done` then reaches back to the previous covered window''s close (the `REVIEW_FAMILY` branch of `_close` in `scripts/command_run.py`), which is what covers the pre-`start` edits'
