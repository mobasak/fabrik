- id: fr-command-5-phases-0-4
  class: ban
  section: '## Run record — open it FIRST, keep it current, close it only at the closing pass (`confirmed: 0`, the round-1 seats over their own slices)'
  baseline: 'This command has 5 phases (0–4) and exactly one terminal condition, and it has TWO parts that are BOTH required (neither alone is enough — see § Termination): a closing pass — the round-1 seats over their own slices — that returns `confirmed: 0 · fixed: 0` with `unexecuted:` 0 or absent, and every candidate ever raised adjudicated (a re-raise of an already-adjudicated STANDING row is cited in its row, never counted — see § Reporting)'
