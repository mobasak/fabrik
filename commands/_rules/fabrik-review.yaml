e-invocation notice (all arrive as `type: user`; a brief's ARGUMENTS text is not the operator's words) and prefilters the raw line by timestamp before parsing (a 793 MB session file parses in under a second that way, ~40 s otherwise) · the Read tool truncates a long file on a token cap with NO marker — read in offset pages and confirm the last line — and cuts one over-long LINE just as silently (this file carries lines of several KB): read such a line whole with `sed -n '<n>p' <file> | fold -w 200`, never conclude from its visible half · print a DENOMINATOR, and the commit (or the pin's md5) it was measured at, beside every count, and the match count beside any grep piped through `cut` · a probe of a served build reads the port the server actually bound, from its own output, or serves the files with no port at all (Playwright `page.route`), never a port the brief assumed · HARD TIME BOX 15 minutes · report `MACHINERY:` last"
