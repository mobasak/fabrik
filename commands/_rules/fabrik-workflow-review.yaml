- id: p3-route-upstream
  section: '## Phase 3 — Fix + re-check'
  baseline: 'One disposition fork the seams class needs stated: when a cross-artifact finding shows the ARTIFACT right and its UPSTREAM stale, the fix routes one step up — re-run THIS review on the upstream artifact (`/fabrik-workflow-review <vision path> vision-summary` for a stale Vision Summary behind a decomposition or an expanded epic; `… epic-decomposition` for a stale cut behind an expanded epic), or the upstream''s own doer when it must change (`/fabrik-vision` for the vision, `/fabrik-epics` for the cut) — and the downstream then re-derives from the changed upstream; routing is not convergence'
  class: ban
  text:
  - 'One disposition fork the seams class needs stated: when a cross-artifact finding shows the ARTIFACT right and its UPSTREAM stale, the fix routes one step up'
  - re-run THIS review on the upstream artifact (`/fabrik-workflow-review <vision path> vision-summary` for a stale Vision Summary behind a decomposition or an expanded epic; `… epic-decomposition` for a stale cut behind an expanded epic), or the upstream's own doer when it must change (`/fabrik-vision` for the vision, `/fabrik-epics` for the cut)
  - and the downstream then re-derives from the changed upstream
  - routing is not convergence
