- id: u-L138
  class: ban
  file: render
  section: '## Phase 2 — Emit the plan (phases, dependency order, runnable gates)'
  baseline: 'The spine carries: `Status:` (DRAFT|PLANNED|CONVERGED|IN-PROGRESS|EXECUTED|BLOCKED) · the Phase-4 header lines — `**Owner:**` always, `Epic:` on an epic-born plan, both CONTRACT rather than grammar: the checks in this list do not VALIDATE either line''s presence or shape; `Epic:` is what the epic-containment check keys on and `**Owner:**` is what the PLANS table reads · `## Ticket Board` (a GFM TABLE whose header and EVERY row start with a leading `|` — `| Ticket | Title | Depends | Parallel | State | Commit |` then e.g. `| T01 | Alpha | — | ⚡ | ⬜ | |`; a pipe-less table reports `ticket file T## has no Ticket Board row` against the SPINE for every ticket and kills the ⬜-never-flipped staleness ERROR; the `T##` ID must be the FIRST DATA cell of every row — any cell placed before it unparses that row (the header cell''s NAME is free — recognition keys on `State`, not on the literal `Ticket`, so an `| ID | …` header parses fine); states ⬜ todo · 🔵 dispatched · 🟡 in review · ✅ merged · 🔴 blocked; emit every row ⬜ with an empty Commit cell — the orchestrator fills it at merge (a convention: no gate reads the Commit cell); the parser recognizes the header as the LAST recognizable `|`-line BEFORE the first data row (recognizable = a `State` cell — case-insensitive — ≥3 content cells, and no cell containing a `T##` token anywhere, substring match: even `Ticket (T01)` vetoes the line; one layer of bold OR backticks per cell is normalized away — the bold-outside-backtick double-wrap and `__bold__` are not) — an unrecognizable header silently degrades to fallback column 5, which reads the WRONG cell the moment a column is reordered or added/removed BEFORE the State column, or NO cell on a board narrower than five columns (below three content columns no header is recognized at all — keep the canonical six); ID cells bare or BOLD only — a backticked `T01` cell unparses its row entirely, reporting `ticket file T01 has no Ticket Board row` (the same symptom as the pipe-less table, one per unparsed row — NOT the mis-named-file cascade); and NO auxiliary tables inside the Board section AT ALL — a row with a `T##` FIRST cell parses as a Board row (orphan ERROR for an unknown ID, duplicate-row ERROR for a known one), and any other aux row is silent: one carrying any `T##` token is vetoed as a header candidate and parses as nothing, while a wide T##-free one WITH a `State` cell hijacks the State column when it sits between the header and the first data row) · `## Merge Order` (a topological sort of Depends, one bare ID per numbered line — a title/comment on the line voids that row''s parse and the gate then reports `Merge Order does not list exactly the ticket set`: the cause is usually the trailing text, though the same message fires when a ticket file is genuinely mis-named (the cascade above); plus `Serialized: <path> — <ids>` lines for shared paths between Depends-unconnected tickets (bullet/numbered prefixes and bold labels all parse — the field family is format-tolerant; BLOCKQUOTED example lines never parse in the Depends/Integration/Complexity/Docs/Gate/Parallel/Serialized field family (a live quoted example would license overlaps or mint a phantom Integration ticket; a missing Complexity still fails loud), while `Never-Route:` DOES parse quoted forms (a quoted line ADDS coverage — fail-closed) and `Status:` splits by consumer: a quoted ticket Status still draws the ban (fail-closed), but quoted content — fenced OR blockquoted — is INVISIBLE to the spine''s own status (a `> Status: DRAFT` example can never downgrade the contract; the spine''s real Status must be an unquoted line); each row is ONE covering-aware licence, so the exact pair must share a single row) — a Serialized row is a DISPATCH BARRIER: later waits for earlier ✅, direction per `## Merge Order` position — the canonical order signal; list the row''s IDs in Merge-Order order) · `## Interfaces` (each cross-ticket interface names its seam test, owned by the CONSUMER ticket — the file in the consumer''s Touches, the producer''s Behavior Contract in the consumer''s Context Files) · `## Behavior Contract` (the ROLL-UP: every ticket''s G/W/T rows verbatim — NO ticket-ID prefix, no rewording (a `T01 — ` prefix produces two mismatch ERRORs per row with no hint at the cause; normalization forgives bold, bullet chars, case, whitespace runs, a trailing `(N)` and a trailing period — nothing else; each row on ONE physical line, since the gate reads only the first line of a wrapped row), one bulleted `- **Given** … **When** … **Then** …` row per behavior — the gate reads ONLY bulleted Given rows: a numbered spine roll-up against bulleted tickets ERRORs loudly as a roll-up mismatch, but a contract numbered on BOTH sides passes silently with set-equality disabled — `check_plan_tickets` enforces set-equality; `check_test_proposal` reads it) · `## Global Constraints` (may carry `Never-Route: <path>` lines — one concrete path prefix per line, never a comma list or a category, extending the built-in never-route set `scripts/enforcement/` · `scripts/final_gate.py` · `alembic/` · `db/migrations/` · `secrets/` · `.env` + `.env.*` except `.env.example` — `.envrc` is NOT covered) · `## Context Ledger` · `## File Scope (owned paths)` (a literal-path superset of every ticket''s Touches, receipt artifacts included — but the seven governance files (`check_plan_tickets.py::GOVERNANCE_FILES` is the live list — CHANGELOG · INDEX · docs/README · FEATURES · LESSONS_LEARNT · DECISIONS · STRATEGIC_BACKLOG) go in NEITHER Touches NOR File Scope: they are orchestrator-applied shared-append surfaces governed by the shared-tree rules, deliberately OUTSIDE the plan lock (locking `CHANGELOG.md` would make every pair of concurrent plans BLOCK on scope overlap; a listed or covering entry is a DEDICATED gate ERROR — File Scope builds the lock) — no globs — the gate ERRORs them on BOTH surfaces; the plan''s OWN stem-named entries under `docs/development/reviews/` / `.fabrik/plan-locks/` are exempt only from the owned-by-no-ticket WARN (in Touches the own LOCK is still a dedicated ERROR — orchestrator territory); `docs/development/plans/` is plan-set TERRITORY — foreign-stem entries ERROR on both surfaces, and in Touches even the plan''s OWN dir/spine/tickets ERROR (the Board is the orchestrator''s write surface; plan-doc migrations/archives are orchestrator or monolith work, never a set ticket''s) (`~/` is never ownable — rendered outputs are the orchestrator''s render step); `dir/` entries own subtrees; written as a bullet/numbered list, one bare path as the FIRST token per line — a table/prose section fails OPEN: the gate WARNs "containment checks are OFF" and exits 0 absent other errors, with every Touches-⊆-File-Scope check disabled; worse, a MISSING or retitled section (`## Owned paths`) disables containment with NO output at all — the heading must start with `## File Scope`) · `## Evidence` · `## Self-audit` · `## Residual unknowns` (the last two per Phase 4 — the spine, not the tickets, carries them)'
