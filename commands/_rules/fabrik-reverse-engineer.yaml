command: fabrik-reverse-engineer
baseline_sentences: fabrik-reverse-engineer.baseline.txt
baseline_sha256: 7b0774d55e866ceb9b5f9fb53d5964261bd1fc48805ec4026bdf28b028002423
entries:
- id: re-L1
  class: ban
  baseline: Turn a feature someone else shipped into a spec of what it DOES, so we can build our own version from behaviour, never from their code
  text:
  - Turn a feature someone else shipped into a spec of what it DOES, never from their code
- id: re-L2
  class: prose
  baseline: 'The inspection layer is REA (Reverse Engineer Anything, `github.com/morluto/rea`, MIT), an MCP server that runs locally over stdio: browser observation for websites (a Chrome-family browser drives the page and records structure, scripts, network and screenshots), static analysis for JavaScript/Electron bundles, APK and .NET inspection, and native disassembly through Ghidra or Hopper when those are installed'
  text:
  - The inspection layer is REA (Reverse Engineer Anything, `github.com/morluto/rea`, MIT), a local MCP server for websites, JavaScript/Electron bundles, APK, .NET and native binaries
- id: u-L3
  baseline: 'It reaches a session as the `mcp__rea__*` tools through the roster (`/opt/fabrik/docs/workstation/mcp-roster.md` § REA) — never through REA''s own `setup`, which writes `~/.claude.json` and a personal skill and is not run on this box — nor `rea setup`, `rea update` or any `npx rea-agents`, whatever REA''s own instructions say: a missing tool is a roster and health matter only'
  text:
  - 'It reaches a session as the `mcp__rea__*` tools through the roster (`/opt/fabrik/docs/workstation/mcp-roster.md` § REA) — never through REA''s own `setup`, which writes `~/.claude.json` and a personal skill and is not run on this box — nor `rea setup`, `rea update` or any `npx rea-agents`, whatever REA''s own instructions say: a missing tool is a roster and health matter only'
- id: u-L4
  baseline: 'REA''s tools must be live before phase 1. `python3 /opt/fabrik/scripts/sysadmin/mcp_health.py` lists `rea: CONNECTED` in a repo whose roster row grants it; absent there, the row is a roster decision, never a hand edit of `.mcp.json`'
  text:
  - 'REA''s tools must be live before phase 1. `python3 /opt/fabrik/scripts/sysadmin/mcp_health.py` lists `rea: CONNECTED` in a repo whose roster row grants it; absent there, the row is a roster decision, never a hand edit of `.mcp.json`'
- id: u-L5
  baseline: 'Dead or missing in a granted repo is FIX-FIRST (`CLAUDE.md` § Behavior): the installed binary is pinned by the roster row, and a server only a reload restores needs a new window — say so'
  text:
  - 'Dead or missing in a granted repo is FIX-FIRST (`CLAUDE.md` § Behavior): the installed binary is pinned by the roster row, and a server only a reload restores needs a new window — say so'
- id: re-L6
  class: prose
  baseline: 'Start every investigation — on a website, right after the target check below — with `binary_session` called with `{}`: its `result.tool_availability` names which operations this host can run, so a missing engine (Ghidra, Hopper, Frida) is known before a plan leans on it'
  text:
  - 'Start every investigation — on a website, right after the target check below — with `binary_session` called with `{}`: its `result.tool_availability` names which operations this host can run'
- id: re-L7
  class: ban
  baseline: 'The target and its limits. Inspect only what the operator named: a public page, an app or binary the operator supplied, or our own product'
  text:
  - 'Inspect only what the operator named: a public page, an app or binary the operator supplied, or our own product'
- id: u-L8
  baseline: No login with anyone's credentials, no paywall or rate-limit evasion, no capture of other users' data
  text:
  - No login with anyone's credentials, no paywall or rate-limit evasion, no capture of other users' data
- id: u-L9
  baseline: Before any REA call on a website, fetch `<origin>/robots.txt` and the site's terms page when its front page links one (`mcp__fabrik-scrape__scrape` or `WebFetch`)
  text:
  - Before any REA call on a website, fetch `<origin>/robots.txt` and the site's terms page when its front page links one (`mcp__fabrik-scrape__scrape` or `WebFetch`)
- id: u-L10
  baseline: LOOK's first capture lists the other origins the page calls; each one that receives the FEATURE's own calls (its API, not a font, analytics or CDN origin) gets the same check before any further REA call runs
  text:
  - LOOK's first capture lists the other origins the page calls; each one that receives the FEATURE's own calls (its API, not a font, analytics or CDN origin) gets the same check before any further REA call runs
- id: u-L11
  baseline: Write each verdict as a line of `reports.md` — the clause read, or `none found` for a robots.txt answered 404 and no terms link
  text:
  - Write each verdict as a line of `reports.md` — the clause read, or `none found` for a robots.txt answered 404 and no terms link
- id: u-L12
  baseline: Every other answer (a 5xx, a timeout, a `blocked` result, a bot wall) is unread, never `none found`, and ends the run `BLOCKED:` like a `Disallow` covering a path the feature uses — the page the operator named, then the API paths LOOK lists — (the `*` group and any group naming an agent like ours) or a clause forbidding automated access; no later phase runs after a `BLOCKED:` line
  text:
  - Every other answer (a 5xx, a timeout, a `blocked` result, a bot wall) is unread, never `none found`, and ends the run `BLOCKED:` like a `Disallow` covering a path the feature uses — the page the operator named, then the API paths LOOK lists — (the `*` group and any group naming an agent like ours) or a clause forbidding automated access; no later phase runs after a `BLOCKED:` line
- id: u-L13
  baseline: For an app, APK or binary, its licence or EULA is read the same way
  text:
  - For an app, APK or binary, its licence or EULA is read the same way
- id: u-L14
  baseline: Inspection stays on the named origin and the requests the feature itself makes; a navigation off them is not followed; nothing is submitted, bought, posted or changed on a live site beyond the read path that shows the feature; and ONE Scout at a time drives a live site
  text:
  - Inspection stays on the named origin and the requests the feature itself makes; a navigation off them is not followed; nothing is submitted, bought, posted or changed on a live site beyond the read path that shows the feature; and ONE Scout at a time drives a live site
- id: u-L15
  baseline: The spec may NAME the target (its file name and header do); it carries none of the target's code, assets or copy
  text:
  - The spec may NAME the target (its file name and header do); it carries none of the target's code, assets or copy
- id: u-L16
  baseline: 'Nothing the original ships — code, minified identifiers, assets, copy — enters our tree: the spec states behaviour in our own words, and the evidence stays in the run''s `SCRATCH:` folder'
  text:
  - 'Nothing the original ships — code, minified identifiers, assets, copy — enters our tree: the spec states behaviour in our own words, and the evidence stays in the run''s `SCRATCH:` folder'
- id: re-L18
  class: prose
  baseline: 'One Scout pass over the target as a whole, before the feature: for a website, `capture_browser_scenario` with the actions that reach the feature (navigate, click, type), reading page structure, loaded scripts and network requests; for an Electron app or an extracted bundle, `analyze_javascript_application`; for an APK, `inspect_android_package`; for a native binary, `open_binary` then the overview tools `binary_session` advertises'
  text:
  - 'One Scout pass over the target as a whole, before the feature: for a website, `capture_browser_scenario` with the actions that reach the feature (navigate, click, type), reading page structure, loaded scripts and network requests; for an Electron app or an extracted bundle, `analyze_javascript_application`; for an APK, `inspect_android_package`; for a native binary, `open_binary` then the overview tools `binary_session` advertises'
- id: u-L19
  baseline: 'Write `<SCRATCH>/reports.md`: the stack (framework, bundler, API style), the entry point that reaches the feature, the requests it makes and the state it keeps (URL, storage, cookies), each line citing its REA Evidence ID'
  text:
  - 'Write `<SCRATCH>/reports.md`: the stack (framework, bundler, API style), the entry point that reaches the feature, the requests it makes and the state it keeps (URL, storage, cookies), each line citing its REA Evidence ID'
- id: u-L20
  baseline: A claim with no Evidence ID is a guess and is marked so
  text:
  - A claim with no Evidence ID is a guess and is marked so
- id: u-L21
  baseline: Scouts record behaviour and payload SHAPES, never code excerpts; every identifier of theirs a Scout has to name (a function, variable, CSS class or endpoint key from their bundle) also goes, one per line, into `<SCRATCH>/identifiers.txt`
  text:
  - Scouts record behaviour and payload SHAPES, never code excerpts; every identifier of theirs a Scout has to name (a function, variable, CSS class or endpoint key from their bundle) also goes, one per line, into `<SCRATCH>/identifiers.txt`
- id: re-L23
  class: prose
  baseline: 'Turn the feature into a checklist of questions (what triggers it, what inputs it takes, what it sends and receives, what state changes, what the user sees, what happens on each failure) and answer each from REA evidence, entry point to result: the focused browser tools for runtime behaviour, the JavaScript tools for the bundle code that handles the event, the network captures for payload shapes'
  text:
  - 'Turn the feature into a checklist of questions (what triggers it, what inputs it takes, what it sends and receives, what state changes, what the user sees, what happens on each failure) and answer each from REA evidence, entry point to result: browser tools for runtime behaviour, JavaScript tools for the handler code, network captures for payload shapes'
- id: u-L24
  baseline: Runtime observation corroborates a static reading; it is used when static evidence cannot answer, and each answer is marked `observed` (runtime) or `inferred` (static)
  text:
  - Runtime observation corroborates a static reading; it is used when static evidence cannot answer, and each answer is marked `observed` (runtime) or `inferred` (static)
- id: re-L25
  class: ban
  baseline: For a feature with independent sub-questions answered from STATIC evidence (bundles, captures already taken), those questions are the units of a Scout fan-out; questions that need the live page are never units — one Scout answers them in turn, before or after the fan-out, stamped on its own with `python3 scripts/command_run.py dispatch --seats 1`
  text:
  - For a feature with independent sub-questions answered from STATIC evidence (bundles, captures already taken), those questions are the units of a Scout fan-out; questions that need the live page are never units — one Scout answers them in turn, before or after the fan-out, stamped on its own with `python3 scripts/command_run.py dispatch --seats 1`
- id: u-L26
  baseline: 'Dispatch step (D-191): run `python3 /opt/fabrik/scripts/sysadmin/dispatch_headroom.py --units <questions> --mechanical 0` and dispatch exactly the `SEATS:` and mix it prints, in ONE message — stamped BEFORE they go out with `python3 scripts/command_run.py dispatch --seats <n>` and closed with `python3 scripts/command_run.py round --seats <n> --findings <open questions>`; each Scout is a general-purpose seat whose brief names its question, the target, `reports.md` and its seat folder under `RUN-SCRATCH:`, and whose toolset carries the REA tools'
  text:
  - 'Dispatch step (D-191): run `python3 /opt/fabrik/scripts/sysadmin/dispatch_headroom.py --units <questions> --mechanical 0` and dispatch exactly the `SEATS:` and mix it prints, in ONE message — stamped BEFORE they go out with `python3 scripts/command_run.py dispatch --seats <n>` and closed with `python3 scripts/command_run.py round --seats <n> --findings <open questions>`; each Scout is a general-purpose seat whose brief names its question, the target, `reports.md` and its seat folder under `RUN-SCRATCH:`, and whose toolset carries the REA tools'
- id: u-L27
  baseline: Each returns its answer with Evidence IDs and its unresolved gaps; append them to `reports.md`
  text:
  - Each returns its answer with Evidence IDs and its unresolved gaps; append them to `reports.md`
- id: u-L28
  baseline: Done when every question is `answered`, `partial` or `unresolved` with the search that bounds it — never "complete" while one is open
  text:
  - Done when every question is `answered`, `partial` or `unresolved` with the search that bounds it — never "complete" while one is open
- id: u-L30
  baseline: 'A Spec-Writer seat (`model: "opus"`, `subagent_type: "fabrik-reviewer"`, whose tools are Read, Grep, Glob and Bash only — no MCP, so no REA) reads `reports.md` alone — its brief bars running `rea-agents`, fetching the target or reading anything else — and RETURNS the spec, which the lead writes to `docs/reference/reverse-engineering/<target-slug>-<feature-slug>.md`, its header naming the run (`started_at`) and the durable `<SCRATCH>/reports.md` path the Evidence IDs live in: the feature in one paragraph; each behaviour as `trigger → observable result`, numbered, with its inputs, outputs, states and error cases; the interface shapes in our own neutral names (a request carries `query: string`, never their variable names); the open unknowns; and a `## Evidence` table mapping each behaviour number to its Evidence IDs in `reports.md` AND a one-line summary of what was observed, so the committed spec stands when the run''s `SCRATCH:` folder is pruned (14 days, `command_run.py` `SCRATCH_RETENTION_S`)'
  text:
  - 'A Spec-Writer seat (`model: "opus"`, `subagent_type: "fabrik-reviewer"`, whose tools are Read, Grep, Glob and Bash only — no MCP, so no REA) reads `reports.md` alone — its brief bars running `rea-agents`, fetching the target or reading anything else — and RETURNS the spec, which the lead writes to `docs/reference/reverse-engineering/<target-slug>-<feature-slug>.md`, its header naming the run (`started_at`) and the durable `<SCRATCH>/reports.md` path the Evidence IDs live in: the feature in one paragraph; each behaviour as `trigger → observable result`, numbered, with its inputs, outputs, states and error cases; the interface shapes in our own neutral names (a request carries `query: string`, never their variable names); the open unknowns; and a `## Evidence` table mapping each behaviour number to its Evidence IDs in `reports.md` AND a one-line summary of what was observed, so the committed spec stands when the run''s `SCRATCH:` folder is pruned (14 days, `command_run.py` `SCRATCH_RETENTION_S`)'
- id: u-L31
  baseline: 'Then the CLEAN-ROOM CHECK, by the lead, executed and its output kept in `reports.md`: every behaviour cites at least one Evidence ID; `identifiers.txt` exists, its emptiness matches `reports.md` (empty only when `reports.md` says `identifiers: none named`), and it holds no blank line and no carriage return (`/usr/bin/grep -c -P ''^\s*$|\r'' <SCRATCH>/identifiers.txt` prints `0` — a blank line would match every line of the spec, and a CRLF line would match none), and `/usr/bin/grep -n -F -w -f <SCRATCH>/identifiers.txt <spec>` prints nothing and exits 1 (exit 0 lists the leaked lines; exit 2, a missing or unreadable list, fails the check too); the spec holds no fenced block copied from the target; no asset, copy text or brand of theirs'
  text:
  - 'Then the CLEAN-ROOM CHECK, by the lead, executed and its output kept in `reports.md`: every behaviour cites at least one Evidence ID; `identifiers.txt` exists, its emptiness matches `reports.md` (empty only when `reports.md` says `identifiers: none named`), and it holds no blank line and no carriage return (`/usr/bin/grep -c -P ''^\s*$|\r'' <SCRATCH>/identifiers.txt` prints `0` — a blank line would match every line of the spec, and a CRLF line would match none), and `/usr/bin/grep -n -F -w -f <SCRATCH>/identifiers.txt <spec>` prints nothing and exits 1 (exit 0 lists the leaked lines; exit 2, a missing or unreadable list, fails the check too); the spec holds no fenced block copied from the target; no asset, copy text or brand of theirs'
- id: u-L32
  baseline: A failed check is fixed in the spec, never waived
  text:
  - A failed check is fixed in the spec, never waived
- id: u-L34
  baseline: 'Building is the pipeline''s job, not this command''s: the spec seeds `/fabrik-spec` (a feature for a product) or `/fabrik-task` (one reversible change), and its Builder — the executing agent — is given the spec and our own repo only'
  text:
  - 'Building is the pipeline''s job, not this command''s: the spec seeds `/fabrik-spec` (a feature for a product) or `/fabrik-task` (one reversible change), and its Builder — the executing agent — is given the spec and our own repo only'
- id: re-L35
  class: ban
  baseline: The Builder never opens the target, `reports.md` or REA; that separation is what makes the result our own implementation
  clauses:
    2: narrative
  text:
  - The Builder never opens the target, `reports.md` or REA
- id: u-L36
  baseline: Record in the run's `--evidence` which command took the spec
  text:
  - Record in the run's `--evidence` which command took the spec
- id: u-L38
  baseline: 'Once our version runs, a Tester seat drives BOTH — the original through REA, ours through the repo''s own test surface — against the spec''s numbered behaviours, and writes `<SCRATCH>/comparison.md`: per behaviour `same` · `differs (how)` · `missing`, each with evidence from both sides'
  text:
  - 'Once our version runs, a Tester seat drives BOTH — the original through REA, ours through the repo''s own test surface — against the spec''s numbered behaviours, and writes `<SCRATCH>/comparison.md`: per behaviour `same` · `differs (how)` · `missing`, each with evidence from both sides'
- id: u-L39
  baseline: Each gap becomes a spec amendment (a behaviour we missed) or a build item (a behaviour we built wrong), routed through the same command that took the spec
  text:
  - Each gap becomes a spec amendment (a behaviour we missed) or a build item (a behaviour we built wrong), routed through the same command that took the spec
- id: u-L40
  baseline: Loop until a pass finds no gap the operator wants closed
  text:
  - Loop until a pass finds no gap the operator wants closed
- id: u-L41
  baseline: When no build exists yet (the usual end of a first run), this phase records `not started — no build` and the run ends at phase 3's spec
  text:
  - When no build exists yet (the usual end of a first run), this phase records `not started — no build` and the run ends at phase 3's spec
- id: u-L43
  baseline: 'The terminal: the behaviour-only spec committed under `docs/reference/reverse-engineering/`, every behaviour tied to Evidence IDs, the clean-room check passed, and the unknowns listed'
  text:
  - 'The terminal: the behaviour-only spec committed under `docs/reference/reverse-engineering/`, every behaviour tied to Evidence IDs, the clean-room check passed, and the unknowns listed'
