- id: cu-purpose  # class: prose
  baseline: 'Get a neglected project back to a truthful, resumable state in one bounded run: MEASURE what has drifted, QUEUE it worst-first, EXECUTE the queue by dispatching each item to the command that already owns that fix'
  current: 'Bounded run: MEASURE drift, QUEUE it worst-first, EXECUTE each item through the command that owns its fix'
  text:
  - EXECUTE each item through the command that owns its fix
