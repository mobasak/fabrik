- id: cu-p6-report  # class: ban
  section: '## Phase 0 — MEASURE (read-only; no fixes yet)'
  baseline: 'Report these as findings for the operator — do not act on them. A project has no fleet creds (deploy is trigger-not-execute) and this WSL box runs a local Docker bridge also named `fabrik`, distinct from the fleet''s `fabrik` network — a project-side DNS/container probe silently resolves against the wrong network and can return a false "dead" for a correct reference like `postgres-main:5432`; Liveness itself is hub-verified only; The captcha retirement (`docs/SERVICES.md` § Service-status drift warning) is the cautionary case: a catalog row can outlive the service it describes, so neither "the row says it''s live" nor a project-side probe saying "unreachable" is proof — only a hub-side check settles it; Actual retirement (once the operator confirms) routes to `/fabrik-decommission`, the hub-side retirement runbook — never remove or repoint a reference from inside this command'
  text:
  - Report these for the operator — do not act on them
  - liveness is hub-verified only
  - The captcha retirement (`docs/SERVICES.md` § Service-status drift warning)
  - only a hub-side check settles it
  - once the operator confirms
  - the hub-side retirement runbook
  - never remove or repoint a reference from inside this command
