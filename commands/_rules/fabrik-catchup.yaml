- id: cu-outer-loop  # class: prose
  section: '## ⚠️ Termination contract'
  baseline: 'Three thoughts that each mean *run the re-measure now*: "the queue looked short," "that fix was trivial," "it''s obviously caught up." Catchup owns only this outer loop — never the inner convergence loop of a routed command (that command''s own termination contract governs its own no-op)'
  current: 'Three thoughts that each mean *run the re-measure now*: "the queue looked short," "that fix was trivial," "it''s obviously caught up." Catchup owns only this outer loop — never the inner convergence loop of a routed command (that command''s own termination contract governs its own no-op)'
  text:
  - Catchup owns only this outer loop
  - Three thoughts that each mean
  - never the inner convergence loop of a routed command
- id: cu-no-stop  # class: prose
  section: '## ⚠️ Termination contract'
  baseline: 'Context is never a reason to stop: the harness auto-compacts and the run continues in the same invocation; The only legitimate early stop is a routed command coming back `BLOCKED` after 3 consecutive attempts on the same item — pause that item, name it in the report, and keep working the rest of the queue'
  text:
  - Context is never a reason to stop
  - a routed command coming back `BLOCKED` after 3 consecutive attempts on the same item
  - the harness auto-compacts and the run continues in the same invocation
