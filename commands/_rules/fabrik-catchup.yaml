- id: cu-done-when  # class: prose
  section: '## ⚠️ Termination contract'
  baseline: 'You are done only when a fresh re-run of Phase 0 MEASURE raises zero new queue items — every prior finding is now fixed, explicitly `BLOCKED`, or accounted for (these count on re-measure as named, not as new items, once this run''s report names them: a candidate dead consumer reference and a genuinely undecidable reconcile downgraded per Phase 2 — both report-only, un-committed by design; an item ROUTED to whoever owns it — mailed to its beat, or a gate red or work item reported to its owner (an open item or a live sibling) — with the mail id or owner named; and an item another session holds, named) — a genuine no-op re-measure and `python scripts/final_gate.py --check --json` reports `"status":"success"` in this same run — or reds only on checks a named owner holds (`GATE: failure (owned: <owner>)`)'
  current: 'You are done only when a fresh re-run of Phase 0 MEASURE raises zero new queue items — each prior finding is fixed, explicitly `BLOCKED`, or accounted for (these count on re-measure as named, not as new items, once this run''s report names it): a candidate dead consumer reference or a genuinely undecidable reconcile downgraded per Phase 2 (both report-only, un-committed); an item ROUTED to whoever owns it — mailed to its beat, or a gate red or work item reported to its owner — with the mail id or owner named; an item another session holds, named'
  text:
  - You are done only when a fresh re-run of Phase 0 MEASURE raises zero new queue items
  - a gate red or work item reported to its owner — with the mail id or owner named
  - these count on re-measure as named, not as new items
  pins:
  - tests/test_catchup_queue_pass.py::test_termination_counts_a_mailed_item_and_phase_two_routes_by_beat
