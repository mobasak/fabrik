- id: cu-p1-flags  # class: prose
  section: '## Phase 0 — MEASURE (read-only; no fixes yet)'
  baseline: 'Flag a contradiction: spine says `IN-PROGRESS` but the lock is missing or its `status` is not `"active"` (a released lock while the spine still claims work is running); spine says `DRAFT`/`CONVERGED` but an `active` lock exists; spine says `EXECUTED` but the plan (file or dir) still sits outside `docs/development/plans/archived/`; a lock whose `plan` path does not resolve on disk, or resolves under `docs/development/plans/` but outside `archived/` while its `status` is terminal (a lock for a plan kept elsewhere — an epic, a spec-owned plan — is not held to the `archived/` rule) — the allowlist is {`released`, `executed`, `complete`, `completed`, `done`} (allowlist-not-denylist per fabrik-lib `f8249ec3`: an unknown word leaves a lock flagged for a human; measured live 2026-08-29, `executed` is this tree''s MOST COMMON terminal and the old `released`/`complete` example would have mis-flagged four finished locks); a lock whose `plan` path resolves INTO `docs/development/plans/archived/` while its `status` is still `"active"` (an abandoned run archived by hand without releasing the lock)'
  text:
  - spine `IN-PROGRESS` with the lock missing or not `"active"`
  - spine `DRAFT`/`CONVERGED` with an `active` lock
  - is not held to the `archived/` rule
  - spine `EXECUTED` while the plan (file or dir) sits outside `docs/development/plans/archived/`
  pins:
  - tests/test_catchup_queue_pass.py::test_probe_one_scopes_the_archived_rule_to_plans_under_plans_dir
  current: 'Flag: spine `IN-PROGRESS` with the lock missing or not `"active"`; spine `DRAFT`/`CONVERGED` with an `active` lock; spine `EXECUTED` while the plan (file or dir) sits outside `docs/development/plans/archived/`; a lock whose `plan` path does not resolve, or sits under `docs/development/plans/` outside `archived/` with a terminal `status` (a plan kept elsewhere, such as an epic''s, is not held to the `archived/` rule), or sits INTO `docs/development/plans/archived/` while `"active"`'
