- id: ri-top-abort-if-empty
  # class: prose
  # clauses: L2.1, L2.2, L2.3
  # kept-test literals inside this carrier (tests never edited here): test_quota_stop_hook
  file: commands/_fragments/repo-identity.md
  section: "## Repo identity — resolve WHERE you are before any repo-dependent decision or git mutation"
  baseline: "`TOP=$(git rev-parse --show-toplevel)` — abort if empty (`[ -n \"$TOP\" ] || stop`): `git -C \"\"` is a documented no-op that silently runs in the CURRENT directory — the exact unpinned behavior this guard exists to replace"
  current: "`TOP=$(git rev-parse --show-toplevel)` — abort if empty (`[ -n \"$TOP\" ] || stop`): `git -C \"\"` is a documented no-op that silently runs in the CURRENT directory — the exact unpinned behavior this guard exists to replace"
