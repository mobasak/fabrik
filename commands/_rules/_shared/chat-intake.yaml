  # class: prose
  # clauses: L12.1, L12.2
  file: commands/_fragments/chat-intake.md
  section: "## ⚠️ Intake Inventory — the conversation IS a denominator (build it before you design anything)"
  baseline: "Disposition is EXACTLY one of: IN (the section of this artifact that covers it) · OUT-OF-SCOPE (the one-line why + a NAMED destination that now exists: a backlog row you wrote, a separate spec you named, a mail you sent — \"later\" with no destination is a silent drop wearing a label) · ASK (it joins the batched question set, per the question bar)"
  current: "Disposition is EXACTLY one of: IN (the section of this artifact that covers it) · OUT-OF-SCOPE (the one-line why + a NAMED destination that now exists: a backlog row you wrote, a separate spec you named, a mail you sent — \"later\" with no destination is a silent drop wearing a label) · ASK (it joins the batched question set, per the question bar)"
