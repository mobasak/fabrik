  section: "## ⚠️ Intake Inventory — the conversation IS a denominator (build it before you design anything)"
  baseline: "⚠️ ASK has a bar, and it is the project's own frozen artifacts. Before ANY item may be ASK, DERIVE its disposition from the goal record — `docs/DECISIONS.md` (the decision ledger: a prior ruling or rejected option decides an item outright), `docs/FEATURES.md`, the rivals dossier, `docs/flows.md`, the spec chain, the Locked Decisions — and cite the row that decides it"
  current: "⚠️ ASK has a bar, and it is the project's own frozen artifacts. Before ANY item may be ASK, DERIVE its disposition from the goal record — `docs/DECISIONS.md` (the decision ledger: a prior ruling or rejected option decides an item outright), `docs/FEATURES.md`, the rivals dossier, `docs/flows.md`, the spec chain, the Locked Decisions — and cite the row that decides it"
  text:
  - "⚠️ ASK has a bar, and it is the project's own frozen artifacts. Before ANY item may be ASK, DERIVE its disposition from the goal record"
  - "`docs/DECISIONS.md` (the decision ledger: a prior ruling or rejected option decides an item outright), `docs/FEATURES.md`, the rivals dossier, `docs/flows.md`, the spec chain, the Locked Decisions"
  - "and cite the row that decides it"
- id: ci-derivable-items-are-never-asked
  # class: ban
  # clauses: L14.1, L14.2, L14.3, L15.2
  file: commands/_fragments/chat-intake.md
  section: "## ⚠️ Intake Inventory — the conversation IS a denominator (build it before you design anything)"
  baseline: "An item those artifacts answer is IN or OUT-OF-SCOPE by derivation, never a question ; ASK is legal only when they genuinely under-determine it, and even then it arrives as a RECOMMENDED disposition with the derivation shown ; a bare option menu handed to the operator is the question-bar violation this bar exists to kill ; yours\" for six items, the hub re-asked the operator the same menu, the operator refused (\"don't you know our rules, commands, goals?\")"
  current: "An item those artifacts answer is IN or OUT-OF-SCOPE by derivation, never a question; ASK is legal only when they genuinely under-determine it, and even then it arrives as a RECOMMENDED disposition with the derivation shown — a bare option menu handed to the operator is the question-bar violation this bar exists to kill (a run ended on \"successor spec or explicit cuts — yours\" for six items, the hub re-asked the operator the same menu, the operator refused (\"don't you know our rules, commands, goals?\"))"
  text:
  - "An item those artifacts answer is IN or OUT-OF-SCOPE by derivation, never a question"
  - "ASK is legal only when they genuinely under-determine it, and even then it arrives as a RECOMMENDED disposition with the derivation shown"
  - "a bare option menu handed to the operator is the question-bar violation this bar exists to kill (a run ended on \"successor spec or explicit cuts"
  - "yours\" for six items, the hub re-asked the operator the same menu, the operator refused (\"don't you know our rules, commands, goals?\"))"
