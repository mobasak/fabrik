  baseline: "⚠️ VISUAL-DELIVERABLE QA — if a journey's deliverable IS a visual artifact, the proof is EYES ON THE RENDERED PIXELS. Structural checks (file exists, format header, HTTP 200, the right hexes in the JSON/CSS, the source SVG's bytes present inside the composed output) prove the pipeline WIRED the right inputs — they do NOT prove the rendered result looks right (live defect: every structural check green while a logo could be clipped, card text overflowing the bleed, contrast broken, fonts silently falling back — \"content-verified is NOT visually QA'd\")"
  current: "⚠️ VISUAL-DELIVERABLE QA — if a journey's deliverable IS a visual artifact, the proof is EYES ON THE RENDERED PIXELS. Structural checks (HTTP 200, the right hexes) prove the pipeline WIRED the right inputs, not that the result looks right"
