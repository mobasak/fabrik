- id: or-hub-absolute
  file: commands/_fragments/orient.md
  section: '## Orient — the four things every run executes before its first phase (D-335 § 5 item 7)'
  baseline: 'Hub-absolute paths on purpose: the rendered command runs from every repo on the box and two of the four live only in the hub (`mcp_health.py`, the manifesto are in no project; `--repo .` / `--project-root .` point the scripts at the repo you are in)'
  current: The paths are hub-absolute because `mcp_health.py` and the manifesto live only in the hub
  text:
  - The paths are hub-absolute because `mcp_health.py` and the manifesto live only in the hub
- id: or-surface-paths
  file: commands/_fragments/orient.md
  section: '## Orient — the four things every run executes before its first phase (D-335 § 5 item 7)'
  baseline: '`<the surface''s paths>` is the FILE LIST the run record''s `--surface` names — `$(git diff --name-only <range>)` for a diff range, a plan''s Touches, a spec''s files; a range or a directory passed as-is matches 0 packs at rc 0 and is a re-run with paths, never `none`'
  current: '`<the surface''s paths>` is the FILE LIST the run record''s `--surface` names (`$(git diff --name-only <range>)`, a plan''s Touches, a spec''s files); a range or directory matches 0 packs at rc 0, so re-run with paths, never `none`'
  text:
  - '`<the surface''s paths>` is the FILE LIST the run record''s `--surface` names'
  - a range or directory matches 0 packs at rc 0, so re-run with paths, never `none`
- id: or-bare-run
  file: commands/_fragments/orient.md
  section: '## Orient — the four things every run executes before its first phase (D-335 § 5 item 7)'
  baseline: 'A surface with no paths yet (a spec from an idea) runs it bare: a PLANNING command then reads every ACTIVE pack (`CLAUDE.md` § Orient 4, binding); every other command reads the ACTIVE packs whose description matches the work'
  current: 'A surface with no paths yet runs it bare: a PLANNING command then reads every ACTIVE pack (`CLAUDE.md` § Orient 4, binding), every other command the ACTIVE packs whose description matches the work'
  text:
  - A surface with no paths yet runs it bare
  - a PLANNING command then reads every ACTIVE pack (`CLAUDE.md` § Orient 4, binding)
  - every other command the ACTIVE packs whose description matches the work
- id: or-dead-mcp
  file: commands/_fragments/orient.md
  section: '## Orient — the four things every run executes before its first phase (D-335 § 5 item 7)'
  baseline: Executed, never recalled — an assigned-but-dead MCP is FIX-FIRST (`CLAUDE.md` § Behavior) and is named on that line, never a silent fallback; the packs listed are READ before the first edit; the infra and manifesto sections named are the ones then read and cited `path:line` where the run relies on them
