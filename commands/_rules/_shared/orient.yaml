- id: or-cobra
  file: commands/_fragments/orient.md
  section: '## Orient — the four things every run executes before its first phase (D-335 § 5 item 7)'
  baseline: 'COBRA (D-253): the cheapest way to satisfy "one ORIENT line" is to write it from memory, so every field is an EXECUTED output — the assigned count, the pack count with its denominator, the section names — and a recalled line reads wrong on the next run; an empty field has skipped a step, not saved one'
