- id: gui-frontend-design
  file: commands/_agents/fabrik-gui.md
  section: '## Method (per screen — iterate to a no-op)'
  baseline: On a web surface, `frontend-design:frontend-design`'s build and self-critique passes shape what the contract leaves free (a marketing or landing hero's form, the one memorable element — never a spacing, motion or type pattern the template prescribes) inside what it lists — never a screen, component or field it does not list — with the frozen contract and design system as its brief (`core/63-frontend-design.md`)
