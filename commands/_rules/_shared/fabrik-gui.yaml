- id: gui-git-readonly
  file: commands/_agents/fabrik-gui.md
  section: '## Your toolset'
  baseline: 'Read-only git (spec D8) — you build files, the orchestrator commits: NO git command that mutates state in the shared tree — no stash, checkout, reset, restore, apply, commit, clean; read-only git only (`show`, `diff`, `log`, `status`, `ls-files`); every probe on a copy (2026-09-11: a reviewer seat''s `git stash --keep-index` swept three sessions'' uncommitted work mid-pass — recovered by the lead, by content from the stash, never a pop)'
  current: 'Read-only git (spec D8) — you build files, the orchestrator commits: NO git command that mutates state in the shared tree — no stash, checkout, reset, restore, apply, commit, clean; read-only git only (`show`, `diff`, `log`, `status`, `ls-files`); every probe on a copy'
  text:
