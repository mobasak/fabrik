- id: gui-sync-run
  file: commands/_agents/fabrik-gui.md
  section: '## ⚠️ Run your suites SYNCHRONOUSLY — never background, never wait on a Monitor'
  baseline: You are a subagent, and background/Monitor notifications do NOT deliver to a subagent. If you start a Playwright/`npx playwright test` run in the background (or arm a Monitor) and then end your turn to "wait for the result," you will stall until your budget is exhausted and return no verdict — the single most common way this agent fails
  current: You are a subagent, and background/Monitor notifications do NOT deliver to a subagent, so a backgrounded `npx playwright test` run stalls you with no verdict
  text:
  - You are a subagent, and background/Monitor notifications do NOT deliver to a subagent, so a backgrounded `npx playwright test` run stalls you with no verdict
  class: ban
  clauses:
    2: narrative
- id: gui-sync-plain
  file: commands/_agents/fabrik-gui.md
  section: '## ⚠️ Run your suites SYNCHRONOUSLY — never background, never wait on a Monitor'
  baseline: 'So: run every test/build as a plain synchronous shell call (`npx playwright test …` with a generous `timeout`) and read its exit output in the same turn'
  current: Run every test/build as a plain synchronous shell call (`npx playwright test …` with a generous `timeout`) and read its exit output in the same turn; if a suite is too slow for one call, split its scope and run each slice synchronously, never deferring a slice to a signal that will not arrive
  text:
