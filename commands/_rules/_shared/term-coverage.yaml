  section: '## ⚠️ Termination contract — coverage-adjudicated (READ FIRST — the rule agents skip)'
  baseline: |-
    ⚠️ COBRA (D-253): the cheap way to satisfy this without doing it is to write corrections carrying no checkable claims at all, so the obligation is discharged EQUALLY by DELETING an unverifiable claim — the cheap path and the compliant path are the same one, and `denominator-honesty` already forbids a count without its population, so vagueness buys nothing either; (2) THE PRE-PIN SWEEP IS A COMMAND — `python3 scripts/enforcement/check_review_hygiene.py --surface <pin> --claim <term>` lists every line of the pinned surface where a rewritten claim's literal term occurs (case- and wrap-tolerant; a directory surface walks only its `.md` and `.py` files); a mirror outside the pin or in other words is not in that list, so also grep the repo for the term and two rewordings of the claim, and read each site before the pin and APPEND `· mirrors: <n> read` to that row's `method:` cell after its re-derivation text (a `claim` row pasted into the receipt is dispositioned `RECORDED — measured (<n> mirrors read)`, never FIXED); (3) TWO CONSECUTIVE RESIDUE PASSES FORCE A REWRITE — when two consecutive delta rounds confirm only defects inside the previous round's hunks, or one SITE — the smallest enclosing unit: a sentence, bullet item or table row, or a function or top-level statement — yields an own-fix defect in two consecutive delta rounds, whatever else those rounds found (each such finding row cites `site: <a quotable anchor>`), the next edit rewrites the affected paragraph or function from the probe's output in ONE batch instead of a third patch, first asking whether the yielding site, or a branch or clause in it, can be deleted outright (a deletion is that rewrite), since a deletion ends the residue and a re-cut restarts it, and the row's method cell APPENDS `; class rewrite — <site or paragraph> (rounds k, k+1)`; when that residue is itself a sentence that RESTATES, COUNTS or PARTITIONS what another artifact owns, the rewrite is a DELETION — the sentence goes, replaced by at most a pointer to where the fact is re-derivable (each pointer OPENED before the pin and the fact seen at it, then recorded by APPENDING one `· pointer: <path:line> read` per pointer to the Pass Ledger row's `method:` cell, after its `; class rewrite` text), never by a re-cut of the claim; a sentence left in place with a citation appended is not a deletion, and is the cheapest way to look compliant while the restatement goes on drifting; a function under review that picks ONE item from a list by heuristic (a first match, a reason line taken from a log) takes this rule's ONE-batch rewrite at the first delta round in which its site yields an own-fix defect, recast, when it is not deleted, as the whole list filtered by a noise rule probed against the list's live population like any matcher above, with a single pick taken from the filtered list where its callers need one, and its row's method cell appends `; class rewrite — <site> (round k)`; a second yield at that site without the rewrite is already the foundation error the next clause names for a third residue pass; a third residue pass without a rewrite is the non-convergence breaker's foundation error, named in the `## BLOCKED` question, while the rewrite counts as one more fix attempt on each claim it answers, so a claim that survives it is paused under the per-finding BLOCKED escalation once its own count reaches three consecutive attempts, and looping continues; the scope-growth stop below takes over from the FIRST round at which it applies — the first whose `round` prints `SCOPE GROWTH —` or `SCOPE GROWTH (in-lane)`, never `SCOPE GROWTH UNCOMPUTABLE`, and for a command `round` never prints it for, rule (3) governs throughout: a rewrite triggered in or before that round is still owed before the CLOSING round and is the one own-fix item the backlog exit does not take — a rewrite emits new text, new text is in-hunk, and the closing round must read `md5(start) == md5(end)`; any later yield, at a new site or a rewritten one, goes to the stop's exit
  text:
