- id: tc-u36-4-grader-proven
  class: ban
  clauses:
    9: narrative
  file: commands/_fragments/term-coverage.md
  section: '## ⚠️ Termination contract — coverage-adjudicated (READ FIRST — the rule agents skip)'
  baseline: |-
    (4) A GRADER IS PROVEN BY ITS RED, NEVER BY ITS GREEN — every mutant a fix names is asserted dead by the NAME of the failing test on a fresh copy of the pin, its result line quoted, environment-bound tests deselected, `__pycache__` purged and `PYTHONDONTWRITEBYTECODE=1` set (a `.pyc` whose source size and mtime match is reused, so an equal-size mutant written in the same second runs the old code), the test process printing the mutated module's `__file__` with output capture off (pytest `-s`, or a passing run swallows the print); a mutant is dead only when that test fails on its own assertion or on an exception raised in the mutated code — an import, collection or harness error is no kill — and only after the same command on the unmutated copy selected tests and passed (vitest's `-t` is a regex that exits 0 when it selects none; pytest exits 5 then, and 4 on a malformed `-k`), the mutant itself shown applied by a diff of the copy against the pin, never a grep count; a survivor is reported only once shown to change observable behaviour (an output, return value, exit code, raised exception or written state diffed against the unmutated copy), and an equivalent mutant, a named one included, is struck with that diff quoted, never reported as a test gap; the battery mutates EVERY CLAUSE THE FIX ADDS, not only the lines its graders cite; each grader is proven it CAN fail by REMOVING THE GUARD, never by breaking an expression inside it — an exception that lands in the surrounding handler makes a SOUND grader look weak; a fix landing in both a function and its CLI half is graded on EACH half EVEN WHEN THE FUNCTION HALF IS ALREADY GREEN, because a dead function-level mutant says nothing about the argparse block; and a round that EDITS a test file states the grader NAMES it removed and added AND every grader whose BODY it changed (`^def test_`, `func Test`, or `^\s*(test|it)(\.each)?\(` — whichever pattern the suite's language uses; that last one needs `grep -E`/`rg`, since in default BRE it exits nonzero and a pipe reads it as a clean ZERO), never a bare count, because a DELETED grader leaves no red — and the cheapest bypass is not a deletion at all but a BODY-ONLY edit, a gutted assertion or a `skip` marker, which changes no name and leaves both lists honestly empty; so each name AND each changed body is paired with the mutant it was proven red on
  text:
  - |-
