- id: tc-input-classes
  # class: behavioural-pinned-prose
  file: commands/_fragments/term-coverage.md
  section: '## ⚠️ Termination contract — coverage-adjudicated (READ FIRST — the rule agents skip)'
  baseline: 'for example a matcher or replacer against boundary, sentinel, prefix, overlapping, escaped and alternate-notation inputs, and against its live population before it widens or narrows, a parser against every form its grammar admits, a guard against an input that shows the condition, one that does not, every error path and five LEGITIMATE spellings of its subject (`45-testing-strategy` § Banned Patterns, the row *A GUARD proven only by the ONE spelling*: under 5/5 is a finding), a re-cut guard against the mutant of the finding it answers AND, for a phrase guard, that mutant''s mirrors (its negation in the same word order and a reordered rewording), a guard the fix ADDS run over the fix''s own hunks too, a recursive or fallback helper against cycles, depth and each container type, a trim or window at exactly one record''s length, and any other fix against the input classes its own shape implies, listed before the probe runs;'
  current: 'Round zero — the orchestrator''s OWN pre-pin probe (D7, D10 — D-231), before any finder sees a delta and again before EVERY re-dispatch of the owning seats (a pass''s fix hunks are probed before the seat is re-sent, not only before round one — D-335): the fix''s own INPUT space is enumerated and executed before the pin, so no seat is the first to meet it — for example a matcher or replacer against boundary, sentinel, prefix, overlapping, escaped and alternate-notation inputs, and against its live population before it widens or narrows, a parser against every form its grammar admits, a guard against an input that shows the condition, one that does not, every error path and five LEGITIMATE spellings of its subject (`45-testing-strategy` § Banned Patterns, the row *A GUARD proven only by the ONE spelling*: under 5/5 is a finding), a re-cut guard against the mutant of the finding it answers AND, for a phrase guard, that mutant''s mirrors (its negation in the same word order and a reordered rewording), a guard the fix ADDS run over the fix''s own hunks too, a recursive or fallback helper against cycles, depth and each container type, a trim or window at exactly one record''s length, and any other fix against the input classes its own shape implies, listed before the probe runs; the fix''s mutation battery (rule 4) runs only on a copy and under an explicit `timeout` at or above its own measured runtime — a battery killed mid-mutation leaves the copy, never the tree, neutered; every added line is re-read WHOLE (length, citations, claims); the CLASS of the fix is swept — the siblings of the shape at every mirror site — because a round whose finders confirm only residue of the previous round''s fix is the signal to sweep the class, not to run another round; a fix that names an interface (a function, flag, field or verb) cites the callee''s signature and line range read at the commit the round''s briefs pin (`git show <sha>:<path>`), and is re-read against that range before the pin; a fix to a matcher, replacer, predicate or filter, a regex included, and above all one that narrows or widens what it accepts, is drafted and probed against every shape this review has confirmed so far and, where a shape names a field or key, against its renamed variant too, all at once, never one patch per shape; a guard added because one bad input reached a reader is written as the readers'' round-trip (a value is accepted only when every reader parses back what was written), never as a check for that one input; a pointer the fix writes — rule (3)''s included — into a file `/opt/fabrik/scripts/fabrik_synced_manifest.py` distributes is opened with `test -e` from a synced project repo as well as from the hub, since a path only `/opt/fabrik` holds resolves nowhere in the fleet; a CHANGELOG or doc line the fix writes that would restate, count or partition what another artifact owns is a pointer to that owner from the first draft, opened before the pin and recorded by APPENDING `· pointer: <path:line> read` after the round-zero probe text below; a fix that reads a field another check in the same file or call path already validates (grep the pin for the field name) takes both reads from one helper, and the readers'' round-trip above still holds; the Pass Ledger''s `method:` cell APPENDS `; round-zero probe — <what>` to its re-derivation text on the row that records it (a cell reading only the probe fails the coverage gate''s re-derivation row rule)'
  text:
  - boundary, sentinel, prefix, overlapping, escaped and alternate-notation inputs
  pins:
  - tests/test_command_improve_queue_pass.py::test_a_widened_subject_and_a_recipe_meet_their_breaking_inputs_before_the_pin
- id: tc-remainder-restates-slices
  # class: prose
  file: commands/_fragments/term-coverage.md
  section: '## ⚠️ Termination contract — coverage-adjudicated (READ FIRST — the rule agents skip)'
  baseline: 'The exit, in short: NAME and fix every confirmed defect still open in the window, route genuinely own-fix work to the chosen route (`/fabrik-spec` or the backlog row), re-verify the fixed set alone (in a slice-partitioned loop, its `round --slices` still re-states every earlier slice;'
  current: 'The exit, in short: NAME and fix every confirmed defect still open in the window, route genuinely own-fix work to the chosen route (`/fabrik-spec` or the backlog row), re-verify the fixed set alone (in a slice-partitioned loop, its `round --slices` still re-states every earlier slice; an own-fix defect those rounds raise is RECORDED onto the routed work and never re-arms the stop), and close on a `confirmed: 0 · fixed: 0 · unexecuted: 0` row, as any review closes (D-355)'
  text:
  - re-verify the fixed set alone (in a slice-partitioned loop, its `round --slices` still re-states every earlier slice;
  pins:
  - tests/test_review_queue_pass.py::test_a_scope_growth_remainder_round_restates_every_slice
- id: tc-scope-paragraph-binds
  # class: prose
  file: commands/_fragments/term-coverage.md
  section: '## ⚠️ Termination contract — coverage-adjudicated (READ FIRST — the rule agents skip)'
  baseline: and every obligation below (the exit row, the ledger grammar, the finder-return rule, the gates) binds all five consumers alike, while round zero binds only a consumer that runs delta rounds — before its round one and before every re-dispatch — and rule (5) only a fix to a checker or a gate
  current: THE SCOPE PARAGRAPH — D4 and D5 govern every DELTA round any consumer of this contract runs; the exemption above governs a consumer's round-1 SURFACE and its hash, not how a later round counts or is sized. `/fabrik-review` and `/fabrik-repo-review` run D-207's delta rounds; a certification gauntlet or the inventory review runs a DELTA round only where its own text names one as such — its confirming round (a FULL round by its own Phase text) is not a delta round and D5 never resizes it — and every obligation below (the exit row, the ledger grammar, the finder-return rule, the gates) binds all five consumers alike, while round zero binds only a consumer that runs delta rounds — before its round one and before every re-dispatch — and rule (5) only a fix to a checker or a gate
  text:
  - binds all five consumers alike, while round zero binds only a consumer that runs delta rounds — before its round one and before every re-dispatch — and rule (5) only a fix to a checker or a gate.
  pins:
  - tests/test_review_queue_pass.py::test_the_scope_paragraph_says_where_round_zero_and_rule_five_bind
- id: tc-rule3-pointer-opened
  # class: ban
  file: commands/_fragments/term-coverage.md
  section: '## ⚠️ Termination contract — coverage-adjudicated (READ FIRST — the rule agents skip)'
  baseline: 'the sentence goes, replaced by at most a pointer to where the fact is re-derivable (each pointer OPENED before the pin and the fact seen at it, then recorded by APPENDING one `· pointer: <path:line> read` per pointer to the Pass Ledger row''s `method:` cell, after its `; class rewrite` text), never by a re-cut of the claim;'
  current: '⚠️ COBRA (D-253): the cheap way to satisfy this without doing it is to write corrections carrying no checkable claims at all, so the obligation is discharged EQUALLY by DELETING an unverifiable claim — the cheap path and the compliant path are the same one, and `denominator-honesty` already forbids a count without its population, so vagueness buys nothing either; (2) THE PRE-PIN SWEEP IS A COMMAND — `python3 scripts/enforcement/check_review_hygiene.py --surface <pin> --claim <term>` lists every line of the pinned surface where a rewritten claim''s literal term occurs (case- and wrap-tolerant; a directory surface walks only its `.md` and `.py` files); a mirror outside the pin or in other words is not in that list, so also grep the repo for the term and two rewordings of the claim, and read each site before the pin and APPEND `· mirrors: <n> read` to that row''s `method:` cell after its re-derivation text (a `claim` row pasted into the receipt is dispositioned `RECORDED — measured (<n> mirrors read)`, never FIXED); (3) TWO CONSECUTIVE RESIDUE PASSES FORCE A REWRITE — when two consecutive delta rounds confirm only defects inside the previous round''s hunks, or one SITE — the smallest enclosing unit: a sentence, bullet item or table row, or a function or top-level statement — yields an own-fix defect in two consecutive delta rounds, whatever else those rounds found (each such finding row cites `site: <a quotable anchor>`), the next edit rewrites the affected paragraph or function from the probe''s output in ONE batch instead of a third patch, first asking whether the yielding site, or a branch or clause in it, can be deleted outright (a deletion is that rewrite), since a deletion ends the residue and a re-cut restarts it, and the row''s method cell APPENDS `; class rewrite — <site or paragraph> (rounds k, k+1)`; when that residue is itself a sentence that RESTATES, COUNTS or PARTITIONS what another artifact owns, the rewrite is a DELETION — the sentence goes, replaced by at most a pointer to where the fact is re-derivable (each pointer OPENED before the pin and the fact seen at it, then recorded by APPENDING one `· pointer: <path:line> read` per pointer to the Pass Ledger row''s `method:` cell, after its `; class rewrite` text), never by a re-cut of the claim; a sentence left in place with a citation appended is not a deletion, and is the cheapest way to look compliant while the restatement goes on drifting; a function under review that picks ONE item from a list by heuristic (a first match, a reason line taken from a log) takes this rule''s ONE-batch rewrite at the first delta round in which its site yields an own-fix defect, recast, when it is not deleted, as the whole list filtered by a noise rule probed against the list''s live population like any matcher above, with a single pick taken from the filtered list where its callers need one, and its row''s method cell appends `; class rewrite — <site> (round k)`; a second yield at that site without the rewrite is already the foundation error the next clause names for a third residue pass; a third residue pass without a rewrite is the non-convergence breaker''s foundation error, named in the `## BLOCKED` question, while the rewrite counts as one more fix attempt on each claim it answers, so a claim that survives it is paused under the per-finding BLOCKED escalation once its own count reaches three consecutive attempts, and looping continues; the scope-growth stop below takes over from the FIRST round at which it applies — the first whose `round` prints `SCOPE GROWTH —` or `SCOPE GROWTH (in-lane)`, never `SCOPE GROWTH UNCOMPUTABLE`, and for a command `round` never prints it for, rule (3) governs throughout: a rewrite triggered in or before that round is still owed before the CLOSING round and is the one own-fix item the backlog exit does not take — a rewrite emits new text, new text is in-hunk, and the closing round must read `md5(start) == md5(end)`; any later yield, at a new site or a rewritten one, goes to the stop''s exit'
  text:
  - 'replaced by at most a pointer to where the fact is re-derivable (each pointer OPENED before the pin and the fact seen at it, then recorded by APPENDING one `· pointer: <path:line> read` per pointer to the Pass Ledger row''s `method:` cell, after its `; class rewrite` text), never by a re-cut of the claim;'
  pins:
  - tests/test_review_queue_pass.py::test_rule_three_pointer_is_opened_before_the_pin
- id: tc-equivalent-mutant
  # class: ban
  file: commands/_fragments/term-coverage.md
  section: '## ⚠️ Termination contract — coverage-adjudicated (READ FIRST — the rule agents skip)'
  baseline: pytest exits 5 then, and 4 on a malformed `-k`), the mutant itself shown applied by a diff of the copy against the pin, never a grep count; a survivor is reported only once shown to change observable behaviour (an output, return value, exit code, raised exception or written state diffed against the unmutated copy), and an equivalent mutant, a named one included, is struck with that diff quoted, never reported as a test gap;
  current: (4) A GRADER IS PROVEN BY ITS RED, NEVER BY ITS GREEN — every mutant a fix names is asserted dead by the NAME of the failing test on a fresh copy of the pin, its result line quoted, environment-bound tests deselected, `__pycache__` purged and `PYTHONDONTWRITEBYTECODE=1` set (a `.pyc` whose source size and mtime match is reused, so an equal-size mutant written in the same second runs the old code), the test process printing the mutated module's `__file__` with output capture off (pytest `-s`, or a passing run swallows the print); a mutant is dead only when that test fails on its own assertion or on an exception raised in the mutated code — an import, collection or harness error is no kill — and only after the same command on the unmutated copy selected tests and passed (vitest's `-t` is a regex that exits 0 when it selects none; pytest exits 5 then, and 4 on a malformed `-k`), the mutant itself shown applied by a diff of the copy against the pin, never a grep count; a survivor is reported only once shown to change observable behaviour (an output, return value, exit code, raised exception or written state diffed against the unmutated copy), and an equivalent mutant, a named one included, is struck with that diff quoted, never reported as a test gap; the battery mutates EVERY CLAUSE THE FIX ADDS, not only the lines its graders cite; each grader is proven it CAN fail by REMOVING THE GUARD, never by breaking an expression inside it — an exception that lands in the surrounding handler makes a SOUND grader look weak; a fix landing in both a function and its CLI half is graded on EACH half EVEN WHEN THE FUNCTION HALF IS ALREADY GREEN, because a dead function-level mutant says nothing about the argparse block; and a round that EDITS a test file states the grader NAMES it removed and added AND every grader whose BODY it changed (`^def test_`, `func Test`, or `^\s*(test|it)(\.each)?\(` — whichever pattern the suite's language uses; that last one needs `grep -E`/`rg`, since in default BRE it exits nonzero and a pipe reads it as a clean ZERO), never a bare count, because a DELETED grader leaves no red — and the cheapest bypass is not a deletion at all but a BODY-ONLY edit, a gutted assertion or a `skip` marker, which changes no name and leaves both lists honestly empty; so each name AND each changed body is paired with the mutant it was proven red on
  text:
  - shown applied by a diff of the copy against the pin, never a grep count; a survivor is reported only once shown to change observable behaviour (an output, return value, exit code, raised exception or written state diffed against the unmutated copy), and an equivalent mutant, a named one included, is struck with that diff quoted, never reported as a test gap
  pins:
  - tests/test_review_queue_pass.py::test_an_equivalent_mutant_is_discarded_never_reported_as_a_test_gap
