  baseline: 'Five rules bind the probe: (1) ANY CLAIM WITH A CHECKABLE REFERENT IS A SCRIPT, NOT PROSE and that includes every claim YOUR OWN FIX introduces. A claim about what a verb, a window or a reach-back does, AND every count, enumeration, line anchor, step reference, mutant prediction (a mutant its grader is said to kill) or negative, is executed at round 1, or before the pin that first carries it, as a probe script pinned beside the receipt (`<scratchpad>/<review>/probes/<claim>.sh`, its output pasted under the claim), re-run and re-cited when the claim or what it measures changes (a fix that changes what a quoted advisory counts, such as a plan''s Touches), and never replaced by a finder''s own re-derivation: a finder that re-derives the claim, as the closing pass does, and gets a different answer raises the difference as a candidate'
