- id: sge-silence-not-a-verdict
  # class: prose
  baseline: '⚠️ SILENCE IS COMMON AND IS NOT A VERDICT. Nothing prints before the third round — > the window is three rounds wide — and nothing prints when the loop is MERELY converging with no own-fix residue (a falling count that is mostly own-fix DOES print the stop)'
  current: '⚠️ SILENCE IS COMMON AND IS NOT A VERDICT. Nothing prints before the third round — > the window is three rounds wide — and nothing prints when the loop is MERELY converging with no own-fix residue (a falling count that is mostly own-fix DOES print the stop)'
