- id: sge-scope-growth
  # class: grammar
  baseline: '`⚠️ SCOPE GROWTH` — the loop is correcting its own corrections: > stop HUNTING, name and fix every confirmed defect still open anywhere in the window, route > genuinely own-fix residue to a backlog row with a named destination, re-verify the fixed set, and > close on a `confirmed: 0 · fixed: 0 · unexecuted: 0` row (D-355)'
  current: '`⚠️ SCOPE GROWTH` — the loop is correcting its own corrections: > stop HUNTING, name and fix every confirmed defect still open in the window, route > own-fix residue to a backlog row with a named destination, re-verify the fixed set, and > close on a `confirmed: 0 · fixed: 0 · unexecuted: 0` row'
  text:
  - '`⚠️ SCOPE GROWTH` — the loop is correcting its own corrections: > stop HUNTING, name and fix every confirmed defect still open in the window, route > own-fix residue to a backlog row with a named destination, re-verify the fixed set, and > close on a `confirmed: 0 · fixed: 0 · unexecuted: 0` row'
- id: sge-escalate-uncomputable
  # class: ban
  baseline: '`↗ ESCALATE` — the ratio was computed, NOT met, and the count is not falling: > these are the artifact''s own defects and the surface outgrew this pass, so route up per step 5. > `? SCOPE GROWTH UNCOMPUTABLE` — a window round never stated a readable > `--confirmed`/`--own-fix` pair and it would decide the verdict: state it and re-record before > deciding'
  current: '`↗ ESCALATE` — the ratio was computed, NOT met, and the count is not falling: > the surface outgrew this pass, so route up per step 5. > `? SCOPE GROWTH UNCOMPUTABLE` — a window round never stated a readable > `--confirmed`/`--own-fix` pair and it would decide the verdict: state it and re-record before > deciding'
