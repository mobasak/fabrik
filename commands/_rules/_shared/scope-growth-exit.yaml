- id: sge-silence-never-means
  # class: ban
  baseline: 'So > silence NEVER means "this is not the scope-growth case": at round 2, or on any silent round, the > exit is your own reading of whether the defects are the ARTIFACT''S or this review''s, exactly as it > was before the verdict existed'
