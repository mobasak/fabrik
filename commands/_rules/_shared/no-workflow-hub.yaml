- id: banner-a-dead-resumed-seat-is-re
  file: commands/_fragments/no-workflow-hub.md
  baseline: 'Every `Workflow` launch this command names (a round-1 pass, a delta or closing pass, a relaunch, a wave) is replaced by its Agent-tool fallback: the same seats and the same briefs as ONE `Agent` message, with each seat''s absolute scratch folder and the pass''s pin (a later pass may resume a round-1 seat with `SendMessage`, and one that comes back dead, as after an account switch''s API 403, is re-dispatched fresh with its slice''s or unit''s ledger and the previous seat''s REFUTED list), and the close or the Pass row records `shape: agent-tool`'
  current: 'Every `Workflow` launch this command names (a round-1 pass, a delta or closing pass, a relaunch, a wave) is replaced by its Agent-tool fallback: the same seats and the same briefs as ONE `Agent` message, with each seat''s absolute scratch folder and the pass''s pin (a later pass may resume a round-1 seat with `SendMessage`, and one that comes back dead, as after an account switch''s API 403, is re-dispatched fresh with its slice''s or unit''s ledger and the previous seat''s REFUTED list), and the close or the Pass row records `shape: agent-tool`'
  text:
