- id: banner-every-workflow-command-carries-the-no
  file: commands/_fragments/no-workflow-hub.md
  baseline: '> ⚠️ NO `Workflow` IN THE HUB — D-961 (operator, 2026-10-18; supersedes D-957 in part). In the hub — a session whose `git rev-parse --show-toplevel` is `/opt/fabrik` or a worktree under `/opt/fabrik/.claude/worktrees/` — never call the `Workflow` tool'
  current: '> ⚠️ NO `Workflow` IN THE HUB — D-961 (operator, 2026-10-18; supersedes D-957 in part). In the hub (a session whose `git rev-parse --show-toplevel` is `/opt/fabrik` or a worktree under `/opt/fabrik/.claude/worktrees/`), never call the `Workflow` tool: replace every launch this command names with ONE `Agent` message of the same seats, briefs, absolute scratch folders and pin, and record `shape: agent-tool` in the close or the Pass row'
  text:
  - NO `Workflow` IN THE HUB — D-961 (operator, 2026-10-18; supersedes D-957 in part). In the hub
  - a session whose `git rev-parse --show-toplevel` is `/opt/fabrik` or a worktree under `/opt/fabrik/.claude/worktrees/`), never call the `Workflow` tool
  class: ban
  pins:
