  file: commands/_fragments/grounding-rules.md
  section: "## ⚠️ Rule-grounding gate (BINDING — governance is read into an artifact, never into memory)"
  baseline: "Head the columns `Quote` (or `Verbatim`) and `Source` (a repo-relative `path:line` alone in its cell); without those headers the checker treats a leading `#` column as a row label and reads the column just before `Source` as the quote (the column after it when `Source` comes first, the first other column when no `Source` is named), and the column after the quote as the source when `Source` is not named"
