  # clauses: L8.1
  file: commands/_fragments/grounding-code.md
  section: "## ⚠️ Codebase-grounding gate (BINDING — a finding is a claim about the LIVE code)"
  baseline: "A build-site read that stops above a `pop`/`del`/filter/`exclude_unset` is the class. Ask not \"is the symbol at this line?\" but \"is this the shape that reaches disk / the wire / the caller?\""
