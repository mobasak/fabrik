  section: "## ⚠️ Codebase-grounding gate (BINDING — a finding is a claim about the LIVE code)"
  baseline: "⚠️ Cite the EMIT site, not the BUILD site. A claim about a WRITTEN artifact — a file the code emits, a row it inserts, a payload it returns — must cite where that shape is DECIDED: the write/emit call, or the last mutation before it"
