  section: "## Subagents — {{HEADLINE}}"
  baseline: "Every seat also runs one plain command per Bash call, whatever the command — no `&&`, a `;` between commands (a `;` inside a quoted `-c` program is data), pipe, loop, `$( )`, `$VAR`, heredoc or HOME assignment in front of a command; literal paths, and absolute paths for anything written or run (the shell returns to the live checkout before every call); a tool that roots itself at the working directory (`scripts/docs_updater.py`'s `PROJECT_ROOT = Path.cwd()`) runs only from a python program that `os.chdir`s into the seat's copy before it imports or runs the tool, since an absolute argument does not move that root and a `cd` in its own call does not persist; never `pkill`, `killall` or kill by pattern; a command whose output may be large (`git show`, `git diff`, `git log -p`, a broad search) redirects into a file under its scratch dir, because a large stdout is saved by the harness under `$HOME`, where a seat may not read; a linked worktree's isolation guard refuses what it cannot prove stays inside the worktree, reads the word git inside a `-c` program or a heredoc body as a git call (the word does not belong in such a program at all, even as data: search for it with `/usr/bin/grep`, and spelling git differently is still git), and refuses a `git -C` into the shared main checkout (W-165e533c — seats lost about a third of their time box to that refusal), and for a seat with a shell, a refusal that names a shape or a path (a `seat guard (…)` line, the worktree guard's shapes) is a rule: fix the named shape, every path still under your scratch dir, never re-send it unchanged; a refusal that names neither is the permission classifier, which can refuse a compliant command and accept it moments later: run the SAME command once more unchanged; refused again, reach the same bytes by another command into the same destination under your scratch dir (the pinned or base copy, by `cp -r` then `chmod -R u+w`, when the brief names one), else mark that check unverified — never a different destination — and say in MACHINERY which command was refused how many times of how many tries"
