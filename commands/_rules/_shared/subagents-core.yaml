- id: sc-review-shaped-fan-out-workflow
  # class: ban
  # clauses: L18.3
  file: commands/_fragments/subagents-core.md
  section: "## Subagents — {{HEADLINE}}"
  baseline: "runs, outside the hub (D-961: the hub never calls it), as ONE `Workflow` call on the review-loop script instead of the `Agent` message (chunk 6b"
  current: "A review-shaped units fan-out — finders over an artifact whose every candidate needs a verdict — runs, outside the hub (D-961: the hub never calls it), as ONE `Workflow` call on the review-loop script instead of the `Agent` message (chunk 6b; `<repo root>/.claude/workflows/fabrik-review-loop.js` — `<repo root>` is the session's own checkout — `git rev-parse --show-toplevel` from its working directory, so in a worktree the worktree, never the main checkout; contract `/opt/fabrik/docs/reference/review-loop-workflow.md` (hub-only, so cited hub-absolute — a hub branch that edits it reads its own checkout's copy); when the `Workflow` tool is absent or cannot load the script (a repo or checkout the sync has not reached), or the session is in the hub (D-961: the hub never calls the `Workflow` tool), or the operator did not invoke this run (the tool runs only on their explicit opt-in), the seats go out through the `Agent` tool in ONE message with the same briefs, and the receipt's Pass row (or, with no receipt, the close's `--evidence`) notes `shape: agent-tool`): each unit a slice `{name, files, scope: \"<the unit>\", models: [\"sonnet\", \"haiku\"]}` (`[\"sonnet\"]` where the mix gives it no Haiku seat), the Opus authoritative seat(s) the third finder of the risky unit(s), one refuter per unit EXECUTING every candidate; the stamp is the `SEATS:` plus one refuter per unit; read each pass with `scripts/review_loop_ledger.py read`, and every later pass carries only the units whose ledger holds an open claim, on the round-1 seats that raised them, their `ledger` from `review_loop_ledger.py next`"
  text:
  - "runs, outside the hub (D-961: the hub never calls it), as ONE `Workflow` call"
- id: sc-d8-seat-folder-and-scratch-homes
  # class: ban
  # clauses: L29.7
  file: commands/_fragments/subagents-core.md
  section: "## Subagents — {{HEADLINE}}"
  baseline: "a lead in a linked worktree, whose Write tool refuses that main-checkout `SCRATCH:` folder (mail 01M4Y3N9GW), writes each brief, fix list, note or draft there by a Bash `cp` of the copy it wrote in its scratchpad, and never leaves the only copy in the scratchpad, which a reboot clears"
  current: "The scratch dir a brief names is a SEAT FOLDER under the run's disposable folder — `<run scratch>/seat-<n>/`, `<run scratch>` being the path this run's `start` printed as `RUN-SCRATCH:` (kept as `run_scratch` in the run record; `docs/reference/command-run-protocol.md` § A run's disposable folder) — never the session scratchpad root, which no run owns and nothing removes. The folder goes when the run is consumed, so nothing durable is written there (resume artifacts go to `SCRATCH:`), and for a seat the lead briefs itself (a `Workflow` seat's prompt makes its own folder) the lead creates the folder with `mkdir -p` on its absolute path before the dispatching message, while the brief still tells the seat to run that same `mkdir -p` first (a no-op once the folder exists); a start that printed `RUN-SCRATCH: none — <why>` names a folder under the session scratchpad instead and the brief says so; the pins dir (the PIN paragraph below) sits under the same root, unless the including command puts it under the run's durable `SCRATCH:` folder (D-836), as `/fabrik-review`, `/fabrik-plan-review`, `/fabrik-spec-review` and `/fabrik-repo-review` do so an interrupted pass keeps its pins; a lead in a linked worktree, whose Write tool refuses that main-checkout `SCRATCH:` folder (mail 01M4Y3N9GW), writes each brief, fix list, note or draft there by a Bash `cp` of the copy it wrote in its scratchpad, and never leaves the only copy in the scratchpad, which a reboot clears; and a tree is staged in a seat folder only as the probe catalogue's § Seat isolation says — an archive of the pinned SHA, or a `clone --shared --no-checkout` — never a copy of the live checkout, whose `.claude/`, `.venv` and `node_modules` filled 73 GB of session scratch by 2026-10-14 (`round` names a seat folder over 2 GB — D5)"
  text:
  - "a lead in a linked worktree, whose Write tool refuses that main-checkout `SCRATCH:` folder (mail 01M4Y3N9GW), writes each brief, fix list, note or draft there by a Bash `cp` of the copy it wrote in its scratchpad, and never leaves the only copy in the scratchpad, which a reboot clears;"
  - "for a seat the lead briefs itself (a `Workflow` seat's prompt makes its own folder) the lead creates the folder with `mkdir -p` on its absolute path before the dispatching message, while the brief still tells the seat to run that same `mkdir -p` first (a no-op once the folder exists);"
  - "so nothing durable is written there (resume artifacts go to `SCRATCH:`), and for a seat the lead briefs itself (a `Workflow` seat's prompt makes its own folder) the lead creates the folder with `mkdir -p` on its absolute path before the dispatching message, while the brief still tells the seat to run that same `mkdir -p` first (a no-op once the folder exists);"
- id: sc-d8-one-plain-command-per-bash-call
  # class: ban
  # clauses: L32.4, L32.12
  file: commands/_fragments/subagents-core.md
  section: "## Subagents — {{HEADLINE}}"
  baseline: "a tool that roots itself at the working directory (`scripts/docs_updater.py`'s `PROJECT_ROOT = Path.cwd()`) runs only from a python program that `os.chdir`s into the seat's copy before it imports or runs the tool, since an absolute argument does not move that root and a `cd` in its own call does not persist; never `pkill`, `killall` or kill by pattern; a command whose output may be large (`git show`, `git diff`, `git log -p`, a broad search) redirects into a file under its scratch dir, because a large stdout is saved by the harness under `$HOME`, where a seat may not read; a linked worktree's isolation guard refuses what it cannot prove stays inside the worktree, reads the word git inside a `-c` program or a heredoc body as a git call (the word does not belong in such a program at all, even as data: search for it with `/usr/bin/grep`, and spelling git differently is still git), and refuses a `git -C` into the shared main checkout (W-165e533c — seats lost about a third of their time box to that refusal), and for a seat with a shell, a refusal that names a shape or a path (a `seat guard (…)` line, the worktree guard's shapes) is a rule: fix the named shape, every path still under your scratch dir, never re-send it unchanged; a refusal that names neither is the permission classifier, which can refuse a compliant command and accept it moments later: run the SAME command once more unchanged; refused again, reach the same bytes by another command into the same destination under your scratch dir (the pinned or base copy, by `cp -r` then `chmod -R u+w`, when the brief names one), else mark that check unverified — never a different destination — and say in MACHINERY which command was refused how many times of how many tries"
  current: "Every seat also runs one plain command per Bash call, whatever the command — no `&&`, a `;` between commands (a `;` inside a quoted `-c` program is data), pipe, loop, `$( )`, `$VAR`, heredoc or HOME assignment in front of a command; literal paths, and absolute paths for anything written or run (the shell returns to the live checkout before every call); a tool that roots itself at the working directory (`scripts/docs_updater.py`'s `PROJECT_ROOT = Path.cwd()`) runs only from a python program that `os.chdir`s into the seat's copy before it imports or runs the tool, since an absolute argument does not move that root and a `cd` in its own call does not persist; never `pkill`, `killall` or kill by pattern; a command whose output may be large (`git show`, `git diff`, `git log -p`, a broad search) redirects into a file under its scratch dir, because a large stdout is saved by the harness under `$HOME`, where a seat may not read; a linked worktree's isolation guard refuses what it cannot prove stays inside the worktree, reads the word git inside a `-c` program or a heredoc body as a git call (the word does not belong in such a program at all, even as data: search for it with `/usr/bin/grep`, and spelling git differently is still git), and refuses a `git -C` into the shared main checkout (W-165e533c — seats lost about a third of their time box to that refusal), and for a seat with a shell, a refusal that names a shape or a path (a `seat guard (…)` line, the worktree guard's shapes) is a rule: fix the named shape, every path still under your scratch dir, never re-send it unchanged; a refusal that names neither is the permission classifier, which can refuse a compliant command and accept it moments later: run the SAME command once more unchanged; refused again, reach the same bytes by another command into the same destination under your scratch dir (the pinned or base copy, by `cp -r` then `chmod -R u+w`, when the brief names one), else mark that check unverified — never a different destination — and say in MACHINERY which command was refused how many times of how many tries"
  text:
  - "a tool that roots itself at the working directory (`scripts/docs_updater.py`'s `PROJECT_ROOT = Path.cwd()`) runs only from a python program that `os.chdir`s into the seat's copy before it imports or runs the tool, since an absolute argument does not move that root and a `cd` in its own call does not persist;"
  - "say in MACHINERY which command was refused how many times of how many tries"
- id: sc-d8-a-refused-act-is-never-disguised
  # class: ban
  # clauses: L33.1
  file: commands/_fragments/subagents-core.md
  section: "## Subagents — {{HEADLINE}}"
  baseline: "A command reshaped after any refusal, a guard's or the classifier's, never disguises the refused act: fixing the named shape, or changing the command or the tool, is allowed, but a refused name or path assembled, split or encoded (such as `'gi'+'t'`) is the same call, so an act no allowed shape reaches is marked unverified and named in MACHINERY"
