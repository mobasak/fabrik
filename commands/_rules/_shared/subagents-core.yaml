- id: sc-by-file-two-finders-per-slice
  # class: prose
  # clauses: L8.11
  file: commands/_fragments/subagents-core.md
  section: "## Subagents — {{HEADLINE}}"
  baseline: "unless `dispatch_headroom.py` printed a `TRIMMED partition` line (a quota, box or concurrency cap below the slice count): then the union is NOT the full pass: the receipt names the unread slices, and further full-pass waves over those slices alone run before any delta pass, since round 1 is not complete until every slice is read"
  current: "By FILE, `/fabrik-review` and `/fabrik-repo-review` (D-207, on the operator's ruling D-203): two cheap finders per slice — one Sonnet and one Haiku, each over the whole slice, candidates unioned, never voted — and no Opus finder (pilot D-344, 2026-09-22, superseding D-207's Opus-on-the-risky mix; the risky units — concurrency and locks, record and file formats, fleet-synced paths, auth, schema, migrations, secrets — are the slice's named hunt priority, and Opus/Fable execute in the orchestrator; `/fabrik-execute-plan`'s per-round Opus finder floor, once at D7 under `Profile: small`, is its own rule and still stands), at most ONE extra Haiku class seat for a judgement-shaped inventory class the close-out hygiene script cannot express and only when the brief names it, and you — the orchestrator, Opus or Fable whichever the quota allows, and whichever newer model replaces them (D-334, D-456) — orchestrating and EXECUTING every refutation and every confirmed reproduction, never a finder — the union of the slices IS the full pass, every file in exactly one slice and read by that slice's two finders — unless `dispatch_headroom.py` printed a `TRIMMED partition` line (a quota, box or concurrency cap below the slice count): then the union is NOT the full pass: the receipt names the unread slices, and further full-pass waves over those slices alone run before any delta pass, since round 1 is not complete until every slice is read"
  text:
  - "since round 1 is not complete until every slice is read"
