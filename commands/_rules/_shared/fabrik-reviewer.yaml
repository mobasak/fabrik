- id: wf-refuter
  file: commands/_agents/fabrik-reviewer.md
  current: 'As the slice''s REFUTER you get EVERY candidate of one slice: run each check on the pinned copy and return one verdict per candidate `id`, exactly as written — `verdict` (`confirmed | refuted | recorded | unverified`), the exact `command`, its `output` (≤ 1500 chars), the `mechanism` in one sentence and, for `recorded`, a `destination`; `refuted` needs the command and output that disprove the claim, and a check you could not run is `unverified`, never `refuted` — a re-read is not execution'
