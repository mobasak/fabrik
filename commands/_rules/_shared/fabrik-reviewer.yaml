- id: finder-independent
  file: commands/_agents/fabrik-reviewer.md
  baseline: In a partitioned review you are one of TWO over the same slice (a Sonnet and a Haiku seat, pilot D-344); in a units-sized round you are one angle of three (breadth · mechanical · authoritative) over the same units
  text:
