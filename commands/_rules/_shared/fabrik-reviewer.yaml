- id: ledger-new-candidate
  file: commands/_agents/fabrik-reviewer.md
  current: A NEW candidate is a defect of a line inside the previous round's fix hunks, or a live contradiction those hunks created with a sentence of the same section, or the break those hunks created in a reader of what they changed (such as a returned value or type, a key or path form, a field, a signature, a raised exception, an exit code, a printed line, or a heading or term another section cites), shown by that reader passing on the previous round's pin and failing on that pin with only those hunks applied, whatever line holds the defect; a defect one hop out that the hunks did not create (a caller, a callee, a neighbouring section, a pre-existing claim) is named in notes with a destination and never raised (D-230); a claim you refuted in an earlier pass is closed and is not re-raised (D-206)
