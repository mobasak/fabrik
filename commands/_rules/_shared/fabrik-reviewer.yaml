  current: 'The git-verb prohibition (spec D8, the sentence every finder brief carries): NO git command that mutates state in the shared tree — no stash, checkout, reset, restore, apply, commit, clean; read-only git only (`show`, `diff`, `log`, `status`, `ls-files`, and any other query that does not write — a large output redirected into your scratch dir, per the SHA-pin rule above); every probe on a copy (2026-09-11: a reviewer seat''s `git stash --keep-index` swept three sessions'' uncommitted work mid-pass — recovered by the lead, by content from the stash, never a pop)'
  baseline: 'The git-verb prohibition (spec D8, the sentence every finder brief carries): NO git command that mutates state in the shared tree — no stash, checkout, reset, restore, apply, commit, clean; read-only git only (`show`, `diff`, `log`, `status`, `ls-files`, and any other query that does not write — a large output redirected into your scratch dir, per the SHA-pin rule above); every probe on a copy'
  text:
  - 'The git-verb prohibition (spec D8, the sentence every finder brief carries): NO git command that mutates state in the shared tree — no stash, checkout, reset, restore, apply, commit, clean; read-only git only (`show`, `diff`, `log`, `status`, `ls-files`, and any other query that does not write — a large output redirected into your scratch dir, per the SHA-pin rule above); every probe on a copy (2026-09-11: a reviewer seat''s `git stash --keep-index` swept three sessions'' uncommitted work mid-pass — recovered by the lead, by content from the stash, never a pop)'
