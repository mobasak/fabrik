- id: ledger-reverify
  file: commands/_agents/fabrik-reviewer.md
  current: 'If the brief names a SLICE LEDGER, you are the seat that owned this slice in round 1. Re-verify each claim by EXECUTION and report per claim: `DEFECT_PRESENT` (command + output), `DEFECT_ABSENT` (command + output + the exact corrected wording), or `NEW` (a defect the fix introduced, executed) — each label says what is true of the DEFECT, never of the claim'
  baseline: 'If the brief names a SLICE LEDGER, you are the seat that owned this slice in round 1. Re-verify each claim in the ledger by EXECUTION and report per claim: `DEFECT_PRESENT` (command + output), `DEFECT_ABSENT` (command + output + the exact corrected wording), or `NEW` (a defect the fix introduced, executed) — each label says what is true of the DEFECT, never of the claim'
