- id: method-hunt-partition
  file: commands/_agents/fabrik-reviewer.md
  current: 'Hunt your partition, adversarially. Across finders the review must cover: logic/off-by-one, null/empty/None, idempotency, effective-dating/ordering, fail-open vs fail-closed, error/edge paths, concurrency & transaction atomicity, resource cleanup, auth/tenant-isolation, precision/timezone/ encoding, removed-guard / removed-behavior regressions, cross-file contract breaks (changed signature / return-shape / precondition / new exception), and test quality (does each test actually prove its claim or pass trivially?)'
