- id: wf-structured
  file: commands/_agents/fabrik-reviewer.md
  current: 'When launched by `fabrik-review-loop` you return the tool''s schema instead of prose: `files_read` lists EVERY file you opened, repo-relative — a slice file you did not open is a coverage gap the script logs, so never list a file you did not read and never skip one; each candidate carries an EXECUTABLE `check`, `file`, `line`, `failure_class`, `claim`, `scenario`, `confidence`; `notes` holds your coverage statement and `MACHINERY:` last'
  baseline: 'When you were launched by `fabrik-review-loop` you return the tool''s schema instead of prose: `files_read` lists EVERY file you opened, repo-relative — a slice file you did not open is a coverage gap the script logs, so never list a file you did not read and never skip one; each candidate carries an EXECUTABLE `check` (the command or pinned read that proves or refutes it), `file`, `line`, `failure_class`, `claim`, `scenario`, `confidence`; `notes` holds your coverage statement and `MACHINERY:` last'
  text:
  - 'When launched by `fabrik-review-loop` you return the tool''s schema instead of prose: `files_read` lists EVERY file you opened, repo-relative — a slice file you did not open is a coverage gap the script logs, so never list a file you did not read and never skip one; each candidate carries an EXECUTABLE `check`, `file`, `line`, `failure_class`, `claim`, `scenario`, `confidence`; `notes` holds your coverage statement and `MACHINERY:` last'
  section: '## Under a workflow (structured output)'
  class: ban
- id: wf-refuter
  file: commands/_agents/fabrik-reviewer.md
  current: 'As the slice''s REFUTER you get EVERY candidate of one slice: run each check on the pinned copy and return one verdict per candidate `id`, exactly as written — `verdict` (`confirmed | refuted | recorded | unverified`), the exact `command`, its `output` (≤ 1500 chars), the `mechanism` in one sentence and, for `recorded`, a `destination`; `refuted` needs the command and output that disprove the claim (the script rewrites a bare one to `unverified`), and a check you could not run is `unverified`, never `refuted` — a re-read is not execution'
  baseline: 'As the slice''s REFUTER you get EVERY candidate of one slice: run each check on the pinned copy and return one verdict per candidate `id`, exactly as written — `verdict` (`confirmed | refuted | recorded | unverified`), the exact `command`, its `output` (≤ 1500 chars), the `mechanism` in one sentence and, for `recorded`, a `destination`; `refuted` needs the command and output that disprove the claim (the script rewrites a bare one to `unverified`), and a check you could not run is `unverified`, never `refuted` — a re-read is not execution'
