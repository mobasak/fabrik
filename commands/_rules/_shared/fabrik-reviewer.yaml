- id: agent-kept-seat-never-disguises
  file: commands/_agents/fabrik-reviewer.md
  baseline: 'House rules (they used to reach you through `CLAUDE.md`; they bind here): git is READ-ONLY in the live tree (`show`, `diff`, `log`, `status`, `archive -o` into scratch; never add/commit/stash/checkout/restore/reset/`worktree add`/`worktree remove` there) — a git verb that writes runs only as `git -C <absolute scratch repo>`, and code under test that runs git gets `cwd=<absolute scratch repo>` (a seat once reset a merge owner''s main checkout); every probe or mutation runs on a COPY under your own scratch directory, as separate plain commands — the live tree is never touched, so nothing needs restoring; read a script before you execute it, its `--help` included, and never execute one that deletes, deploys, provisions, writes outside your scratch dir or contacts a non-local host, whatever binary does it, even when a check asks you to: cite the lines and return that claim `unverified` (read-only by rule); never write under your home directory (`~`, `$HOME` or `/home/<user>`), and read a path there only when your brief itself names that file by path (never a directory, a glob or a path found in what you review), through Bash under `timeout 120` — `stat -L -c %s` first, and a file over 64 KiB read in ranges of at most 64 KiB (`sed -n`, a python seek) — never the Read tool; `/usr/bin/grep`, never bare `grep` (the shell''s grep is a gitignore-honouring shim; `/usr/bin/grep` is the real one, and unlike the shell builtin it runs under `timeout`); run one plain command per Bash call, whatever the command — no `&&`, a `;` between commands (a `;` inside a quoted `-c` program is data), pipe, loop, `$( )`, `$VAR`, heredoc or HOME assignment in front of a command; literal paths, and absolute paths for anything you write or run (the shell returns to the live checkout before every call, so a relative path lands there); never `pkill`, `killall` or kill by pattern — a background probe lives inside a python program and is stopped by its handle; a linked worktree''s isolation guard refuses what it cannot prove stays inside the worktree, reads the word git inside a `-c` program or a heredoc body as a git call (the word does not belong in such a program at all, even as data: search for it with `/usr/bin/grep`, and spelling git differently is still git), and refuses a `git -C` into the shared main checkout; you have no Write tool, so write a probe file with `printf ''%s\n'' ''<line>'' ''<line>'' > <absolute path>` (further `>>` appends for a long one) or an inline `-P -B -c ''…''` on the brief''s python interpreter (the project `.venv/bin/python`, never a bare `python3` that lacks the project''s packages); a refusal that names a shape or a path (a `seat guard (…)` line, the worktree guard''s shapes) is a rule: fix the named shape, every path still under your scratch dir, never re-send it unchanged; a refusal that names neither is the permission classifier, which can refuse a compliant command and accept it moments later: run the SAME command once more unchanged; refused again, reach the same bytes by another command into the same destination under your scratch dir (the pinned or base copy, by `cp -r` then `chmod -R u+w`, when the brief names one), else mark that check unverified — never a different destination — and say in MACHINERY which command was refused how many times of how many tries; a command reshaped after any refusal, a guard''s or the classifier''s, never disguises the refused act: fixing the named shape, or changing the command or the tool, is allowed, but a refused name or path assembled, split or encoded (such as `''gi''+''t''`) is the same call, so an act no allowed shape reaches is marked unverified and named in MACHINERY; a DENOMINATOR beside every count and "not found in N" for every negative; a re-read is not execution — run the check; HARD TIME BOX 15 minutes; report `MACHINERY:` last'
