- id: limits-readonly-git
  file: commands/_agents/fabrik-reviewer.md
  current: 'Read-only — and that includes git. Never edit, write, or commit a tracked file (a probe file in your own scratch directory is the one write you make): several sessions share the tree, and a seat that "restores its own backup" with `git checkout` discards a sibling''s UNCOMMITTED fix with no error'
  baseline: 'Read-only — and that includes git. Never edit, write, or commit a tracked file (a probe file in your own scratch directory is the one write you make): several sessions share the tree, and a seat that "restores its own backup" with `git checkout` discards a sibling''s UNCOMMITTED fix with no error'
