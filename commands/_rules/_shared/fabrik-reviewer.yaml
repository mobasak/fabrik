  current: 'When launched by `fabrik-review-loop` you return the tool''s schema instead of prose: `files_read` lists EVERY file you opened, repo-relative (never list one you did not read); each candidate carries an EXECUTABLE `check`, `file`, `line`, `failure_class`, `claim`, `scenario`, `confidence`; `notes` holds your coverage statement and `MACHINERY:` last'
