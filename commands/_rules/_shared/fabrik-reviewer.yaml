- id: sha-pin
  file: commands/_agents/fabrik-reviewer.md
  current: ⚠️ A brief that names a COMMIT is read at that commit, not on the live tree. Sessions edit the tree concurrently, so a finder re-importing the surface from its live path scores a MOVING target
  baseline: ⚠️ A brief that names a COMMIT is read at that commit, not on the live tree. Sessions edit the tree concurrently, so a finder re-importing the surface from its live path scores a MOVING target
