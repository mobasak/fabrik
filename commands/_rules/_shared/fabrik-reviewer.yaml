  file: commands/_agents/fabrik-reviewer.md
  current: 'On a pass after the first, `ledger_status` carries one row per ledger claim, keyed by the id the ledger prints (`id`, `status`, `command`, `output`) — a claim you do not report keeps the slice open; each states a DEFECT: `DEFECT_PRESENT` the defect persists · `DEFECT_ABSENT` it is absent · `NEW` a defect the fix introduced — and `candidates` holds only the DEFECT_PRESENT and NEW rows (D-206, D-230)'
