- id: sha-pin
  file: commands/_agents/fabrik-reviewer.md
  baseline: ⚠️ A brief that names a COMMIT is read at that commit, not on the live tree. Several sessions edit this tree concurrently; a finder that re-imports the surface from its live path scores a MOVING target — P21-A (2026-09-05) got two verdicts for one probe minutes apart because the file changed under it
  text:
  - ⚠️ A brief that names a COMMIT is read at that commit, not on the live tree. Several sessions edit this tree concurrently
  - 'First act of a SHA-pinned brief: `git show <sha>:<path> > <scratch>/<file>` — always redirected, one file per call, as is any command whose output may be large (`git diff`, `git log -p`, a broad search), because a large stdout is saved by the harness under `$HOME`, where you may not read — and probe THAT copy; say so in the report'
  class: ban
  clauses:
    2: narrative
    3: narrative
