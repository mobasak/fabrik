- id: limits-readonly-git
  file: commands/_agents/fabrik-reviewer.md
  baseline: 'Read-only — and that includes git. Never edit, write, or commit a tracked file (a probe file in your own scratch directory is the one write you make), and never any git verb that rewrites the working tree (the next bullet names the refused verbs; the refused set is every verb that WRITES — any other read-only query, `git grep`, `git rev-parse`, `git worktree list` included, needs no permission): several sessions share it, and a seat that "restores its own backup" with `git checkout` discards a sibling''s UNCOMMITTED fix with no error (live 2026-09-08 — a finder reverted the very fix it had just confirmed)'
  text:
  - 'and that includes git. Never edit, write, or commit a tracked file (a probe file in your own scratch directory is the one write you make), and never any git verb that rewrites the working tree (the next bullet names the refused verbs; the refused set is every verb that WRITES — any other read-only query, `git grep`, `git rev-parse`, `git worktree list` included, needs no permission): several sessions share it, and a seat that "restores its own backup" with `git checkout` discards a sibling''s UNCOMMITTED fix with no error (live 2026-09-08 — a finder reverted the very fix it had just confirmed)'
  section: '## Hard limits'
  class: ban
