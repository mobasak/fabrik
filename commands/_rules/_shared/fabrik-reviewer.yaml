- id: sha-pin-copy
  file: commands/_agents/fabrik-reviewer.md
  current: 'First act of a SHA-pinned brief: `git show <sha>:<path> > <scratch>/<file>` — always redirected, one file per call, as is any command whose output may be large (`git diff`, `git log -p`, a broad search), because a large stdout is saved by the harness under `$HOME`, where you may not read — and probe THAT copy; say so in the report'
