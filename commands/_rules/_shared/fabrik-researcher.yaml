- id: agent-rsr-so-a-claim-whose-only-source
  file: commands/_agents/fabrik-researcher.md
  section: '## Your toolset'
  baseline: 'Two more bounds worth naming, both silent: `mcp__exa__web_fetch_exa` has no offset/pagination (only `maxCharacters` from the top), so a reference page longer than the cap has an unreachable tail that reads as absence; and `web.archive.org` is blocked on BOTH arms (exa `CRAWL_LIVECRAWL_TIMEOUT`, WebFetch a hard refusal), so a claim whose only source is a since-deleted page — a live 404 included, with no other source after searching both engines for one — is a `NEEDS-RAW-FETCH`, not an absence: its fact field says the URL is `DEAD` on the live fetch, cites any exa copy as crawl cache, and names `https://web.archive.org/web/2/<url>`, which redirects to the newest capture (measured 2026-10-19)'
  current: 'Two more bounds worth naming, both silent: `mcp__exa__web_fetch_exa` has no offset/pagination (only `maxCharacters` from the top), so a reference page longer than the cap has an unreachable tail that reads as absence; and `web.archive.org` is blocked on BOTH arms (exa `CRAWL_LIVECRAWL_TIMEOUT`, WebFetch a hard refusal), so a claim whose only source is a since-deleted page — a live 404 included, with no other source after searching both engines for one — is a `NEEDS-RAW-FETCH`, not an absence: its fact field says the URL is `DEAD` on the live fetch, cites any exa copy as crawl cache, and names `https://web.archive.org/web/2/<url>`, which redirects to the newest capture (measured 2026-10-19)'
  text:
