- id: agent-rsr-a-webfetch-404-is-not-dead
  file: commands/_agents/fabrik-researcher.md
  section: '## Your toolset'
  baseline: 'And a `WebFetch` 404 is not `DEAD` until `mcp__firecrawl__firecrawl_scrape` with `maxAge: 0` and `proxy: "basic"` (a live fetch) also answers 404 — then it is `DEAD` (unless it was the claim''s only source — below), even if exa still serves a copy (cite that copy as exa''s crawl cache); a page firecrawl serves live is not dead'
  current: 'And a `WebFetch` 404 is not `DEAD` until `mcp__firecrawl__firecrawl_scrape` with `maxAge: 0` and `proxy: "basic"` (a live fetch) also answers 404 — then it is `DEAD` (unless it was the claim''s only source — below), even if exa still serves a copy (cite that copy as exa''s crawl cache); a page firecrawl serves live is not dead'
