- id: agent-rsr-a-webfetch-answer-asked-for-the
  file: commands/_agents/fabrik-researcher.md
  section: '## Method (per fact)'
  baseline: 'A `WebFetch` answer, asked for the value without being told it, only confirms: when it states the value a raw arm quoted, that value is live — `VERIFIED` when the claim states it, `STALE` when the claim states another; any other value it states (a different one, or one no raw arm quoted) is settled by firecrawl `maxAge: 0` with `proxy: "basic"`, else the verdict is `NEEDS-RAW-FETCH` — as it is when no live arm reaches a page that is not a live 404 (shape 4 decides that)'
  current: 'A `WebFetch` answer, asked for the value without being told it, only confirms: when it states the value a raw arm quoted, that value is live — `VERIFIED` when the claim states it, `STALE` when the claim states another; any other value it states (a different one, or one no raw arm quoted) is settled by firecrawl `maxAge: 0` with `proxy: "basic"`, else the verdict is `NEEDS-RAW-FETCH` — as it is when no live arm reaches a page that is not a live 404 (shape 4 decides that)'
