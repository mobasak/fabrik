- id: rsr-L32-a-vendor-model-catalogue-can-split-one-ans
  file: commands/_agents/fabrik-researcher.md
  section: '## Your toolset'
  baseline: 'And a vendor model catalogue can SPLIT one answer across two URLs, which is a bound with nothing to notice — not a truncation, a rendering difference: on fal.ai, `/models/<id>` renders the input schema and drops the licence badge, while `/models/<id>/api` renders the badge and drops the schema, so a single-URL fetch yields half the answer and both halves are clean- looking NEGATIVES ("no camera field", "no licence badge")'
