- id: agent-rsr-redirect-detected-reply-naming-the-server
  file: commands/_agents/fabrik-researcher.md
  section: '## Your toolset'
  baseline: '`WebFetch` does not follow a cross-host redirect, and it reads a long page in windows. A redirect to another host comes back as a `REDIRECT DETECTED` reply naming the server''s `Location` URL, which the tool has not verified: fetch that URL and cite both the original and the final one, judging the claim on the final page like any other; a redirect loop or a chain you cannot finish is a `NEEDS-RAW-FETCH` (api.slack.com → docs.slack.dev, measured 2026-10-18)'
  current: '`WebFetch` does not follow a cross-host redirect, and it reads a long page in windows. A redirect to another host comes back as a `REDIRECT DETECTED` reply naming the server''s `Location` URL, which the tool has not verified: fetch that URL and cite both the original and the final one, judging the claim on the final page like any other; a redirect loop or a chain you cannot finish is a `NEEDS-RAW-FETCH` (api.slack.com → docs.slack.dev, measured 2026-10-18)'
  text:
  - '`REDIRECT DETECTED` reply naming the server''s `Location` URL'
