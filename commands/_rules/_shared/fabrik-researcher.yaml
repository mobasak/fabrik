- id: agent-rsr-an-excerpt-from-the-wrong-place
  file: commands/_agents/fabrik-researcher.md
  section: '## Your toolset'
  baseline: 'An excerpt from the wrong place proves nothing either way: narrow the locator and ask again — once: a second wrong-place excerpt, or an empty or not-found reply, counts as a miss; if firecrawl still misses, refuses or errors, fall back to exa, which reads only the first 25000 characters (no offset, shape 4), so a span past them is a `NEEDS-RAW-FETCH` — never `WRONG` on one excerpt'
