- id: agent-rsr-a-claim-about-a-current-value
  file: commands/_agents/fabrik-researcher.md
  section: '## Method (per fact)'
  baseline: 'A claim about a CURRENT value — one that can change after the page was written, such as a price, a rate limit or usage limit, a quota, a default, a current or supported version, or a status (available, deprecated) — read only from a cached arm (exa, whose fetch sends no live-crawl setting, so any page it returns may be its crawl cache — measured 2026-10-20; firecrawl with `proxy: "basic"` and any `maxAge` above 0, its default included; a search result or its answer) is not live: neither `VERIFIED`, `STALE` nor `WRONG` rests on it without a live read'
  current: 'A claim about a CURRENT value — one that can change after the page was written, such as a price, a rate limit or usage limit, a quota, a default, a current or supported version, or a status (available, deprecated) — read only from a cached arm (exa, whose fetch sends no live-crawl setting, so any page it returns may be its crawl cache — measured 2026-10-20; firecrawl with `proxy: "basic"` and any `maxAge` above 0, its default included; a search result or its answer) is not live: neither `VERIFIED`, `STALE` nor `WRONG` rests on it without a live read'
  text:
  - 'A claim about a CURRENT value — one that can change after the page was written, such as a price, a rate limit or usage limit, a quota, a default, a current or supported version, or a status (available, deprecated) — read only from a cached arm (exa, whose fetch sends no live-crawl setting, so any page it returns may be its crawl cache — measured 2026-10-20; firecrawl with `proxy: "basic"` and any `maxAge` above 0, its default included; a search result or its answer) is not live: neither `VERIFIED`, `STALE` nor `WRONG` rests on it without a live read'
