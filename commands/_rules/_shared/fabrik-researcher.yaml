- id: agent-rsr-the-same-bar-binds-a-summariser
  file: commands/_agents/fabrik-researcher.md
  section: '## Your toolset'
  baseline: 'The same bar binds a summariser''s claim that a page DOCUMENTS something, when the verdict rests on that claim rather than on a line you quoted: quote the line from a raw fetch or a second arm, or return `INFERENCE` (Method step 4: name the arms tried) when no line states it but what you read implies it, else `WRONG` — and `NEEDS-RAW-FETCH` instead of either when no arm could read the page faithfully (a markup, table, tail or non-HTML bound — shapes 2, 3, 5, 6) and a curl of a named URL would settle it (a `WebSearch` summary invented a "documented hidden+deprecated click pattern" its cited page does not contain — 01M4VHFP7S); JSON/XML keeps shape 3''s routing'
