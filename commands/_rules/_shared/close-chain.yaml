  - In a command that runs a review loop, a mutant or test count reaches the D-row or `CHANGELOG.md` only after the closing pass, printed then by its producing command; a draft written mid-loop carries none.
- id: cc-write-every-input-to-a-file
  file: commands/_fragments/close-chain.md
  baseline: 'Write every input to a file BEFORE the chain, each in its own call: the commit message with its Agent Provenance Trailers, each shared-ledger hunk, the `--evidence` and `--feedback` text'
  current: 'Write every input to a file BEFORE the chain, each in its own call: the commit message with its Agent Provenance Trailers, each shared-ledger hunk, the `--evidence` and `--feedback` text'
  text:
  - Write every input to a file
  ordered:
  - cc-write-every-input-to-a-file
  - cc-is-printed-by-its-producing-command
  - cc-then-1
- id: cc-is-printed-by-its-producing-command
  file: commands/_fragments/close-chain.md
  baseline: 'A measured figure an input states (a test total, a constant''s size, a row count) is printed by its producing command, over the population the input names, when the input is written and copied from that output, never recalled (CLAUDE.md § HARD STOPS: "prefer the PRODUCING tool''s own total")'
