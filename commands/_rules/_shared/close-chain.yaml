- id: cc2-four-calls
  file: commands/_fragments/close-chain.md
  baseline: The close is four calls, its inputs written first (D-363) — the default shape, and this command's own close text wins wherever it names something else (a different order, a `blocked` or `handoff` exit, an operator gate, a pause before execution, a nested run whose caller closes, a ledger row committed separately)
  current: The close is four calls, its inputs written first — the default shape, and this command's own close text wins wherever it names something else (a different order, a `blocked` or `handoff` exit, an operator gate, a pause before execution, a nested run whose caller closes, a ledger row committed separately)
  text:
  - The close is four calls, its inputs written first
  - this command's own close text wins wherever it names something else
  - a pause before execution, a nested run whose caller closes, a ledger row committed separately
- id: cc2-before-seven-line
  file: commands/_fragments/close-chain.md
  baseline: It runs BEFORE the response's closing seven-line block (CLAUDE.md § FINAL OUTPUT), whose `FEEDBACK:` line the chain's last call prints — and so before any output section of the command's own that reports the run
  current: It runs BEFORE the response's closing seven-line block (CLAUDE.md § FINAL OUTPUT), whose `FEEDBACK:` line the chain's last call prints — and so before any output section of the command's own that reports the run
  text:
