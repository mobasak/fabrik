- id: te-closing-round-zero-defects-present-same-seat-per-slice
  file: commands/_fragments/term-edit.md
  section: '## ⚠️ Termination contract — READ FIRST (the rule agents skip)'
  baseline: 'THE CLOSING ROUND, wherever this contract names it: the pass in which the round-1 seats re-executed every claim of their OWN slice ledgers and confirmed zero code or doc defects present — the same seat per slice, never a fresh whole-artifact reader, because that reader is how the loop degenerates from round two on — *one seat re-reads the whole artifact, the brief becomes "find anything", fixes are written from recall so they seed the next round* (D-335, D-911; `docs/reference/command-loop-performance.md` § 4.7, The root cause) — or, for a solo self-convergence loop (the one sanctioned exception of `62-using-subagents.md` § Role separation — its definition and its example, `/fabrik-ui-design`, live THERE and are never restated here), a second full fresh read of its own by the re-derivation method, its independence deferred to the paired review command that follows it'
  current: 'THE CLOSING ROUND, wherever this contract names it: the pass in which the round-1 seats re-executed every claim of their OWN slice ledgers and confirmed zero code or doc defects present — the same seat per slice, never a fresh whole-artifact reader, because that reader is how the loop degenerates from round two on — *one seat re-reads the whole artifact, the brief becomes "find anything", fixes are written from recall so they seed the next round* (D-335, D-911; `docs/reference/command-loop-performance.md` § 4.7, The root cause) — or, for a solo self-convergence loop (the one sanctioned exception of `62-using-subagents.md` § Role separation — its definition and its example, `/fabrik-ui-design`, live THERE and are never restated here), a second full fresh read of its own by the re-derivation method, its independence deferred to the paired review command that follows it'
  text:
  - the pass in which the round-1 seats re-executed every claim of their OWN slice ledgers and confirmed zero code or doc defects present — the same seat per slice
