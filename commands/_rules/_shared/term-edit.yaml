- id: te-flip-copy-is-a-git-checkout-with-scripts-linked
  file: commands/_fragments/term-edit.md
  section: '## ⚠️ Termination contract — READ FIRST (the rule agents skip)'
  baseline: 'Then, where the {{ARTIFACT}} has flip gates in the flip-gate invocation matrix (the `MATRIX` table in `tests/enforcement/test_flip_gate_matrix.py`, documented in `docs/workflows/FINAL_GATE_WORKFLOW.md` — a spec: the `check_spec_convergence` row; a plan SET: the other four; a MONOLITH plan: `check_rule_grounding`, `check_convergence` and `check_plan_quality`, since `check_plan_tickets` refuses a file), run them at pass 1 AND again at the close in the tree each row names (a flipped SCRATCH copy where the row flips one, because a Status-reading gate skips a DRAFT; `check_plan_quality` through its import with both `PLAN_DIR` bindings patched to the flipped copy''s directory — the MATRIX row''s own method; nothing is ever written into the real plans dir, and an unpatched `PLAN_DIR` grades nothing outside it); the working-tree {{ARTIFACT}} is never flipped for a gate; an artifact with no matrix row has its artifact gates named, and their moment, by its own command, not by this contract — never the receipt, hygiene or flywheel checks the shared fragments carry into every command — and a command that names none has its ledger SAY so rather than record a gate that did not run — a gate run COUNTS only when you can show the {{ARTIFACT}} was in the gate''s examined set (a committed-clean scratch copy and `check_plan_quality` outside its cwd-bound `PLAN_DIR` return green over NOTHING, a scratch-root anchor check grades nothing and says so, and a non-dated set directory is REFUSED aloud) — so a flipped scratch copy is a git checkout in which the flip shows as a change, the DRAFT committed and the flip in the working tree or staged (`check_convergence` grades only the plans `git status` lists there), with the repo''s `scripts/` and `.windsurf/` linked in, the MATRIX row''s method (without them `check_rule_grounding` reports the plan UNGRADED and every digest quote QUOTE-NOT-FOUND)'
  current: 'Then, where the {{ARTIFACT}} has flip gates in the flip-gate invocation matrix (the `MATRIX` table in `tests/enforcement/test_flip_gate_matrix.py`, documented in `docs/workflows/FINAL_GATE_WORKFLOW.md` — a spec: the `check_spec_convergence` row; a plan SET: the other four; a MONOLITH plan: `check_rule_grounding`, `check_convergence` and `check_plan_quality`, since `check_plan_tickets` refuses a file), run them at pass 1 AND again at the close in the tree each row names (a flipped SCRATCH copy where the row flips one, because a Status-reading gate skips a DRAFT; `check_plan_quality` through its import with both `PLAN_DIR` bindings patched to the flipped copy''s directory — the MATRIX row''s own method; nothing is ever written into the real plans dir, and an unpatched `PLAN_DIR` grades nothing outside it); the working-tree {{ARTIFACT}} is never flipped for a gate; an artifact with no matrix row has its artifact gates named, and their moment, by its own command, not by this contract — never the receipt, hygiene or flywheel checks the shared fragments carry into every command — and a command that names none has its ledger SAY so rather than record a gate that did not run — a gate run COUNTS only when you can show the {{ARTIFACT}} was in the gate''s examined set (a committed-clean scratch copy and `check_plan_quality` outside its cwd-bound `PLAN_DIR` return green over NOTHING, a scratch-root anchor check grades nothing and says so, and a non-dated set directory is REFUSED aloud) — so a flipped scratch copy is a git checkout in which the flip shows as a change, the DRAFT committed and the flip in the working tree or staged (`check_convergence` grades only the plans `git status` lists there), with the repo''s `scripts/` and `.windsurf/` linked in, the MATRIX row''s method (without them `check_rule_grounding` reports the plan UNGRADED and every digest quote QUOTE-NOT-FOUND)'
  text:
  - so a flipped scratch copy is a git checkout in which the flip shows as a change, the DRAFT committed and the flip in the working tree or staged (`check_convergence` grades only the plans `git status` lists there), with the repo's `scripts/` and `.windsurf/` linked in, the MATRIX row's method (without them `check_rule_grounding` reports the plan UNGRADED and every digest quote QUOTE-NOT-FOUND).
