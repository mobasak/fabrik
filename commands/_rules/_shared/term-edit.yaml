- id: te-trimmed-partition-unread-slices-swept-before-delta
  file: commands/_fragments/term-edit.md
  section: '## ⚠️ Termination contract — READ FIRST (the rule agents skip)'
  baseline: 'The pass SHAPE: round 1 is the ONLY full pass of a seat-carrying loop, and a solo loop''s closing read is its second — round 1 reads the WHOLE {{ARTIFACT}}, cut into DISJOINT slices: by SECTION for the spec and plan reviews (Opus on the rule/grammar sections, Sonnet on the rest — one seat each for a small artifact, more slices when `dispatch_headroom.py --slices opus=N,sonnet=N` sizes them; `fabrik-researcher` seats only for the external facts the artifact cites, counted inside `opus=`/`sonnet=` by their model token; no Haiku seat — D-207, D-212, D-218); every other consumer by its own INDEPENDENT units (independence of the surface — no unit''s ground truth is another''s, D-208), in the mix the `⚠️ Floor` line of its `## Subagents` section states where it has one (a Sonnet seat per unit, a Haiku mechanical seat per grep-able class, the Opus authoritative seat) and the D-208 three-seat floor otherwise — a minimum, never the count; under a partition the three-seat floor stands down, satisfied by construction (D-208, D-218); no slice''s text read by two seats, and the union IS the pass — unless `dispatch_headroom.py` printed a `TRIMMED partition` line: then the union is NOT the full pass, the ledger names the unread slices and further full-pass waves over those slices alone run before any delta pass; every later pass is the round-1 seats re-verifying their OWN slices — the fix hunks in the slice plus one hop (the sections whose cross-reference tokens (`I#`, `D#`, `G#`, `T##`, a `§` heading, a `path:line`) cite the edited section, plus any sibling commit on the {{ARTIFACT}} since the last pass) — never a fresh whole-artifact reader (a pass that edited nothing — a quiet round 1, or a pass whose confirmed defect was routed to a backlog row — leaves an EMPTY fix diff: the next pass is the owning seats re-deriving the load-bearing claims their ledgers name — counts, enumerations, anchors and executable rules — a bounded re-derivation, never a second full read except the solo loop''s own) — SIZED BY THE SLICES (D5, D-335 superseding D-229): every later pass dispatches one seat per slice whose ledger holds an open claim — a failing claim, a claim the fix introduced, or any claim not yet RE-EXECUTED in a later pass (the two-pass minimum overrides this test, so a quiet round 1''s claims are all open to its closing pass) — on the seat that owned that slice in round 1 (the same model, or Sonnet/Haiku where the slice is not risky); a slice with no open claim is not re-dispatched yet is still restated at its last `<verified>/<claims>` in that pass''s `round --slices` (D-335), and a refuted or recorded candidate opens nothing; `dispatch_headroom.py --slices` (or `--units`) sizes round 1 and the union of the round-1 seats is the ceiling of every later pass (the floor of D-208 binds round 1 only)'
  current: 'The pass SHAPE: round 1 is the ONLY full pass of a seat-carrying loop, and a solo loop''s closing read is its second — round 1 reads the WHOLE {{ARTIFACT}}, cut into DISJOINT slices: by SECTION for the spec and plan reviews (Opus on the rule/grammar sections, Sonnet on the rest — one seat each for a small artifact, more slices when `dispatch_headroom.py --slices opus=N,sonnet=N` sizes them; `fabrik-researcher` seats only for the external facts the artifact cites, counted inside `opus=`/`sonnet=` by their model token; no Haiku seat — D-207, D-212, D-218); every other consumer by its own INDEPENDENT units (independence of the surface — no unit''s ground truth is another''s, D-208), in the mix the `⚠️ Floor` line of its `## Subagents` section states where it has one (a Sonnet seat per unit, a Haiku mechanical seat per grep-able class, the Opus authoritative seat) and the D-208 three-seat floor otherwise — a minimum, never the count; under a partition the three-seat floor stands down, satisfied by construction (D-208, D-218); no slice''s text read by two seats, and the union IS the pass — unless `dispatch_headroom.py` printed a `TRIMMED partition` line: then the union is NOT the full pass, the ledger names the unread slices and further full-pass waves over those slices alone run before any delta pass; every later pass is the round-1 seats re-verifying their OWN slices — the fix hunks in the slice plus one hop (the sections whose cross-reference tokens (`I#`, `D#`, `G#`, `T##`, a `§` heading, a `path:line`) cite the edited section, plus any sibling commit on the {{ARTIFACT}} since the last pass) — never a fresh whole-artifact reader (a pass that edited nothing — a quiet round 1, or a pass whose confirmed defect was routed to a backlog row — leaves an EMPTY fix diff: the next pass is the owning seats re-deriving the load-bearing claims their ledgers name — counts, enumerations, anchors and executable rules — a bounded re-derivation, never a second full read except the solo loop''s own) — SIZED BY THE SLICES (D5, D-335 superseding D-229): every later pass dispatches one seat per slice whose ledger holds an open claim — a failing claim, a claim the fix introduced, or any claim not yet RE-EXECUTED in a later pass (the two-pass minimum overrides this test, so a quiet round 1''s claims are all open to its closing pass) — on the seat that owned that slice in round 1 (the same model, or Sonnet/Haiku where the slice is not risky); a slice with no open claim is not re-dispatched yet is still restated at its last `<verified>/<claims>` in that pass''s `round --slices` (D-335), and a refuted or recorded candidate opens nothing; `dispatch_headroom.py --slices` (or `--units`) sizes round 1 and the union of the round-1 seats is the ceiling of every later pass (the floor of D-208 binds round 1 only)'
