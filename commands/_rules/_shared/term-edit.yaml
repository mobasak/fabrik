- id: te-presweep-lists-the-literal-term-only
  file: commands/_fragments/term-edit.md
  section: '## ⚠️ Termination contract — READ FIRST (the rule agents skip)'
  baseline: '⚠️ COBRA (D-253): the cheap way to satisfy this without doing it is to write corrections carrying no checkable claims at all, so the obligation is discharged EQUALLY by DELETING an unverifiable claim — the cheap path and the compliant path are the same one, and `denominator-honesty` already forbids a count without its population, so vagueness buys nothing either; (2) THE PRE-PIN SWEEP IS A COMMAND — `python3 scripts/enforcement/check_review_hygiene.py --surface <pin> --claim <term>` lists every line of the pinned surface where a rewritten claim''s literal term occurs (case- and wrap-tolerant; a directory surface walks only its `.md` and `.py` files); a mirror outside the pin or in other words is not in that list, so also grep the repo for the term and two rewordings of the claim, and read each site before the pin and APPEND `· mirrors: <n> read` to that row''s `method:` cell after its re-derivation text (never as the cell''s only content — a cell reading only the probe fails the coverage gate''s re-derivation row rule); (3) TWO CONSECUTIVE RESIDUE PASSES FORCE A REWRITE — when two consecutive delta rounds confirm only defects inside the previous round''s hunks, or one SITE — the smallest enclosing unit: a sentence, bullet item or table row — yields an own-fix defect in two consecutive delta rounds, whatever else those rounds found (each such finding row cites `site: <a quotable anchor>`), the next edit rewrites the affected paragraph from the probe''s output in ONE batch instead of a third patch, first asking whether the yielding site, or a clause in it, can be deleted outright (a deletion is that rewrite), since a deletion ends the residue and a re-cut restarts it, and the row''s method cell APPENDS `; class rewrite — <site or paragraph> (rounds k, k+1)`; — and when that residue is a COUNT, enumeration or anchor, the rewrite, when the sentence is not deleted, does not re-cut the value: it moves into a DURABLE row inside the {{ARTIFACT}} that carries the command producing it (the `## Derivations` shape of D-311), with that command''s pasted output in a fenced block whose first line begins `$ ` placed BESIDE the table and cited by the row''s cell — a fence cannot live inside a pipe-table cell without swallowing the next row — and the row cites the paragraph as the paragraph cites the row, so Probe duty re-runs it whenever the paragraph is edited; the row is never a scratch path, which `clean-own-scratch` sweeps at task end and would leave the {{ARTIFACT}} with no number at all; a third residue pass without a rewrite is the non-convergence breaker''s foundation error, named in the `## BLOCKED` question, while the rewrite counts as one more reconcile attempt on each claim it answers, so a claim that survives it is paused under the per-axis BLOCKED escalation once its axis reaches three consecutive reconcile attempts, and looping continues'
