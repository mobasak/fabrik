- id: te-pin-never-touched-while-seats-run
  file: commands/_fragments/term-edit.md
  section: '## ⚠️ Termination contract — READ FIRST (the rule agents skip)'
  baseline: (2) PIN the {{ARTIFACT}} once PER ROUND — `cp` it to scratch, put its md5 in every brief (that hash is the round's `md5(start)`), and never touch the pin while its seats run (the seats read the pin; you edit the working tree once every seat has returned and you have read the pass)
