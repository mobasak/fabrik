- id: te-artifact-own-rule-run-as-a-script
  file: commands/_fragments/term-edit.md
  section: '## ⚠️ Termination contract — READ FIRST (the rule agents skip)'
  baseline: '(4) THE ARTIFACT''S OWN RULE: when the {{ARTIFACT}} states an executable rule — a verdict algebra, a state machine, a truth table, a comparator — run it as a throwaway script over EVERY case the artifact itself lists (a rule with none has its cases enumerated first), at pass 1 and again before any pin after a fix touched the rule or a case, and record the run beside the pin; a re-read is not execution, and round zero''s input-space probe below covers the FIX''s inputs, never the artifact''s rule — an artifact with no such rule owes nothing here'
  current: '(4) THE ARTIFACT''S OWN RULE: when the {{ARTIFACT}} states an executable rule — a verdict algebra, a state machine, a truth table, a comparator — run it as a throwaway script over EVERY case the artifact itself lists (a rule with none has its cases enumerated first), at pass 1 and again before any pin after a fix touched the rule or a case, and record the run beside the pin; a re-read is not execution, and round zero''s input-space probe below covers the FIX''s inputs, never the artifact''s rule — an artifact with no such rule owes nothing here'
  text:
  - (4) **THE ARTIFACT'S OWN RULE:**
  - run it as a throwaway script over EVERY case the artifact itself lists
  - a rule with none has its cases enumerated first
  - at pass 1 and again before any pin after a fix touched the rule or a case
  - a re-read is not execution
  - never the artifact's rule
  - an artifact with no such rule owes nothing here
