  text:
  - the orchestrator's own fix residue is caught by the hygiene script, never by a seat;
  - a scripted fix states how many times each old string occurs (once by default) and writes nothing unless every one matches that count and differs from its new text, so it never writes a no-op or a half edit;
  - re-read WHOLE on the working tree every edited paragraph and every passage elsewhere in the {{ARTIFACT}}, its own section included, that cites, depends on or restates what the edits changed (a renumbered list's cross-references; the section that owns a promised behaviour, which must state it)
  - Before Pass 1 and before every pin
  - four mechanical obligations, in order
