  current: When the {{ARTIFACT}} carries an EXECUTABLE rule — a verdict algebra, a state machine, a truth table, a comparator — the closing round re-executes it over every case the artifact lists, whether or not a fix touched it, and records the run (obligation (4) below ran it at pass 1 and after each fix that touched it); text-only re-derivation is blind to a rule that is internally consistent and wrong
  text:
  - carries an EXECUTABLE rule
  - the closing round re-executes it over every case the artifact lists
  - obligation (4) below
  - internally consistent and wrong
