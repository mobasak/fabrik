- id: cf-15
  file: commands/_fragments/close-feedback.md
  section: '## ⚠️ Close-out feedback — PROACTIVE, and owed before you close the run record'
  baseline: 'Two traps, both executed against the real parser. (1) Keep ` · `, `|`, `;` and newlines out of the value. Precisely: the close splits on one of those four ONLY when a field label (`confusion|waste|change|filed|cost`) and a colon follow it — a bare semicolon or pipe in your prose is harmless — but when it does split, a ` · waste:` lands a duplicate field and REFUSES the close, and a ` · cost:` truncates your sentence SILENTLY and files a phantom cost'
  current: 'Two traps, both executed against real parser: (1) keep ` · `, `|`, `;` and newlines out of value; close splits on one of those four ONLY when a field label (`confusion|waste|change|filed|cost`) and a colon follow it — bare semicolon or pipe in your prose is harmless — but when it does split, ` · waste:` lands duplicate field and REFUSES the close, and a ` · cost:` truncates your sentence SILENTLY and files a phantom cost'
  text:
  - 'Two traps, both executed against real parser: (1) keep ` · `, `|`, `;` and newlines out of value; close splits on one of those four ONLY when a field label (`confusion|waste|change|filed|cost`) and a colon follow it — bare semicolon or pipe in your prose is harmless — but when it does split, ` · waste:` lands duplicate field and REFUSES the close, and a ` · cost:` truncates your sentence SILENTLY and files a phantom cost'
  class: ban
- id: cf-16
  file: commands/_fragments/close-feedback.md
  section: '## ⚠️ Close-out feedback — PROACTIVE, and owed before you close the run record'
  baseline: 'Since `waste` is both an axis and a field label, a `change: waste: …` value must never begin a line; a wrapped FEEDBACK line is the case that bites, and you cannot see where it wraps — which is why the habit is to keep all four characters out rather than to reason about what follows them'
  current: 'Since `waste` is both axis and field label, `change: waste: …` value must never begin a line — wrapped FEEDBACK line is case that bites, and you cannot see where it wraps — so keep all four characters out rather than reason about what follows them'
