  section: '## ⚠️ Close-out feedback — PROACTIVE, and owed before you close the run record'
  baseline: 'Two traps, both executed against the real parser. (1) Keep ` · `, `|`, `;` and newlines out of the value. Precisely: the close splits on one of those four ONLY when a field label (`confusion|waste|change|filed|cost`) and a colon follow it — a bare semicolon or pipe in your prose is harmless — but when it does split, a ` · waste:` lands a duplicate field and REFUSES the close, and a ` · cost:` truncates your sentence SILENTLY and files a phantom cost'
  current: 'Two traps, both executed against the real parser. (1) Keep ` · `, `|`, `;` and newlines out of the value. Precisely: the close splits on one of those four ONLY when a field label (`confusion|waste|change|filed|cost`) and a colon follow it — a bare semicolon or pipe in your prose is harmless — but when it does split, a ` · waste:` lands a duplicate field and REFUSES the close, and a ` · cost:` truncates your sentence SILENTLY and files a phantom cost'
