  section: '## ⚠️ Close-out feedback — PROACTIVE, and owed before you close the run record'
  baseline: 'The axis is the PROPERTY OF THE COMMAND TEXT your edit improves, not the topic of your run: `lean` (it loads weight the run never used) · `fast` (it stalled you — an ask it could have answered, a re-derivation it could have carried) · `accurate` (it told you something untrue or ambiguous) · `waste` (it made you spend turns or tokens that changed nothing) · `infra` (it is wrong about this box''s machinery — paths, scripts, gates; NOT the infra BEAT of the `filed:` field) · `rules` (it contradicts or ignores a rule pack) · `manifesto` (it violates an operating principle)'
