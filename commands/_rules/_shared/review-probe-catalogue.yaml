  text:
  - 'Every other argument is barred, an `@file` argument file included, since many can drop a conftest, replace or override the pytest config, change the imports or plugins, or change the verdict (`--noconftest`, `--confcutdir`, `-c`/`--config-file`, `--rootdir`, `--import-mode`, `--runxfail`, any other `-p`, `-W`, and `-o`/`--override-ini` on any key, `timeout` included, since the config''s own timeout is the hang guard)'
