- id: cat-an-injected-line-is-read-back
  file: commands/_fragments/review-probe-catalogue.md
  section: '## Before the first pin, and again before each delta pin (the lead executes)'
  baseline: A line another tool injects or renders, changed or with a rendering the change alters, is read back whole through that tool's output after the edit and before each delta pin, under an invocation that emits it — a pack line in `review_rubric.py --changed <a path its globs hit>`, a fragment edit's consumers rendered to a temp dir, a template's emitted file — never in its source alone; a line the change leaves emitted by no invocation (a pack line with no mandate keyword, a section under a conditional heading) is named in the brief as dropped
  current: A line another tool injects or renders, changed or with a rendering the change alters, is read back whole through that tool's output after the edit and before each delta pin, under an invocation that emits it — a pack line in `review_rubric.py --changed <a path its globs hit>`, a fragment edit's consumers rendered to a temp dir, a template's emitted file — never in its source alone; a line the change leaves emitted by no invocation (a pack line with no mandate keyword, a section under a conditional heading) is named in the brief as dropped
  text:
  - A line another tool injects or renders, changed or with a rendering the change alters, is read back whole through that tool's output after the edit and before each delta pin, under an invocation that emits it — a pack line in `review_rubric.py --changed <a path its globs hit>`, a fragment edit's consumers rendered to a temp dir, a template's emitted file — never in its source alone; a line the change leaves emitted by no invocation (a pack line with no mandate keyword, a section under a conditional heading) is named in the brief as dropped.
