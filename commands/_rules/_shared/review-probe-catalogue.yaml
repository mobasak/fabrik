  section: '## Seat isolation'
  text:
  - A seat runs a Python test only through pytest, and only on a tree this section stages, with the pins laid over it — the archive the recipe builds (the whole test tree, the root conftest, the pytest config and every root the tests import, read or run, never a subset that leaves one out), the lead's base copy, or, for a test that reads git history or the tracked set, the clone above — never on the pins dir, a copy of it or any hand-assembled tree
  class: ban
  pins:
  - tests/test_seat_recipe_readable.py::<module>
