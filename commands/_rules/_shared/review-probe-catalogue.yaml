  file: commands/_fragments/review-probe-catalogue.md
  section: '## Loop bookkeeping'
  baseline: A round is recorded only after every candidate is read, each classed as a defect of THIS change, pre-existing or planned before it counts; `confirmed` counts DEFECTS, never checks passed, and a gate-caught defect counts; each brief embeds its ledger text and states what the seat must report (a count, a verdict, an output), never the value the lead expects; the closing-pass brief has every seat list each slice file it read, by path, and re-check every fix that replaced a form against the shapes the OLD form held, as the fix's ledger row lists them; a delta brief lists the exact mutant ids executed, reads a unified diff, and checks ROUTED claims for routing only; a one-hop edit found mid-fix is named in the next brief, and a guard a fix adds goes into every brief from that next one on, by name, with its escape variants (quote styles, unreadable values, globbed paths) and its model boundary; stale pre-existing text in an edited file is RECORDED with a destination (term-coverage D4), or fixed in the same hunk and named — never counted; the slice ledger is round 1's claim count even at zero confirmed
