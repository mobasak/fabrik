- id: cat-a-node-harness-test-is-the-leads-to-run
  file: commands/_fragments/review-probe-catalogue.md
  section: '## Seat isolation'
  text:
  - 'A test that needs a gitignored dependency tree (`node_modules/`) runs on no seat tree: an archive or a clone holds none, a link to the live one or a variable pointing at it lets the run write inside it, and a copy of it is a copy of the live checkout, which this section bars; so a seat reports that test unverifiable and never runs it, and the lead runs it when the change touches it, the code it tests, or the config, manifest or lockfile its run reads, in CLAUDE.md''s throwaway worktree at the pin''s `base_sha` with the pins laid over it, after an install from the lockfile that governs that tree, its own or its workspace root''s, run at that root (from the manifest alone when none governs it); a tree outside the repo is used only by a run that writes nothing inside it, its cache directory set under scratch, else the lead too reports the test unverifiable; the lead names UNPINNED every tree its run read that no lockfile installed'
  class: ban
  pins:
  - tests/test_seat_recipe_readable.py::test_a_node_harness_test_is_the_leads_to_run
