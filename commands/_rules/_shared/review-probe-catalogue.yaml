  file: commands/_fragments/review-probe-catalogue.md
  section: '## Before the first pin, and again before each delta pin (the lead executes)'
  baseline: Run the changed artifact end to end when it can run (an emitted one-liner run as emitted, under its real shell), and check the END STATE a recipe exists to produce, not only each step, against the artifact the next step compares it with (a lock file, a manifest), not only the source it reads; run a README snippet, usage text or rewritten docstring instruction as a caller would, and hand each seat of the brief that same command to run under § Seat isolation — one that writes a live store, sends, commits, deploys or reaches a host stays the lead's, who runs it on a scratch target (a throwaway database, repo, host or account), every such command and SQL block of a runbook included, or, when no scratch target exists, names it in the brief as not run, with why and the owner who can run it; only a read that changes nothing (no write, lock, quota spend or triggered job) runs against its real host — and probe each exception a rewritten docstring says the function still raises
