- id: chg-u2
  # class: prose
  file: commands/_fragments/cert-handoff-grammar.md
  baseline: "Severity is ASSIGNED by blast radius, not vibes (`/fabrik-release` BLOCKS on P0/P1 and operator-WARNs P2/P3, so the digit has teeth): P0 = data loss / tenant-crossing / auth bypass / money mischarged · P1 = a journey a real consumer cannot complete, or a fail-open on system truth · P2 = degraded-but-workaroundable behavior, latency-budget breaches, error-shape drift · P3 = doc-drift, cosmetic payload issues"
