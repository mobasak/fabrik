- id: u-L25
  # class: prose
  file: render
  section: '## Phase 1 — Adversarial grounding to a fixed point (the section partition)'
  baseline: 'Then check the four claims the section makes: (1) the enumeration is complete — hunt the personas specs forget (every SEND has a RECEIVER; the payer; the operator; the AUTOMATED consumers — subagents, pipelines, cron, calling services — and for every duty or mechanism the spec creates, the NAMED role that holds it: a duty with no holder is a finding, the exact hole an operator had to probe with "does it take into account roles?" 2026-08-30) and every persona the conversation named; (2) the PRIMARY is a VERBATIM operator quote — grep the conversation for it; a paraphrase is a finding (the author''s summary of the person is how a product gets re-aimed at nobody); (3) WALK the primary''s start-to-finish loop yourself and COUNT the steps — your count vs the frozen STEP BUDGET, and a mismatch is a finding against whichever is wrong (transdoc: nine steps sat invisible for a week because nobody re-walked); (4) sample the feature→persona traces — a feature serving no named persona is scaffold gravity (the ~1,100-line invitation flow nobody''s persona asked for): flag it for justification or cut'
