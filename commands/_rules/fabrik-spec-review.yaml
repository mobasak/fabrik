- id: u-L30
  # class: ban
  file: render
  section: '## Phase 1 — Adversarial grounding to a fixed point (the section partition)'
  baseline: 'A quotation mark in a spec is a claim that those exact words appear at that URL: to quote, pull the RAW document (`raw.githubusercontent.com`, view-source, `firecrawl_scrape` with `maxAge: 0` and `proxy: "basic"` — a live fetch needs that `maxAge: 0`, since Firecrawl serves recently indexed content by default (its tool schema), and `mcp__exa__web_fetch_exa` serves a crawl cache (below), so a quote — yours or a grounder''s — is called NOT FOUND only after that live re-fetch) and match the string — normalising whitespace first (raw HTML wraps lines mid-sentence, so a bare `grep -c` on a true quote returns 0; strip tags + collapse whitespace before matching, or a REAL quote gets flagged fabricated — the inverse error, hit live 2026-08-30 on a martinfowler.com quote)'
