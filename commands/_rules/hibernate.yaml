entries:
- id: hib-machinery
  class: prose
  file: render
  baseline: The operator runs `/hibernate` in the hub coordinator's window. The machinery is `scripts/sysadmin/hibernate.py` (`docs/reference/hibernate.md`); this command sequences it
  text:
  - The operator runs `/hibernate` in the hub coordinator's window; `scripts/sysadmin/hibernate.py` (`docs/reference/hibernate.md`) is the machinery, `H=/opt/fabrik/scripts/sysadmin/hibernate.py` below
  clauses:
    2: narrative
- id: hib-opens-no-record
  class: ban
  file: render
  baseline: 'The run record below, its Orient step and the Phase sections are the hub coordinator''s alone: a repo coordinator or an agent receiving the pause text opens no record and runs no Orient for it'
  current: 'The run record below, its Orient step and the Phase sections are the hub coordinator''s alone: a repo coordinator or an agent receiving the pause text opens no record and runs no Orient for it'
  text:
