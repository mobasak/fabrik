# class: prose
- id: hib-relay
  file: render
  baseline: Send its AGENT part verbatim to each of your live agents, pause yourself the same way, collect their PAUSED lines, and send them to the hub in one reply (name any agent that did not answer in 15 minutes)
  current: Send the coordinator text's AGENT part verbatim to each live agent, pause yourself, and send their PAUSED lines to the hub in one reply, naming any agent silent for 15 minutes
  text:
