# class: prose
- id: hib-prove-status
  file: render
  baseline: 'Prove it: `python3 $H status` — one row per live agent, yours included (marked `(you)`; this `/hibernate` run is the one run not counted); `BLOCKS` names why (a run still `running`, an unreadable run record, uncommitted changes, unpushed commits, a branch on no remote, no usable cwd)'
  current: 'Prove it: `python3 $H status`; `BLOCKS` names why a row is not safe'
  text:
  - 'Prove it: `python3 $H status`; `BLOCKS` names why a row is not safe'
# class: prose
- id: hib-rerun-bound
  file: render
  baseline: Re-run it every 2 minutes for at most 15 minutes, nudging the agent each `BLOCKS` row names; untracked files are counted in the row but never block
  current: Re-run it every 2 minutes for at most 15 minutes, nudging each agent a `BLOCKS` row names; untracked files never block
  text:
  - Re-run it every 2 minutes for at most 15 minutes, nudging each agent a `BLOCKS` row names; untracked files never block
# class: ban
- id: hib-close-first
  file: render
  baseline: 'Close this run, then tell the operator: the terminal is `status` printing `SAFE TO HIBERNATE` (close `done`, its evidence that output) or the 15-minute bound passing (close `blocked`, its reason the blocking rows) — close FIRST, so no record of yours is `running` when the box sleeps'
  current: Close this run FIRST, so no record of yours is `running` when the box sleeps, then tell the operator. The terminal is `status` printing `SAFE TO HIBERNATE` (close `done`, that output as evidence) or the 15-minute bound passing (close `blocked`, the blocking rows as reason)
  text:
  - Close this run FIRST, so no record of yours is `running` when the box sleeps, then tell the operator
  - The terminal is `status` printing `SAFE TO HIBERNATE` (close `done`, that output as evidence) or the 15-minute bound passing (close `blocked`, the blocking rows as reason)
