  - send their PAUSED lines to the hub in one reply, naming any agent silent for 15 minutes
# class: prose
- id: hib-agent-pause
  file: render
  baseline: 'You received the agent text: do exactly its five steps'
  current: 'Do exactly the agent text''s five steps: let your subagents finish before closing anything; close each live run in the first form your `command_run.py` accepts (`blocked --paused` · `handoff --resume` · `blocked` with the reason); write everything your next self needs to disk'
  text:
  - 'Do exactly the agent text''s five steps: let your subagents finish before closing anything'
# class: prose
- id: hib-agent-close-forms
  file: render
  baseline: 'The important ones: let your own subagents and seats finish before you close anything; close each live run in the first form your `command_run.py` accepts (`blocked --paused` · `handoff --resume` · `blocked` with the reason); and write everything your next self needs to disk — the wake drops your cached prompt, so the seed, the RESUME note and memory are all you will have'
  current: 'Do exactly the agent text''s five steps: let your subagents finish before closing anything; close each live run in the first form your `command_run.py` accepts (`blocked --paused` · `handoff --resume` · `blocked` with the reason); write everything your next self needs to disk'
  text:
  - close each live run in the first form your `command_run.py` accepts (`blocked --paused` · `handoff --resume` · `blocked` with the reason)
  - write everything your next self needs to disk
# class: prose
- id: hib-woke
  file: render
  baseline: Any wake line (the self-watch may still word a sleep as "the fleet-quota hold LIFTED") → run `python3 $H woke`
  current: 'On any wake line run `python3 $H woke`: exit 0 (the box slept, or the hub lifted the pause) means resume the SAME item from its seed without being told again; exit 1 says why to stay put'
  text:
  - On any wake line run `python3 $H woke`
# class: prose
- id: hib-resume-same
  file: render
  baseline: 'Exit 0 means the box slept (or the hub lifted the pause): resume the SAME item from its seed without being told again'
  current: 'On any wake line run `python3 $H woke`: exit 0 (the box slept, or the hub lifted the pause) means resume the SAME item from its seed without being told again; exit 1 says why to stay put'
  text:
  - means resume the SAME item from its seed without being told again
# class: prose
- id: hib-exit-1-stay
  file: render
  baseline: Exit 1 says why to stay put (no wake yet, or you already resumed)
  current: 'On any wake line run `python3 $H woke`: exit 0 (the box slept, or the hub lifted the pause) means resume the SAME item from its seed without being told again; exit 1 says why to stay put'
  text:
  - exit 1 says why to stay put
# class: prose
- id: hib-lift
  file: render
  baseline: 'The hub coordinator, once awake, ALWAYS runs `python3 $H lift` (a sleep during a fleet-quota hold writes no resume-wake row, and a pause with no sleep writes none either), then `targets`, and sends "RESUME — the hibernate is over" to every session: a relaunched session sits idle until prompted'
  current: The hub coordinator, once awake, ALWAYS runs `python3 $H lift`, then `targets`, and sends "RESUME — the hibernate is over" to every session
  text:
  - The hub coordinator, once awake, ALWAYS runs `python3 $H lift`, then `targets`, and sends "RESUME — the hibernate is over" to every session
