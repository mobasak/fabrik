# class: prose
- id: hib-listagents-first
  file: render
  baseline: 'Send the pause (`ListAgents` first — peer names change when a session restarts; use the name `targets` printed only if `ListAgents` shows it):'
  current: 'Send the pause, after `ListAgents` (use a `targets` peer name only if `ListAgents` shows it): ONE `SendMessage` per repo coordinator with `python3 $H brief --role coordinator --words "<the words>"`, verbatim; `brief --role agent` to each session of a repo whose row says to message each session, and each `outside /opt` session'
  text:
  - (use a `targets` peer name only if `ListAgents` shows it)
# class: prose
- id: hib-brief-coordinator
  file: render
  baseline: 'each repo whose row names a coordinator: ONE `SendMessage` to that peer with the output of `python3 $H brief --role coordinator --words "<the words>"`, verbatim;'
  current: 'Send the pause, after `ListAgents` (use a `targets` peer name only if `ListAgents` shows it): ONE `SendMessage` per repo coordinator with `python3 $H brief --role coordinator --words "<the words>"`, verbatim; `brief --role agent` to each session of a repo whose row says to message each session, and each `outside /opt` session'
  text:
  - ONE `SendMessage` per repo coordinator with `python3 $H brief --role coordinator --words "<the words>"`, verbatim
# class: prose
- id: hib-brief-agent
  file: render
  baseline: 'each repo whose row says to message each session (no live coordinator, two sessions holding the name, or your own repo) and each `outside /opt` session: the output of `brief --role agent`, to each session;'
  current: 'Send the pause, after `ListAgents` (use a `targets` peer name only if `ListAgents` shows it): ONE `SendMessage` per repo coordinator with `python3 $H brief --role coordinator --words "<the words>"`, verbatim; `brief --role agent` to each session of a repo whose row says to message each session, and each `outside /opt` session'
  text:
  - '`brief --role agent` to each session of a repo whose row says to message each session'
