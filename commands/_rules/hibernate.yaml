- id: hib-mark
  file: render
  baseline: 'Mark the pause: `python3 $H mark --words "<the operator''s words>"`'
  current: 'Mark the pause: `python3 $H mark --words "<the operator''s words>"`, with no other run of yours running: it would stay `running` across the sleep'
  text:
  - 'Mark the pause: `python3 $H mark --words "<the operator''s words>"`'
