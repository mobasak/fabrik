# class: prose
- id: hib-machinery
  file: render
  baseline: The operator runs `/hibernate` in the hub coordinator's window. The machinery is `scripts/sysadmin/hibernate.py` (`docs/reference/hibernate.md`); this command sequences it
  current: The operator runs `/hibernate` in the hub coordinator's window; `H=/opt/fabrik/scripts/sysadmin/hibernate.py` (`docs/reference/hibernate.md`) is the machinery
  text:
  - (`docs/reference/hibernate.md`) is the machinery
