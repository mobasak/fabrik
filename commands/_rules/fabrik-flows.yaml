  class: prose
  baseline: Parallelism — UNCONDITIONAL, every run. Dispatch one native `general-purpose` seat per persona (or per journey), all in a single message to walk that persona's path through the spec, the code and any existing flows and return its entry → actions → feedback → exit with the gaps it hit; the persona count is the PARTITION and `dispatch_headroom.py --units <N> --mechanical 0` prints the seats — stamped BEFORE they go out with `python3 scripts/command_run.py dispatch --seats <n>` so sibling sessions subtract them — (D-191 — a persona walk is a judgement, no Haiku mechanical seat; the Opus authoritative seat re-walks the highest-risk persona)
