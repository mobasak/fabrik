- id: r-07  # class: prose
  section: '## ⚠️ Termination contract'
  baseline: 'You are done when EVERY checklist item below (identity, DNS, health/readiness, registrar obligations, Gatus, logs, parity) is TERMINAL — one of the four token FAMILIES (the Output block''s row-specific spellings — `discriminator void` is DNS''s INCONCLUSIVE, `missing` is GATUS''s FAIL, `n/a (not obligated)` is the spec-voided NOT-RUN): PASS (with evidence: a command''s real output, this run) · FAIL (with evidence + a named route) · INCONCLUSIVE (the probe cannot discriminate — the re-probe instruction is the route) · NOT-RUN (<the cause> — the early-stop and store-guard branches'' honest token, never silence) — and the verdict table has been printed (EXCEPT the Phase-0 store-surface hand-back, which emits its own two-line closing form INSTEAD of the Output block — never manufacture n/a rows for fields that do not exist on that path)'
  current: 'You are done when EVERY checklist item (identity, DNS, health/readiness, registrar obligations, Gatus, logs, parity) is TERMINAL — one of four token FAMILIES: PASS (with evidence: a command''s real output, this run) · FAIL (with evidence + a named route) · INCONCLUSIVE (the probe cannot discriminate — the re-probe instruction is the route) · NOT-RUN (<the cause>) (the Output block''s spellings: `discriminator void` is DNS''s INCONCLUSIVE, `missing` is GATUS''s FAIL, `n/a (not obligated)` the spec-voided NOT-RUN) — and the verdict table is printed (EXCEPT the Phase-0 store-surface hand-back, which emits its own two-line form INSTEAD)'
  text:
  - 'You are done when EVERY checklist item (identity, DNS, health/readiness, registrar obligations, Gatus, logs, parity) is TERMINAL — one of four token FAMILIES: PASS (with evidence: a command''s real output, this run) · FAIL (with evidence + a named route) · INCONCLUSIVE (the probe cannot discriminate — the re-probe instruction is the route) · NOT-RUN (<the cause>) (the Output block''s spellings: `discriminator void` is DNS''s INCONCLUSIVE, `missing` is GATUS''s FAIL, `n/a (not obligated)` the spec-voided NOT-RUN) — and the verdict table is printed (EXCEPT the Phase-0 store-surface hand-back, which emits its own two-line form INSTEAD)'
