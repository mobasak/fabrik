- id: dc-no-registry-evidence  # class: ban
  file: render
  baseline: 'Never treat a catalog row, `PORTS.md` row, a `specs/services/*.yaml` file''s mere existence, or a `.env` reference as evidence of liveness either way — the captcha case is the cautionary tale: the catalog/env rows still read "live" after the service''s DNS record was already gone (`CHANGELOG.md` § "Removed — captcha.vps1.ocoron.com torn down…" (2026-08-07) — the corrected finding)'
  current: Never treat a catalog row, `PORTS.md` row, a `specs/services/*.yaml` file's mere existence, or a `.env` reference as evidence of liveness either way
  text:
