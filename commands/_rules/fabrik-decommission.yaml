- id: dc-archived-not-dead  # class: prose
  file: render
  baseline: 'The archived-source ≠ dead-service principle itself rests on the MECHANISM, not on any changelog anecdote: a hub-side `mv /opt/<name> /opt/archived/<name>` only relocates the SOURCE tree — it never touches the VPS runtime'
  current: 'Archived source proves nothing about liveness in EITHER direction: `mv /opt/<name> /opt/archived/<name>` only relocates the SOURCE tree and never touches the VPS runtime; the only thing that does is `fabrik destroy` (`_destroy_compose`''s `docker compose down` + remote `rm -rf`, `src/fabrik/orchestrator/destroyer.py:338-340`)'
  text:
  - proves nothing about liveness in EITHER direction
  - only relocates the SOURCE tree and never touches the VPS runtime
  - the only thing that does is `fabrik destroy` (`_destroy_compose`'s `docker compose down` + remote `rm -rf`, `src/fabrik/orchestrator/destroyer.py:338-340`)
- id: dc-outcome-archive  # class: grammar
  file: render
  baseline: '| archive-source-only | Liveness probe = LIVE, and/or the consumer sweep found a live consumer with no migration need yet | Phase 2 moves the SOURCE project only; the deployed service is untouched — `CHANGELOG.md` § "Changed — wpf retired and archived" (2026-08-07)''s wpf precedent (8 uncommitted files preserved exactly across the move) is the clean archive-source-only case. Captcha''s move preserved 6 files the same way, but its "service stays live" claim was ITSELF RETRACTED the SAME DAY after a fresh DNS probe (`CHANGELOG.md` § "Removed — captcha.vps1.ocoron.com torn down…" (2026-08-07)) — the file-preservation figure still stands, the liveness claim doesn''t; that gap is the cautionary tale behind Phase 0 step 2''s only-a-probe-run-THIS-session rule |'
  current: '| archive-source-only | Liveness probe = LIVE, and/or the consumer sweep found a live consumer with no migration need yet | Phase 2 moves the SOURCE project only; the deployed service is untouched |'
  text:
  - Liveness probe = LIVE, and/or the consumer sweep found a live consumer with no migration need yet
  - Phase 2 moves the SOURCE project only; the deployed service is untouched
