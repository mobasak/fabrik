- id: dc-liveness-probe  # class: prose
  file: render
  baseline: Liveness probe — DNS vs siblings, never registry rows. Resolve the target's public domain (e.g. `dig +short <name>.vps1.ocoron.com` or `getent hosts`) in the SAME probe run as two KNOWN-LIVE sibling domains on the same VPS — VERIFY they resolve before trusting them as controls (e.g. `status.vps1.ocoron.com` plus a live spec domain; `gatus.vps1`/`grafana.vps1` are NXDOMAIN — the dead-sibling trap; on vps2/vps3 wildcard DNS makes bare resolution non-evidentiary, so the discriminating evidence moves to the HTTPS layer, per `/fabrik-deploy-verify`'s control probe)
