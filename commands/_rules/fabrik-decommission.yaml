- id: dc-vps-wipe  # class: prose
  file: render
  baseline: 'That compose-destroy step is itself irreversible on the remote side: `_destroy_compose` runs `docker compose down` then `sudo rm -rf /opt/<name>` ON THE VPS (`src/fabrik/orchestrator/destroyer.py:338-340`) — the remote tree is wiped even though this command''s own hub-side move to `/opt/archived/<name>` is preserved untouched; that VPS-side wipe, not the hub-side archive, is what makes a *full decommission* irreversible'
  current: '`_destroy_compose` runs `docker compose down` then `sudo rm -rf /opt/<name>` ON THE VPS (`destroyer.py:338-340`) even though the hub archive is preserved; that VPS-side wipe is what makes a *full decommission* irreversible'
  text:
  - '`_destroy_compose` runs `docker compose down` then `sudo rm -rf /opt/<name>` ON THE VPS (`destroyer.py:338-340`)'
  - even though the hub archive is preserved
  - is what makes a *full decommission* irreversible
