- id: dc-mv-crossdev  # class: prose
  file: render
  baseline: 'Once clear: `mv /opt/<name> /opt/archived/<name>` — atomic only when `/opt` and `/opt/archived` share a filesystem (the fabrik convention); across a filesystem boundary `mv` silently falls back to copy-then-unlink, which CAN drop a file mid-copy — the before/after count in step 3 is what actually proves nothing was lost, and matters most in that cross-device case'
  current: The move is atomic only when `/opt` and `/opt/archived` share a filesystem; across a filesystem boundary `mv` silently falls back to copy-then-unlink and CAN drop a file mid-copy, so step 3's counts prove nothing was lost
  text:
  - The move is atomic only when `/opt` and `/opt/archived` share a filesystem
  - '`mv` silently falls back to copy-then-unlink and CAN drop a file mid-copy'
  - step 3's counts prove nothing was lost
