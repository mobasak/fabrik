  section: '## Phase 3 — Flip + persist + hand off'
  baseline: 'Two gate runs break the bootstrap circularity — the anatomy is proven, not asserted: (a) stage the flipped PLAN + its `docs/DECISIONS.md` flip row (step 1''s mint — staged together or the SAME-commit contract silently breaks); (b) run `python scripts/final_gate.py --check --json` → fix until `"status": "success"` and capture the fenced output (the artifact is still untracked, so the review gates don''t demand an embed that doesn''t exist yet; fixes at this step are to staging/format issues OUTSIDE the plan body — a fix that must touch the PLAN means the flip was premature: the loop re-opens and the flip is redone after); (c) write the artifact WITH that fence embedded; (d) stage the artifact; (e) re-run the gate → `"status": "success"` now proves the artifact itself passes its review branch — print this run in your session output (the artifact''s embedded fence is (b)''s run); (f) commit all three — plan, artifact, ledger row — and PUSH (ONE commit, explicit pathspecs, Agent Provenance Trailers + `Agent-Context: deploy-plan-review <plan-stem>` — the marker `/fabrik-deploy`''s post-flip-edit gate exempts; use it on EVERY status commit this command makes: the CONVERGED flip, the inputs-changed flip-back, and the ⛔ re-entry flips)'
  text:
  - 'Two gate runs break the bootstrap circularity — the anatomy is proven, not asserted: (a) stage the flipped PLAN + its `docs/DECISIONS.md` flip row (step 1''s mint — staged together or the SAME-commit contract silently breaks); (b) run `python scripts/final_gate.py --check --json` → fix until `"status": "success"` and capture the fenced output (fixes at this step are to staging/format issues OUTSIDE the plan body — a fix that must touch the PLAN means the flip was premature: the loop re-opens and the flip is redone after); (c) write the artifact WITH that fence embedded; (d) stage the artifact; (e) re-run the gate → `"status": "success"` proves the staged artifact passes its review branch — print this run in your session output (the artifact''s embedded fence is (b)''s run); (f) commit all three — plan, artifact, ledger row — and PUSH (ONE commit, explicit pathspecs, Agent Provenance Trailers + `Agent-Context: deploy-plan-review <plan-stem>` — the marker `/fabrik-deploy`''s post-flip-edit gate exempts; use it on EVERY status commit this command makes: the CONVERGED flip, the inputs-changed flip-back, and the ⛔ re-entry flips)'
