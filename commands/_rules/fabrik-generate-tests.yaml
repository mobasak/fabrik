  class: ban
  baseline: 'Tool-enabled authors run in a worktree on committed HEAD (`git worktree add --detach HEAD`) — which is also the secrets boundary: a worktree carries only tracked files, so an UNCOMMITTED `.env`/key never reaches a pool author — but committed HEAD is exactly where a LEAKED secret lives, and a write-mode pool author READS it off disk with no inlining needed (the carve-out binds BOTH modes; a repo with a committed key gets NATIVE authors)'
