- id: r-render-dossier-md
  section: '## Phase 3 — the artifact, and the hand-off'
  baseline: Write `docs/reference/rivals/<market>.md` from `rivals_run.py::render_dossier_md(dossier.to_dict())` — not from `dossier.to_markdown()`
  text:
  - Write `docs/reference/rivals/<market>.md` from `rivals_run.py::render_dossier_md(dossier.to_dict())`, not `dossier.to_markdown()`, which needs the live TYPED `Dossier` (`m.universal`, `b.weight`) and raises `AttributeError` on plain dicts, because the driver writes the JSON payload BEFORE rendering — the money is already spent and a formatting bug must never destroy a paid run
  - There is no `Dossier.from_dict()`, so the saved payload can only be rendered from dicts; re-rendering an old run from disk takes the same path
