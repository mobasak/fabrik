- id: r-dossier-header  # class: prose
  section: '## Phase 3 — the artifact, and the hand-off'
  baseline: Add a header carrying the scan DATE (the driver stamps `scanned_at`; a dossier with no date reads as current forever, and competitive intel is perishable — rival pricing, features and review sentiment all move), the run's `job_id`, the model, the spend, `partial`/`truncated`, whether it ran `--free-legs-only`, and the Pass Ledger
  current: Add a header with the scan DATE (`scanned_at`), the run's `job_id`, the model, the spend, `partial`/`truncated`, `--free-legs-only` or not, and the Pass Ledger
  text:
