- id: r-reread-date  # class: prose
  section: '## Phase 3 — the artifact, and the hand-off'
  baseline: Re-read the date before trusting an existing dossier — an old one is a starting point for a fresh scan, never evidence about today's market
  current: Re-read the date before trusting an existing dossier — an old one is never evidence about today's market
  text:
  - Re-read the date before trusting an existing dossier — an old one is never evidence about today's market
- id: r-callout  # class: prose
  section: '## Phase 3 — the artifact, and the hand-off'
