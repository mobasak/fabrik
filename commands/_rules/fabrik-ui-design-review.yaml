- id: ui-design-review-defects
  class: prose
  file: render
  baseline: The things a design contract gets wrong — and the ones this pass exists to catch — are (1) a screen that renders a field the data contract doesn't have (or invents a component the design system doesn't define), (2) a spec task with no flow, a flow with no screen, or a screen no navigation reaches, and (3) a flow that quietly blew its click budget
  text:
