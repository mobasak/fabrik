- id: x-floor
  file: render
  text:
  - 'the surface cut into DISJOINT slices by file: two cheap finders per slice, one Sonnet and one Haiku `fabrik-reviewer`, candidates unioned, no Opus finder (pilot D-344 over D-207; `/fabrik-execute-plan`''s per-round Opus finder floor is its own rule and still stands, D-813); at most ONE extra Haiku class seat when the brief names a non-scriptable inventory class; every file read by its two finders; sized by `dispatch_headroom.py --slices sonnet=N,haiku=N`'
  - 'two cheap finders per slice — one Sonnet and one Haiku, each over the whole slice, candidates unioned, never voted — and no Opus finder (pilot D-344, 2026-09-22, superseding D-207''s Opus-on-the-risky mix; the risky units — concurrency and locks, record and file formats, fleet-synced paths, auth, schema, migrations, secrets — are the slice''s named hunt priority, and Opus/Fable execute in the orchestrator; `/fabrik-execute-plan`''s per-round Opus finder floor, once at D7 under `Profile: small`, is its own rule and still stands), at most ONE extra Haiku class seat for a judgement-shaped inventory class the close-out hygiene script cannot express and only when the brief names it'
- id: x-term
