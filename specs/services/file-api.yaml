id: file-api
kind: service
template: node-api
domain: files-api.vps1.ocoron.com

source:
  type: local
  path: /opt/file-api

env:
  NODE_ENV: production
  LOG_LEVEL: INFO

secrets:
  required:
    - CLOUDFLARE_R2_ACCOUNT_ID
    - CLOUDFLARE_R2_ACCESS_KEY_ID
    - CLOUDFLARE_R2_SECRET_ACCESS_KEY
    - CLOUDFLARE_R2_BUCKET_NAME

resources:
  limits:
    memory: 512M
    cpus: "0.5"

health:
  path: /health
  port: 3000
  interval: 30s
  timeout: 10s
  retries: 3
