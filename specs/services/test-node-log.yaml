id: test-node-log
kind: service
template: node-api
domain: test-node-log.vps1.ocoron.com
shape:
  kind: service
  is_public: true
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: false
  needs_database: false
  has_search_feature: false
expose:
  http: true
  internal_only: false
source:
  type: template
  branch: main
coolify:
  project: default
  server: localhost
depends: {}
infrastructure:
  database: local
  storage: local
  auth: none
env: {}
secrets:
  required: []
  generate: []
  from_env: []
  from_file: {}
resources:
  memory: 256M
  cpu: '0.5'
health:
  path: /api/health
  interval: 30s
  timeout: 10s
  retries: 3
volumes: []
backup:
  enabled: true
  frequency: daily
  retention: 30
