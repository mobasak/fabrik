id: site-provisioner
kind: service
template: python-api
domain: provision.vps1.ocoron.com

# Project-shape descriptor (Phase 4k). Drives InfrastructureProvisioner.
# site-provisioner is a public API that fronts Namecheap/Cloudflare/DomainNameAPI,
# uses a Postgres database on postgres-main, and stores no local persistent data
# (DB handles all state; backups handled at postgres-main level via existing Backrest plans).
shape:
  kind: service
  is_public: true                # → Gatus endpoint for /health
  is_admin_dashboard: false      # API only, no HTML admin UI (no Authelia)
  has_bearer_api: false          # bearer auth exists (API_KEY) but not behind Authelia
  has_persistent_data: false     # DB lives on postgres-main, backed up separately
  needs_database: true           # uses postgres-main::site_provisioner (already created)
  has_search_feature: false
  exposes_metrics: true          # → Prometheus scrape job; /metrics is live at
                                 # api/main.py, auth- and rate-limit-exempt by design.
                                 # Absent until 2026-09-05: an ABSENT flag defaults false
                                 # and is byte-identical to a deliberate false, so the
                                 # registrar silently never fired (site-provisioner,
                                 # 01M1Q7RJ5ZWAP7BGFQE1EWJC6Z).

# Git-sourced dockercompose app. The SSH deployer uses the repo's /compose.yaml
# for this build_pack — which contains the custom IP allowlist middleware +
# alembic migration runner + service-account file mount. fabrik apply here is
# effectively: env-var sync (to the service `.env` on the VPS) + shape-gated
# registrars + git pull + rebuild (via deploy(force=True) from glitchtip step).
source:
  type: git
  repository: git@github.com:mobasak/site-provisioner.git
  branch: main


# Non-secret runtime config. NAMECHEAP_CLIENT_IP must be the VPS public IP
# (Namecheap validates source IP), not a dev IP.
#
# DOMAINNAMEAPI_* are declared (empty) because the upstream compose.yaml
# references them via ${VAR} — compose interpolation requires the key exist
# in .env even if the value is empty. The DomainNameAPI driver is unused.
#
# GIT_SHA placeholder satisfies compose interpolation; empty is acceptable
# (used only as a label/version string).
#
# GOOGLE_APPLICATION_CREDENTIALS is an in-container file path (the service
# account JSON is COPYed into the image during build); not a secret value.
#
# DATABASE_URL: placeholder satisfies first compose-up; the postgres
# registrar (shape.needs_database=true) overwrites it post-deploy via
# inject_env() and restarts the container with the real DSN.
env:
  API_HOST: "0.0.0.0"
  API_PORT: "8001"
  LOG_LEVEL: INFO
  APP_ENV: production
  NAMECHEAP_USE_PROXY: "true"
  NAMECHEAP_SANDBOX: "false"
  NAMECHEAP_CLIENT_IP: "172.93.160.197"
  GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
  DOMAINNAMEAPI_USERNAME: ""
  DOMAINNAMEAPI_PASSWORD: ""
  GIT_SHA: ""
  DATABASE_URL: "postgresql+asyncpg://placeholder:placeholder@postgres-main:5432/placeholder"

secrets:
  # Pulled from /opt/fabrik/.env at apply time. Every var below is also
  # referenced by the upstream compose.yaml via ${VAR} — keep this list in
  # sync with:
  #   grep -oE '\$\{[A-Z_]+' compose.yaml | sort -u
  from_env:
    - NAMECHEAP_API_KEY
    - NAMECHEAP_API_USER
    - NAMECHEAP_PROXY_URL
    - CLOUDFLARE_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
    - CLOUDFLARE_GLOBAL_API_KEY
    - CLOUDFLARE_EMAIL
    - API_KEY
    - BING_WEBMASTER_API_KEY

resources:
  memory: 512M
  cpu: "0.5"

monitoring:
  # INTERNAL scrape, not the public edge. The prometheus driver defaults to
  # `<domain>:443` over https, but this service sits behind a custom IP-allowlist
  # middleware: https://provision.vps1.ocoron.com/metrics returns 403 from the
  # internet (so does /health), so the default target would register a scrape job
  # that is DOWN forever — which is worse than no job, because
  # `max_over_time(up[10m])==0` in proactive-check.sh would then alert every 15
  # minutes. fabrik-zitadel is that failure already live (health=down, 404).
  # Proven reachable on the fabrik network 2026-09-05: a peer container gets real
  # metrics from http://site-provisioner:8001/metrics.
  target: site-provisioner:8001
  scheme: http

health:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
