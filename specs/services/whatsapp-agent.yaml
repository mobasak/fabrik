id: whatsapp-agent
kind: service
template: python-api
domain: whatsapp-agent.vps1.ocoron.com
shape:
  kind: service
  is_public: false            # not a public/marketing site
  is_admin_dashboard: true    # MULTI-TENANT: self-service "connect your WhatsApp" QR dashboard, Authelia-gated (authelia-forward@docker); each CRM user pairs their OWN number
  has_bearer_api: false       # bridge call + Evolution->middleware webhook are internal M2M; the human dashboard is Authelia-gated, not a public bearer API
  has_persistent_data: true   # the instance<->tenant registry must survive redeploys
  needs_database: true        # MULTI-TENANT: the middleware's OWN operational DB — instance<->org/user registry + per-tenant mapping. NOT CRM data (that stays in Tryton via the bridge).
  has_search_feature: false
  needs_cache: true           # per-tenant conversation buffer / short-lived session state (redis-main)
  exposes_metrics: false      # no /metrics endpoint yet (flip true when added; avoids Prometheus 404 at apply)
expose:
  http: true
  internal_only: false        # the QR-connect dashboard needs an Authelia-gated Traefik route (whatsapp-agent.vps1.ocoron.com) so CRM users can reach it. The Evolution->middleware WEBHOOK stays INTERNAL (Evolution posts to http://whatsapp-agent:8000 over fabrik-net, bypassing Traefik/Authelia).
source:
  type: git
  repository: git@github.com:mobasak/whatsapp-agent.git
  branch: mobasak/whatsapp-agent
depends: {}
infrastructure:
  database: local
  storage: local
  auth: none
env:
  PORT: ${PORT:-8000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TRYTON_CRM_URL: http://tryton-crm:8000        # the M2M CRM bridge (fabrik-net DNS) — NOT direct Tryton
  EVOLUTION_API_URL: http://evolution-api:8080  # the Evolution gateway (fixed container port 8080, fabrik-net DNS)
secrets:
  required: []
  generate:
  - X_INTERNAL_TOKEN          # PER-SERVICE token to call the bridge (prod). Blast-radius containment: an internet-adjacent channel client must NOT share the internal SERVICE_INTERNAL_SECRET_KEY. The tryton-crm bridge accepts this token once Plan 2's per-consumer token registry (R-token-registry) ships.
  from_env:
  - SERVICE_INTERNAL_SECRET_KEY   # DEV / BRING-UP FALLBACK ONLY — the bridge accepts it today, but do NOT ship to prod on the shared secret. Remove once the bridge accepts X_INTERNAL_TOKEN.
  - OPENROUTER_API_KEY            # LLM (agent reasoning)
  - EVOLUTION_API_KEY             # to call the Evolution API HTTP endpoint (SAME value as the evolution-api service's AUTHENTICATION_API_KEY)
  from_file: {}
resources:
  memory: 512M
  cpu: '0.5'
health:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
  disabled: false
volumes: []
companion_services: []
backup:
  enabled: true
  frequency: daily
  retention: 30
watchdog:
  enabled: false
  daily_budget_usd: 1.0
  daily_invocations_cap: 200
  auto_tier_b: false
  escalation_channel: apprise
  llm_provider_primary: claude-code
  llm_provider_fallback: openrouter
  cheap_model: haiku
  expensive_model: sonnet
  per_incident_budget_usd: 0.5
  deadman_timeout_seconds: 300
  external_docs_enabled: true
  propose_fix_prs: false
  auto_code_fix: false
  code_fix_window_sec: 1800
  critical_paths: []
  trigger_sources: []
