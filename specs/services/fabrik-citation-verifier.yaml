id: fabrik-citation-verifier
kind: service
template: python-api
domain: citations.vps1.ocoron.com
shape:
  kind: service
  is_public: true
  is_admin_dashboard: false
  has_bearer_api: true           # SERVICE_INTERNAL_SECRET_KEY validates X-Internal-Token
  has_persistent_data: true      # Alembic migrations, citations + verifications tables
  needs_database: true
  has_search_feature: false
expose:
  http: true
  internal_only: false
source:
  type: git
  repository: https://github.com/mobasak/fabrik-citation-verifier.git
  branch: main
depends:
  # The app's actual DB (project DATABASE_URL -> .../citation_verifier). Was
  # absent, so the orchestrator derived 'fabrik_citation_verifier' (drift caught
  # by check_spec_db_match.py). Differs from the derived name, so the Phase-1a
  # rename guard will block the next apply if a 'fabrik_citation_verifier' DB
  # already holds data (migrate it, then re-apply).
  postgres: citation_verifier
infra:
  glitchtip: true                # real service, error tracking worthwhile
infrastructure:
  # `local` = postgres-main on VPS (the canonical "shared" backend per
  # DatabaseType enum in spec_loader.py). The X-Internal-Token M2M pattern
  # is an APP-level concern enforced in the service's internal_auth
  # middleware — not a backend choice, so AuthType stays `none` here.
  database: local
  storage: local
  auth: none
env:
  PORT: ${PORT:-8032}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SERVICE_NAME: fabrik-citation-verifier
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
  RESOLVER_TIMEOUT_SECONDS: ${RESOLVER_TIMEOUT_SECONDS:-15}
  CHAIN_BUDGET_SECONDS: ${CHAIN_BUDGET_SECONDS:-60}
  VERIFICATION_TTL_DAYS: ${VERIFICATION_TTL_DAYS:-90}
  NCBI_TOOL_NAME: fabrik-citation-verifier
  CRAWL4AI_URL: http://crawl4ai:11235
secrets:
  required:
    - DATABASE_URL                    # app DB 'citation_verifier' on postgres-main (matches depends.postgres)
    - SERVICE_INTERNAL_SECRET_KEY     # X-Internal-Token auth for m2m calls
    - NCBI_API_KEY                    # NCBI polite-pool (strongly recommended)
    - NCBI_CONTACT_EMAIL
    - OPENALEX_MAILTO                 # polite-pool email
    - CROSSREF_MAILTO                 # polite-pool email
    - UNPAYWALL_EMAIL                 # CV-104 fulltext annotator
    - SEMANTIC_SCHOLAR_API_KEY        # CV-101
    - SCOPUS_API_KEY                  # CV-106
    - CORE_API_KEY                    # CV-105
  generate: []
  from_env: []
  from_file: {}
resources:
  memory: 1G                          # resolver chain + crawl4ai is memory-hungry
  cpu: '1.0'
health:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
  disabled: false
volumes: []
backup:
  enabled: true
  frequency: daily
  retention: 30
