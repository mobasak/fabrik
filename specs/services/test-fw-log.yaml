id: test-fw-log
kind: worker
template: file-worker
shape:
  kind: worker
  is_public: false
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: true
  needs_database: false
  has_search_feature: false
expose:
  http: false
  internal_only: false
source:
  type: template
  branch: main
depends: {}
infrastructure:
  database: local
  storage: local
  auth: none
env: {}
secrets:
  required: []
  generate: []
  from_env:
  - SUPABASE_SERVICE_ROLE_KEY
  - R2_SECRET_ACCESS_KEY
  from_file: {}
resources:
  memory: 256M
  cpu: '0.5'
volumes: []
backup:
  enabled: true
  frequency: daily
  retention: 30
