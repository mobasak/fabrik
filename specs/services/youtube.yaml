id: youtube
kind: service
template: python-api
domain: youtube.vps1.ocoron.com

source:
  type: git
  repository: https://github.com/mobasak/youtube-pipeline.git
  branch: main

env:
  PORT: "8029"
  LOG_LEVEL: INFO
  APP_ENV: production
  SERVICE_NAME: youtube
  ALLOWED_ORIGINS: https://youtube.vps1.ocoron.com

secrets:
  required:
    - DATABASE_URL
  from_env:
    - DB_HOST
    - DB_PORT
    - DB_NAME
    - DB_USER
    - DB_PASSWORD
    - REDIS_URL
    - SONIOX_API_KEYS
    - YOUTUBE_API_KEYS
    - B2_KEY_ID
    - B2_APPLICATION_KEY
    - B2_BUCKET_NAME
    - IPROYAL_API_TOKEN

shape:
  kind: service
  is_public: true
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: true
  needs_database: true
  needs_cache: false
  has_search_feature: false
  exposes_metrics: false   # app exposes no /metrics (Flask dashboard + poll workers); flip to true + add a /metrics endpoint to enable the Prometheus job

depends:
  postgres: youtube_pipeline

# PostgreSQL extensions required (superuser, run once after DB creation):
#   CREATE EXTENSION IF NOT EXISTS vector;    -- pgvector (RAG embeddings)
#   CREATE EXTENSION IF NOT EXISTS pg_trgm;   -- trigram text similarity
# Install system package first: sudo apt install postgresql-16-pgvector
# Then run: scripts/init_db.sh (handles extensions + migrations)

resources:
  memory: 1G
  cpu: "1.0"

health:
  path: /health   # matches the app + Dockerfile HEALTHCHECK (both dashboard.app:app and api/main.py serve /health, not /healthz)
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

backup:
  enabled: true
  frequency: daily
  retention: 30


notes: |
  Workers run on systemd youtube-worker.service (out of scope for Epic 1, see Epic 2).
  Flask dashboard on port 5000 via nohup (out of scope, see Epic 2).
  fabrik.alias: youtube stable-alias registration deferred to Epic 2.
  Redis logical-DB allocation deferred to Epic 2 — Epic 1 uses shared redis-main db 0
  via REDIS_URL; see docs/RESILIENCE.md §9 Accepted Gaps.
