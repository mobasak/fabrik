id: translator
kind: service
template: python-api
domain: translator.vps1.ocoron.com

source:
  type: local
  path: /opt/translator

env:
  LOG_LEVEL: INFO
  APP_ENV: production

secrets:
  required:
    - DEEPL_API_KEY
    - AZURE_TRANSLATOR_KEY
    - AZURE_TRANSLATOR_REGION

resources:
  limits:
    memory: 512M
    cpus: "0.5"

health:
  path: /health
  port: 8000
  interval: 30s
  timeout: 10s
  retries: 3
