id: gmail-account-creator
kind: worker
template: file-worker
shape:
  kind: worker
  is_public: false
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: true
  needs_database: true
  has_search_feature: false
  needs_cache: false
  exposes_metrics: false
expose:
  http: false
  internal_only: false
source:
  type: git
  repository: git@github.com:mobasak/gmail-account-creator.git
  branch: mobasak/gmail-account-creator
depends:
  postgres: main
infrastructure:
  database: local
  storage: local
  auth: none
env:
  PORT: '8000'
  LOG_LEVEL: INFO
secrets:
  required: []
  generate: []
  from_env:
  - SUPABASE_SERVICE_ROLE_KEY
  - R2_SECRET_ACCESS_KEY
  from_file: {}
resources:
  memory: 256M
  cpu: '0.5'
volumes: []
companion_services: []
backup:
  enabled: true
  frequency: daily
  retention: 30
watchdog:
  enabled: true
  daily_budget_usd: 1.0
  daily_invocations_cap: 200
  auto_tier_b: false
  escalation_channel: apprise
  llm_provider_primary: claude-code
  llm_provider_fallback: openrouter
  cheap_model: haiku
  expensive_model: sonnet
  per_incident_budget_usd: 0.5
  deadman_timeout_seconds: 300
  external_docs_enabled: true
  propose_fix_prs: false
  auto_code_fix: false
  code_fix_window_sec: 1800
  critical_paths: []
  trigger_sources: []
