id: test-chrome-extension
template: chrome-extension
kind: service
domain: test-chrome-extension.example.com

secrets:
  from_env:
    - NAMECHEAP_API_KEY
    - CLOUDFLARE_API_TOKEN
  from_file:
    GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON: /tmp/test-chrome-extension-creds.json

env:
  LOG_LEVEL: INFO
