id: fabrik-test-file-worker
kind: worker
template: file-worker
shape:
  kind: worker
  is_public: false
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: true
  needs_database: false
  has_search_feature: false
expose:
  http: false
  internal_only: false
source:
  type: git
  repository: https://github.com/mobasak/fabrik-test-file-worker.git
  branch: mobasak/fabrik-test-file-worker
coolify:
  project: fabrik-services
  server: localhost
depends: {}
infrastructure:
  database: local
  storage: local
  auth: none
env:
  PORT: '8000'
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
secrets:
  required: []
  generate: []
  from_env:
  - SUPABASE_SERVICE_ROLE_KEY
  - R2_SECRET_ACCESS_KEY
  from_file: {}
resources:
  memory: 256M
  cpu: '0.5'
volumes: []
backup:
  enabled: true
  frequency: daily
  retention: 30
