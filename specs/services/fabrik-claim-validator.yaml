id: fabrik-claim-validator
kind: service
template: python-api
domain: fabrik-claim-validator.vps1.ocoron.com
shape:
  kind: service
  is_public: true
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: false
  needs_database: true
  has_search_feature: false
expose:
  http: true
  internal_only: false
source:
  type: template
  branch: main
depends:
  postgres: main
infrastructure:
  database: local
  storage: local
  auth: none
env:
  PORT: ${PORT:-8000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
secrets:
  required: []
  generate: []
  from_env: []
  from_file: {}
resources:
  memory: 512M
  cpu: '0.5'
health:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
  disabled: false
volumes: []
backup:
  enabled: true
  frequency: daily
  retention: 30
