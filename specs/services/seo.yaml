id: seo
kind: service
template: python-api
domain: seo.vps1.ocoron.com

# Project-shape descriptor — fabrik apply reads this to decide which registrars run.
# Declared by the service owner (/opt/seo AI, 2026-08-02); grounded against the code.
shape:
  kind: service
  is_public: false            # internal API (INTERNAL_API_TOKEN); no public Gatus health monitor
  is_admin_dashboard: false   # no HTML admin UI, no Authelia
  has_bearer_api: false       # INTERNAL_API_TOKEN is app-level, not behind Authelia
  has_persistent_data: false  # all state in postgres-main::seo, backed up there
  needs_database: true        # uses postgres-main::seo (depends.postgres: seo)
  needs_cache: false          # no Redis
  has_search_feature: false   # no Meilisearch index
  exposes_metrics: true       # GET /metrics (src/seo/main.py:68) → Prometheus scrape job
  uses_claude_cli: true       # shells out to claude -p (subscription); deployer requires the host's
                              # rotated ~/.claude:ro mount in the compose — rotation-aware, no static token
  claude_cli_home: /home/appuser  # seo container runs USER appuser (Dockerfile) → ~/.claude = /home/appuser/.claude

source:
  type: local
  path: /opt/seo

env:
  PORT: "8016"
  LOG_LEVEL: INFO
  DATAFORSEO_AUTOCOMPLETE_CLIENT: gws-wiz-serp
  AUTOCOMPLETE_CACHE_TTL_DAYS: "30"
  SERP_CACHE_TTL_DAYS: "14"
  MAX_AUTOCOMPLETE_PATTERNS: "20"
  MAX_KEYWORD_NODES: "500"
  MAX_SERP_TARGETS: "30"
  PROVIDER_TIMEOUT_SECONDS: "30"
  PROVIDER_MAX_RETRIES: "1"
  # Kilo proxy retired — direct OpenRouter (legacy KILO_* names kept)
  KILO_API_URL: https://openrouter.ai/api/v1/chat/completions
  LLM_DEFAULT_MODEL: deepseek/deepseek-v3.2
  # claude CLI baked into the seo image (Dockerfile: @anthropic-ai/claude-code on Node 22); use the
  # subscription path per the ai/00 ladder — claude -p primary, OpenRouter fallback (KILO_API_URL/
  # LLM_DEFAULT_MODEL above stay for that fallback). Implement via the fabrik-lib `llm-dispatch` module.
  # AUTH = the host's ROTATED ~/.claude mounted read-only into the container — enforced by
  # shape.uses_claude_cli above (deployer requires the mount) — NOT a static CLAUDE_CODE_OAUTH_TOKEN.
  LLM_BACKEND: claude-cli
  LLM_DAILY_USD_CAP: "5.0"
  COST_WAL_PATH: .tmp/cost_wal.sqlite
  MENTION_PROBE_RUNS: "3"

secrets:
  required:
    - DATABASE_URL
    - INTERNAL_API_TOKEN
    - DATAFORSEO_USERNAME
    - DATAFORSEO_PASSWORD
    - KILO_API_KEY
    - DNS_MANAGER_TOKEN   # X-API-Key for site-provisioner GSC endpoints
    - COST_LEDGER_DSN     # point at fabrik_analytics for the PORTFOLIO-wide cost ledger;
                          # empty = project-local fallback table (per-project view only)
  # NOTE: claude -p auth is NOT a secret here — it is the host's rotated ~/.claude mounted read-only
  # into the container (see the LLM_BACKEND note above + drivers/watchdog.py). No static OAuth token.

depends:
  postgres: seo

resources:
  limits:
    memory: 1G
    cpus: "1.0"

health:
  path: /health
  port: 8016
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s
