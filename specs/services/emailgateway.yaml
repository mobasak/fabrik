id: emailgateway
kind: service
template: node-api
domain: emailgateway.vps1.ocoron.com

source:
  type: local
  path: /opt/emailgateway

env:
  NODE_ENV: production
  PORT: "18017"
  LOG_LEVEL: INFO

secrets:
  required:
    - RESEND_API_KEY
    - AWS_SES_ACCESS_KEY
    - AWS_SES_SECRET_KEY

resources:
  limits:
    memory: 512M
    cpus: "0.5"

health:
  path: /health
  port: 18017
