id: tryton-crm
kind: service
template: python-api
domain: tryton-crm.vps1.ocoron.com
# ⚠ STACK SPEC (2026-08-09): the repo compose deploys THREE services — tryton-crm (bridge) +
# trytond (local Dockerfile.trytond) + trytond-worker — and the deployer runs that compose as-is
# (`docker compose up -d --wait` in /opt/tryton-crm). The shape below describes the STACK, so the
# DB/backup triggers live HERE. specs/services/trytond.yaml.superseded is the old Phase-A skeleton
# (upstream image, pre-compose) — kept for history, no longer applyable.
shape:
  kind: service
  is_public: true             # SaaS front door: trytond serves tenant subdomains via the compose's
                              # HostRegexp(*.tojlo.com) router (certresolver=cloudflare, wildcard TLS).
                              # Tenant self-service login = public by design (re-spec 2026-08-09,
                              # requested by the project AI pre-launch).
  is_admin_dashboard: false   # NO Authelia — it would block tenant self-service login entirely
  has_bearer_api: false       # X-Internal-Token M2M, not a public bearer API
  has_persistent_data: true   # trytond-filestore volume + Tryton = multitenant CRM system-of-record → Backrest
  needs_database: true        # the STACK needs postgres-main::tryton (trytond + worker); the bridge itself stays DB-free (Decision F-DB — no psycopg/sqlalchemy/asyncpg in src/, re-verified 2026-08-09)
  has_search_feature: false
  needs_cache: true           # pause_state.py uses Redis (default redis-main:6379/0 — registrar must assign a proper index; shared db0 = key-collision risk)
  exposes_metrics: true       # GET /metrics now live (src/tryton_crm/main.py:53, direct route) → Prometheus scrape job
expose:
  http: true
  internal_only: true         # fabrik-net DNS only (tryton-crm:8000); TI + Tojlo call it internally
source:
  type: git
  repository: git@github.com:mobasak/tryton-crm.git
  branch: mobasak/tryton-crm
depends:
  postgres: tryton            # registrar creates the shared `tryton` DB + role, injects DATABASE_URL
infrastructure:
  database: local
  storage: local
  auth: none
env:
  PORT: ${PORT:-8000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Operative bridge envs (grounded vs src/ getenv reads + .env.example, 2026-08-09). fabrik apply
  # builds .env from THIS block + secrets only — project .env.example never rides along
  # (_build_env_content merge). Code defaults exist for most; declared here so the deploy is explicit.
  ENVIRONMENT: production
  SERVICE_NAME: tryton-crm
  RATE_LIMIT_PER_MIN: "600"
  TRYTOND_XMLRPC_URL: http://trytond:8000/tryton/rpc/   # compose service DNS on the fabrik net
  TRYTOND_RPC_USER: admin
  TRYTOND_CONNECT_TIMEOUT: "30"
  PROTEUS_RETRY_ATTEMPTS: "2"
  PROTEUS_RETRY_BACKOFF_MS: "200"
  EXPOSE_AMOUNTS_TO_CUSTOMER: "false"
  CONFIDENCE_DRAFT_GATE: "0.5"
  # NOT declared (project-side deploy decisions, optional features with fail-soft paths):
  # GOTENBERG_URL (compose now carries a gotenberg service — container DNS gotenberg:3000 matches
  # the code default, nothing to declare), EFATURA_* (e-invoice provider — unconfigured),
  # REDIS_URL (registrar-injected via needs_cache), TRYTOND_EMAIL__URI (SMTP — off until set).
  # ── trytond + worker (same stack .env; compose env_file: .env on all three) ──
  TRYTON_DB: tryton
  TRYTOND_ADMIN_EMAIL: admin@ocoron.com
  COMPANY_NAME: Ocoron
  COMPANY_CURRENCY: EUR
  # HARD-REQUIRED by compose (`${TRYTOND_DATABASE_URI:?}`). Placeholder satisfies the first
  # `docker compose up`; the postgres registrar injects the real DATABASE_URL post-provision —
  # ⚠ BUT under the DATABASE_URL key, not this one. REMAINING PROJECT-SIDE ITEM before first
  # apply: the trytond entrypoint must derive TRYTOND_DATABASE_URI from DATABASE_URL (or ops
  # sets it once post-apply). Placeholder-aware merge means a re-apply never clobbers the real value.
  TRYTOND_DATABASE_URI: "postgresql://placeholder:placeholder@postgres-main:5432/placeholder"
secrets:
  required: []
  generate:
  - X_INTERNAL_TOKEN          # fabrik mints the bridge M2M token (never hand-delivered)
  - TRYTOND_ADMIN_PASSWORD    # Tryton admin bootstrap credential — minted, never hand-set
  from_env:
  - SERVICE_INTERNAL_SECRET_KEY   # bridge accepts TI's shared token too (X-Internal-Token == either)
  - CONSUMER_TOKENS               # per-consumer M2M token JSON (trade-intelligence, whatsapp-agent) — token material, never a plain env
  - TRYTOND_RPC_PASSWORD          # proteus RPC credential for the bridge→trytond calls
  from_file: {}
resources:
  memory: 512M
  cpu: '0.5'
  # ⚠ trytond MUST stay single-worker (project-measured 2026-08-09: 11 passed @ 1 worker,
  # 4 failed @ 3 — per-process _get_companies_cache breaks company-rule coherence).
  # NO capacity-tuning pass may add gunicorn workers to the trytond service.
health:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
  disabled: false
volumes: []
companion_services: []
backup:
  enabled: true
  frequency: daily
  retention: 30
watchdog:
  enabled: false
  daily_budget_usd: 1.0
  daily_invocations_cap: 200
  auto_tier_b: false
  escalation_channel: apprise
  llm_provider_primary: claude-code
  llm_provider_fallback: openrouter
  cheap_model: haiku
  expensive_model: sonnet
  per_incident_budget_usd: 0.5
  deadman_timeout_seconds: 300
  external_docs_enabled: true
  propose_fix_prs: false
  auto_code_fix: false
  code_fix_window_sec: 1800
  critical_paths: []
  trigger_sources: []
