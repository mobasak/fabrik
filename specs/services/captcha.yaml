id: captcha
kind: service
template: python-api
domain: captcha.vps1.ocoron.com
shape:
  kind: service
  is_public: true
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: false
  needs_database: false
  has_search_feature: false
  needs_cache: false
  exposes_metrics: false
expose:
  http: true
  internal_only: false
source:
  type: git
  repository: git@github.com:mobasak/captcha.git
  branch: main
depends: {}
infrastructure:
  database: local
  storage: local
  auth: none
env:
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-8000}
  DEFAULT_TIMEOUT: ${DEFAULT_TIMEOUT:-180}
  POLL_INTERVAL: ${POLL_INTERVAL:-3}
  APP_GIT_SHA: ${GIT_SHA:-unknown}
secrets:
  required: []
  generate: []
  from_env:
  - ANTICAPTCHA_API_KEY
  from_file: {}
resources:
  memory: 512M
  cpu: '0.5'
health:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
  disabled: false
volumes: []
companion_services: []
backup:
  enabled: true
  frequency: daily
  retention: 30
watchdog:
  enabled: false
  daily_budget_usd: 1.0
  daily_invocations_cap: 200
  auto_tier_b: false
  escalation_channel: apprise
  llm_provider_primary: claude-code
  llm_provider_fallback: openrouter
  cheap_model: haiku
  expensive_model: sonnet
  per_incident_budget_usd: 0.5
  deadman_timeout_seconds: 300
  external_docs_enabled: true
  propose_fix_prs: false
  auto_code_fix: false
  code_fix_window_sec: 1800
  critical_paths: []
  trigger_sources: []
