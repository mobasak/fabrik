id: fabrik-proxy
kind: service
template: python-api
domain: proxy.vps1.ocoron.com

# Project-shape descriptor (Phase 4k). Drives InfrastructureProvisioner.
# fabrik-proxy is the central Webshare.io proxy broker used by every scraper
# project (youtube-pipeline, etc.). It fronts a Postgres database on
# postgres-main (proxy_management) and exposes a JSON API on :8000 inside
# the `coolify` Docker network via container_name `proxy`. Public Traefik
# route is declared in the repo's compose.yaml (proxy.vps1.ocoron.com),
# Coolify does not manage fqdn for dockercompose apps.
shape:
  kind: service
  is_public: true                # → Gatus endpoint for /health
  is_admin_dashboard: true       # matches live Authelia rule for proxy.vps1.ocoron.com (admin UI)
  has_bearer_api: false          # no bearer auth layer at the app
  has_persistent_data: false     # DB on postgres-main, backed up separately
  needs_database: true           # uses postgres-main::proxy_management
  has_search_feature: false

# Git-sourced dockercompose app. Coolify ignores our rendered compose for this
# build_pack and always uses the repo's /compose.yaml — which pins the
# container_name `proxy` (internal DNS) and the Traefik labels for the
# public route. fabrik apply here is effectively: env-var sync + shape-gated
# registrars + git pull + rebuild.
source:
  type: git
  repository: git@github.com:mobasak/proxy.git
  branch: main

coolify:
  project: fabrik-services
  server: localhost

# Registrar overrides. `needs_database: true` above is TRUE (we use a DB),
# but the DB `proxy_management` was provisioned out-of-band 2025-10-29 with
# a dedicated user `ozgur`. The postgres registrar would create a second,
# orphan DB named `fabrik_proxy` with fabrik-admin creds that the app never
# touches. Explicitly skip it — this is the documented `infra: <key>: false`
# escape hatch (see src/fabrik/spec_loader.py `Shape` docstring + DEPLOYMENT.md §9.2).
infra:
  postgres: false

# Non-secret runtime config. DB connection uses the shared postgres-main
# container on the `coolify` network; DB_USER/DB_PASSWORD come from secrets.
env:
  DB_HOST: "postgres-main"
  DB_PORT: "5432"
  DB_NAME: "proxy_management"
  LOG_LEVEL: "INFO"
  APP_ENV: "production"

secrets:
  # DB_USER / DB_PASSWORD are proxy-specific (DB user `ozgur` on the shared
  # proxy_management DB, created 2025-10-29). They do NOT match the
  # fabrik-admin DB_USER/DB_PASSWORD in /opt/fabrik/.env, so they are
  # declared `required` and passed via `-s KEY=VALUE` at apply time, not
  # pulled `from_env`. This avoids cross-contamination with the fabrik
  # admin credentials. Values verified against live Coolify snapshot
  # (.tmp/proxy-snapshot.json, 2026-04-23).
  required:
    - DB_USER
    - DB_PASSWORD
  from_env:
    - WEBSHARE_API_KEY
    - APIFY_API_TOKEN

resources:
  memory: 512M
  cpu: "0.5"

health:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
