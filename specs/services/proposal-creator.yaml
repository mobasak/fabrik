id: proposal-creator
kind: service
template: python-api
domain: proposals.vps1.ocoron.com

source:
  type: local
  path: /opt/proposal-creator

# shape: python-api defaults plus needs_database — the app is PostgreSQL-backed
# (/opt/proposal-creator/src/db/database.py reads DATABASE_URL; SQLite as the fallback — and that
# fallback is UNCONDITIONAL in the app's code, so a container whose DATABASE_URL never arrived
# would run on an in-container SQLite file: the production fail-fast belongs in the project and is
# requested from it by mail, D-441; here the registrar is what delivers the DSN). The registrar
# creates the database named by depends.postgres and injects
# DATABASE_URL, so the key left secrets.required (a required DSN is INVENTED when absent —
# orchestrator/__init__.py _warn_fabricated_secrets). Disposition of apply's
# depends-contradiction warning (D-805): D-822.
shape:
  kind: service
  is_public: true
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: false
  needs_database: true
  has_search_feature: false
  needs_cache: false
  exposes_metrics: false

env:
  PORT: "8015"
  LOG_LEVEL: INFO

secrets:
  required:
    - KILO_API_KEY

depends:
  # The registrar's derived name (D-410) — and the name the project's own .env.example
  # DATABASE_URL carries, which check_spec_db_match.py compares against.
  postgres: proposal_creator

resources:
  limits:
    memory: 1G
    cpus: "1.0"

health:
  path: /health
  port: 8015
