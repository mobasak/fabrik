# ARM64: ✓ SUPPORTED — linux/amd64, linux/arm64

name: apprise
type: docker
domain: notify.vps1.ocoron.com
image: caronc/apprise:latest
# No host port: Traefik routes notify.vps1.ocoron.com to the container's internal
# 8000 over the fabrik network, and alerting exec's curl inside the container
# (libs/alerting/apprise.py). A published host port was never deployed and nothing needs one.
networks:
  - fabrik
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8000/"]  # Internal port
  interval: 30s
  timeout: 10s
  retries: 3
