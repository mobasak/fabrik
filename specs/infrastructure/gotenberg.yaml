# ARM64: ✓ SUPPORTED — linux/amd64, linux/386, linux/ppc64le, linux/arm64, linux/arm/v7

name: gotenberg
type: docker
domain: pdf.vps1.ocoron.com
image: gotenberg/gotenberg:8
environment:
  CHROMIUM_DISABLE_JAVASCRIPT: "false"
  CHROMIUM_ALLOW_LIST: "file:///tmp/.*"
ports:
  - "3003:3000"
networks:
  - coolify
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
  interval: 30s
  timeout: 10s
  retries: 3
