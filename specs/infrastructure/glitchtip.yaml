# GlitchTip — Sentry-compatible error tracking at errors.vps1.ocoron.com.
# It is the error-tracker SOURCE the AI watchdog's error-tracker trigger consumes
# (see .windsurf/rules/core/60-watchdog.md + docs/development/plans/
# 2026-06-29-plan-watchdog-deploy-side.md). org=ocoron, team=vps1.
#
# ── DECLARATION OF AN EXISTING DEPLOYMENT (added 2026-06-29) ──────────────────
# GlitchTip already runs on vps1 from a hand-maintained /opt/glitchtip/compose.yaml
# (glitchtip-web + glitchtip-worker, up 4+ weeks, live error data in the
# postgres-main `glitchtip` DB). This spec mirrors that live compose to bring it
# under Fabrik's declarative management — it was previously undeclared in specs/.
#
# ⚠️ DO NOT `fabrik apply specs/infrastructure/glitchtip.yaml` until the service
# .env on the VPS carries the EXISTING live values for GLITCHTIP_SECRET_KEY,
# GLITCHTIP_REDIS_URL, and POSTGRES_PASSWORD. A changed SECRET_KEY invalidates all
# sessions; a wrong DATABASE_URL/REDIS_URL detaches the live error history. Diff
# against /opt/glitchtip/compose.yaml before any apply. This file only DECLARES;
# `fabrik apply` is targeted/explicit and does not run on this spec automatically.
#
# Required env (service .env): GLITCHTIP_SECRET_KEY, GLITCHTIP_REDIS_URL,
# POSTGRES_PASSWORD (shared postgres-main superuser password).

services:
  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres-main:5432/glitchtip  # noqa: env-var interpolation
      REDIS_URL: ${GLITCHTIP_REDIS_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
    networks:
      - fabrik
    labels:
      - traefik.enable=true
      - traefik.docker.network=fabrik
      - traefik.http.routers.glitchtip-web.rule=Host(`errors.vps1.ocoron.com`)
      - traefik.http.routers.glitchtip-web.entrypoints=websecure
      - traefik.http.routers.glitchtip-web.tls=true
      - traefik.http.routers.glitchtip-web.tls.certresolver=letsencrypt
      - traefik.http.routers.glitchtip-web.middlewares=authelia-forward@docker
      - traefik.http.services.glitchtip-web.loadbalancer.server.port=8000
    # NOTE: the live compose also binds 10.99.0.1:8000:8000 (internal-IP host
    # port). Omitted here — Traefik already routes errors.vps1 via the fabrik
    # network, and direct host binds are discouraged by the Fabrik port invariant.
    # Re-add only if something reaches GlitchTip on 10.99.0.1:8000 directly.
    deploy:
      resources:
        limits:
          memory: 512M

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-worker
    restart: unless-stopped
    command: ["./bin/run-celery-with-beat.sh"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres-main:5432/glitchtip  # noqa: env-var interpolation
      REDIS_URL: ${GLITCHTIP_REDIS_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      CELERY_WORKER_CONCURRENCY: "2"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    networks:
      - fabrik
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  fabrik:
    external: true
