# Observability Stack — deployed via SSH + Docker Compose (`fabrik apply`)
# Config files are copied to the VPS at deploy time by the SSH deployer.
# All services on shared 'fabrik' Docker network for inter-service communication.
# Grafana exposed externally via Traefik at monitor.vps1.ocoron.com
# All other services internal-only.
#
# Deploy: `fabrik apply` SSHes to the VPS and runs `docker compose up -d` for this stack.
# Required env vars (written to the service `.env` on the VPS): GRAFANA_ADMIN_PASSWORD

services:
  loki:
    image: grafana/loki:3.4.2
    platform: linux/amd64
    container_name: loki
    restart: unless-stopped
    volumes:
      - /opt/monitoring/configs/loki:/etc/loki:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - fabrik
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:3.4.2
    platform: linux/amd64
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /opt/monitoring/configs/promtail:/etc/promtail:ro
      - promtail-positions:/run/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - fabrik
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    platform: linux/amd64
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - /opt/monitoring/configs/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - fabrik
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.28.1
    platform: linux/amd64
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - /opt/monitoring/configs/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager:9093'
    networks:
      - fabrik
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.9.1
    platform: linux/amd64
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - fabrik

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    platform: linux/amd64
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - fabrik

  grafana:
    image: grafana/grafana:11.6.1
    platform: linux/amd64
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://monitor.vps1.ocoron.com
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - fabrik
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`monitor.vps1.ocoron.com`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.middlewares=authelia-forward@docker
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  loki-data:
  promtail-positions:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  fabrik:
    external: true
