# ARM64: ✓ SUPPORTED — linux/amd64, linux/arm64
# n8n v1.0+ removed basic auth — first run opens setup wizard to create owner account

name: n8n
type: docker
domain: auto.vps1.ocoron.com
image: n8nio/n8n:latest
environment:
  N8N_HOST: auto.vps1.ocoron.com
  N8N_PROTOCOL: https
  WEBHOOK_URL: https://auto.vps1.ocoron.com
  GENERIC_TIMEZONE: Europe/Istanbul
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  # Disable telemetry / diagnostics
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
volumes:
  - n8n-data:/home/node/.n8n
ports:
  - "5678:5678"
networks:
  - coolify
restart: unless-stopped
healthcheck:
  test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
  interval: 30s
  timeout: 10s
  retries: 3
