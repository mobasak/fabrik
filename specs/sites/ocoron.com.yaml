# ─────────────────────────────────────────────────────────────────────────────
# BLOG
# ─────────────────────────────────────────────────────────────────────────────

blog:
  enabled: true
  index_page: insights
  categories:
    - name: Updates
      name_tr: Güncellemeler
      slug: updates
    - name: Technical
      name_tr: Teknik
      slug: technical
    - name: Industry
      name_tr: Sektör
      slug: industry
  posts_per_page: 10
  show_author: true
  show_date: true

# ─────────────────────────────────────────────────────────────────────────────
# CONTACT
# ─────────────────────────────────────────────────────────────────────────────

contact:
  email: "contact@ocoron.com"
  phone: ""                     # Optional
  address: ""                   # Optional

  social:
    linkedin: "https://www.linkedin.com/company/ocoron/"
    twitter: ""
    github: ""
    youtube: ""

  form:
    fields: [name, email, company, subject, message]
    recipient: "contact@ocoron.com"
    success_message: "Thank you for your message. We'll respond shortly."
    success_message_tr: "Mesajınız için teşekkürler. En kısa sürede yanıt vereceğiz."
    spam_protection: turnstile

# ─────────────────────────────────────────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────────────────────────────────────────

plugins:
  # Preset (company) includes: Rank Math Pro, GP Premium, Polylang Pro, Fluent Forms, etc.
  add:
    - autopoly-ai-translation-polylang   # AutoPoly Pro (DeepL-driven; see languages.autopoly)
    - searchwp-polylang         # Polylang ↔ SearchWP bridge (golden-base multilingual trio)
    - thrive-architect          # Page building (you have license)
    - thrive-leads              # Lead capture (you have license)
    - essential-grid            # Gallery (you have license)
    - fluentcrm-pro             # CRM
    - complianz-pro             # GDPR
    - chaty-pro                 # Multi-channel chat

  skip: []

  config:
    rank-math:
      sitemap: true
      schema: organization

# ─────────────────────────────────────────────────────────────────────────────
# THEME
# ─────────────────────────────────────────────────────────────────────────────

theme:
  name: generatepress
  child: true

  generatepress:
    container_width: 1200
    header_layout: default
    sidebar: none               # Full-width for company site

  custom_css: ""

# ─────────────────────────────────────────────────────────────────────────────
# SEO
# ─────────────────────────────────────────────────────────────────────────────

seo:
  title_separator: "|"
  homepage_title: "Ocoron | Government Incentives & Business Consultancy"
  homepage_title_tr: "Ocoron | Devlet Teşvikleri ve İş Danışmanlığı"
  homepage_description: "Expert consultancy in Government Incentives, Foreign Trade, AI Integration, and Manufacturing. KOSGEB, TUBITAK, Turquality programs, international expansion, and digital transformation."
  homepage_description_tr: "Devlet Teşvikleri, Dış Ticaret, AI Entegrasyonu ve Üretim alanlarında uzman danışmanlık. KOSGEB, TÜBİTAK, Turquality programları, uluslararası genişleme ve dijital dönüşüm."

  schema:
    type: Organization
    name: Ocoron
    logo: "https://ocoron.com/wp-content/uploads/logo.svg"

  analytics:
    google_analytics: "G-VK6FMQRVRL"
    google_tag_manager: ""
    facebook_pixel: ""

  verification:
    google: ""
    bing: ""

# ─────────────────────────────────────────────────────────────────────────────
# CONTENT SOURCE
# ─────────────────────────────────────────────────────────────────────────────

content:
  source: manual                # You provide content, or change to ai_draft

  ai_config:
    model: claude
    tone: professional
    review_required: true

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT
# ─────────────────────────────────────────────────────────────────────────────

  backup:
    frequency: daily
    retention_days: 30
    destination: r2

# ─────────────────────────────────────────────────────────────────────────────
# METADATA
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  created: "2025-12-24"
  updated: "2025-12-24"
  status: ready                 # draft | ready | deployed
  notes: |
    Completed:
    - [x] Brand: logo files, colors, tagline
    - [x] Content: homepage headline, features
    - [x] Services: 8 service categories defined
    - [x] Contact: email, LinkedIn
    - [x] SEO: title, description, GA4 ID

    Optional before deployment:
    - [ ] About page content (company story)
    - [ ] Phone number / address (if desired)
    - [ ] Additional social links
