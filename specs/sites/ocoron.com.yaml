# Site Specification: ocoron.com
# Status: READY
# Created: 2025-12-24

# ─────────────────────────────────────────────────────────────────────────────
# BASIC INFORMATION
# ─────────────────────────────────────────────────────────────────────────────

id: ocoron-com
site:
  domain: ocoron.com
preset: company
environment: production
deployment:
  vps_ip: "172.93.160.197"

# ─────────────────────────────────────────────────────────────────────────────
# BRAND IDENTITY
# ─────────────────────────────────────────────────────────────────────────────

brand:
  name: "Ocoron"
  tagline: "Professional Services"
  tagline_tr: "Profesyonel Hizmetler"

  logo:
    primary: "ocoron.com-media/logo.svg"
    light: "ocoron.com-media/logo_inverted.jpg"
    icon: "ocoron.com-media/logo_single_letter.jpg"
    favicon: "ocoron.com-media/Favicon/favicon.ico"
    og_image: "ocoron.com-media/logo-1200-x-630.jpg"

  colors:
    primary: "#1e3a5f"          # Deep ocean blue (from art)
    secondary: "#0891b2"        # Cyan/teal (luminous)
    accent: "#ea580c"           # Warm orange (energy, action)
    background: "#ffffff"
    text: "#1e3a5f"
    text_light: "#64748b"

  fonts:
    heading: "Inter"
    body: "Inter"
    source: google

# ─────────────────────────────────────────────────────────────────────────────
# LANGUAGES & LOCALIZATION
# ─────────────────────────────────────────────────────────────────────────────

languages:
  primary: en_US
  additional: [tr_TR]
  plugin: polylang              # Polylang Pro (per 62-wordpress.md)
  autopoly:
    provider: deepl                    # built into AutoPoly Pro; no middleware
    deepl_api_key_env: DEEPL_API_KEY   # spec references env var; never the value
    auto_translate_on_publish: true

timezone: "Europe/Istanbul"
date_format: "Y-m-d"

# ─────────────────────────────────────────────────────────────────────────────
# SITE STRUCTURE
# ─────────────────────────────────────────────────────────────────────────────

pages:
  # ── HOMEPAGE ──────────────────────────────────────────────────────────────
  - slug: ""
    title: "Home"
    title_tr: "Ana Sayfa"
    template: full-width
    show_in_menu: false
    sections:
      - type: hero
        headline: "Strategic Consulting for Growing Businesses"
        headline_tr: "Büyüyen İşletmeler için Stratejik Danışmanlık"
        subheadline: "Expert guidance in Quality Systems, AI Integration, Manufacturing, Logistics, and International Business Development"
        subheadline_tr: "Kalite Sistemleri, AI Entegrasyonu, Üretim, Lojistik ve Uluslararası İş Geliştirme alanlarında uzman rehberlik"
        cta_text: "Explore Services"
        cta_text_tr: "Hizmetleri Keşfet"
        cta_url: "/services"
        background: gradient

      - type: features
        headline: "How We Help"
        headline_tr: "Nasıl Yardımcı Oluyoruz"
        columns: 4
        items:
          - icon: landmark
            title: "Government Incentives"
            title_tr: "Devlet Teşvikleri"
            description: "KOSGEB, TUBITAK, Turquality programs"
            description_tr: "KOSGEB, TÜBİTAK, Turquality programları"
          - icon: globe
            title: "Global Trade"
            title_tr: "Küresel Ticaret"
            description: "International expansion and market entry"
            description_tr: "Uluslararası genişleme ve pazar girişi"
          - icon: brain
            title: "AI & Digital"
            title_tr: "AI ve Dijital"
            description: "Digital transformation and AI integration"
            description_tr: "Dijital dönüşüm ve AI entegrasyonu"
          - icon: factory
            title: "Manufacturing"
            title_tr: "Üretim"
            description: "Plant design, R&D, ERP implementation"
            description_tr: "Fabrika tasarımı, AR-GE, ERP uygulaması"

      - type: services_grid
        headline: "Our Services"
        headline_tr: "Hizmetlerimiz"
        # Links to service category pages

      - type: cta_banner
        headline: "Ready to transform your business?"
        headline_tr: "İşletmenizi dönüştürmeye hazır mısınız?"
        cta_text: "Get in Touch"
        cta_text_tr: "İletişime Geçin"
        cta_url: "/contact"

  # ── SERVICES (Main) ─────────────────────────────────────────────────────────
  - slug: services
    title: "Services"
    title_tr: "Hizmetler"
    template: default
    show_in_menu: true
    menu_order: 1
    sections:
      - type: text_block
        content: "We provide comprehensive consultancy services across multiple domains to help businesses grow, optimize operations, and achieve certifications."
        content_tr: "İşletmelerin büyümesine, operasyonlarını optimize etmesine ve sertifikalar almasına yardımcı olmak için birden fazla alanda kapsamlı danışmanlık hizmetleri sunuyoruz."
    children:
      # ── Investment Incentives (PRIORITY) ──
      - slug: investment-incentives
        title: "Investment Incentives & Government Support"
        title_tr: "Yatırım Teşvikleri ve Devlet Destekleri"
        sections:
          - type: service_list
            items:
              - "Trade Ministry Programs"
              - "KOSGEB Support Programs"
              - "TUBITAK R&D Grants"
              - "TEKNOPARK Applications"
              - "Turquality Program"

      # ── Foreign Trade & Business Development ──
      - slug: foreign-trade
        title: "Foreign Trade & Business Development"
        title_tr: "Dış Ticaret ve İş Geliştirme"
        sections:
          - type: service_list
            items:
              - "Foreign Trade Intelligence (Datamyne, ImportYeti, Panjiva, ImportGenius, Trademo, PIERS)"
              - "Market Access Research (Access2Markets, Global Trade Helpdesk, Export Potential Map)"
              - "Regulatory Monitoring (ePing, WTO Notifications, Technical Barriers)"
              - "Competitive Analysis (Dun & Bradstreet, Company Directories)"
              - "Market Entry & Customer Finding"
              - "US Incorporation Services"
              - "Trademark & DBA Services"

      # ── AI & Digital Transformation ──
      - slug: ai-consultancy
        title: "AI Consultancy"
        title_tr: "AI Danışmanlığı"
        sections:
          - type: service_list
            items:
              - "Digital Transformation Strategy"
              - "AI Implementation & Integration"
              - "Training & Change Management"
              - "Computer Vision Applications"

      # ── Manufacturing ──
      - slug: manufacturing
        title: "Manufacturing Consultancy"
        title_tr: "Üretim Danışmanlığı"
        sections:
          - type: service_list
            items:
              - "Production Plant Design"
              - "Industrial Solutions"
              - "Product Development (Cosmetics, Food, Supplements)"
              - "ERP Consultancy & Implementation"
              - "Private Label Production"

      # ── Logistics ──
      - slug: logistics
        title: "Logistics Services"
        title_tr: "Lojistik Hizmetleri"
        sections:
          - type: service_list
            items:
              - "Built-to-Suit Warehouse Design"
              - "Warehouse & Transportation Management Systems"
              - "Supply Chain Management & Optimization"

      # ── B2B Digital Marketing ──
      - slug: b2b-marketing
        title: "B2B Digital Marketing"
        title_tr: "B2B Dijital Pazarlama"
        sections:
          - type: service_list
            items:
              - "Targeted Email Campaigns"
              - "Telemarketing Campaigns"
              - "PPC Campaigns Worldwide"
              - "Business Website Creation"
              - "SEO & Content Writing"

      # ── Medical Device Procurement ──
      - slug: medical-procurement
        title: "Medical Device Procurement"
        title_tr: "Tıbbi Cihaz Tedariki"
        sections:
          - type: service_list
            items:
              - "Strategic Procurement Planning"
              - "Requirement Analysis"
              - "Tender Preparation"
              - "Supplier Relationship Management"

      # ── Quality Management Systems ──
      - slug: quality-management
        title: "Quality Management Systems"
        title_tr: "Kalite Yönetim Sistemleri"
        sections:
          - type: service_list
            items:
              - "ISO 9001 - Quality Management"
              - "ISO 13485 - Medical Devices QMS"
              - "ISO 17025 - Laboratory Competence"
              - "ISO 17020 - Inspection Bodies"
              - "ISO 17065 - Certification Bodies"

      # ── Company Registration & Compliance ──
      - slug: company-registration
        title: "Company Registration & Compliance"
        title_tr: "Şirket Kaydı ve Uygunluk"
        sections:
          - type: service_list
            items:
              - "Company Registration (Turkey)"
              - "Company Registration (International)"
              - "Business License Acquisition"
              - "Trade Registry Services"
              - "Tax Registration & Compliance"
              - "Chamber of Commerce Registration"

      # ── Virtual Office & Business Address ──
      - slug: virtual-office
        title: "Virtual Office & Business Address"
        title_tr: "Sanal Ofis ve İş Adresi"
        sections:
          - type: service_list
            items:
              - "Virtual Office Setup (Istanbul - Levent, Beşiktaş, Kağıthane, Maltepe)"
              - "Business Address Services"
              - "Mail Handling & Forwarding"
              - "Meeting Room Rentals"
              - "Company Address Change Services"

      # ── Technology Development Zone (Tekmer) Support ──
      - slug: tekmer-support
        title: "Technology Development Zone (Tekmer) Support"
        title_tr: "Teknoloji Geliştirme Bölgesi (Tekmer) Desteği"
        sections:
          - type: service_list
            items:
              - "Tekmer Application & Registration"
              - "R&D Tax Incentives (SSK Discounts, VAT Exemption)"
              - "Engineering Contract Preparation"
              - "Service Export Tax Benefits (50% Exemption)"
              - "Employee Support Programs (Stopaj Benefits)"

      # ── E-commerce Platform Integration ──
      - slug: ecommerce-integration
        title: "E-commerce Platform Integration"
        title_tr: "E-ticaret Platform Entegrasyonu"
        sections:
          - type: service_list
            items:
              - "Trendyol Integration & Setup"
              - "Product Photography Standards"
              - "Payment Terms Optimization"
              - "Platform Compliance"
              - "Multi-channel Sales Strategy"

      # ── Supplier Network & Sourcing ──
      - slug: supplier-network
        title: "Supplier Network & Sourcing"
        title_tr: "Tedarikçi Ağı ve Kaynak Bulma"
        sections:
          - type: service_list
            items:
              - "Supplement Manufacturer Sourcing (Turkey)"
              - "Product Sourcing & Vetting"
              - "Supply Chain Development"
              - "Quality Assurance for Suppliers"
              - "Private Label Manufacturing"

      # ── Global Sourcing & Procurement ──
      - slug: global-sourcing
        title: "Global Sourcing & Procurement"
        title_tr: "Küresel Kaynak Bulma ve Tedarik"
        sections:
          - type: service_list
            items:
              - "Alibaba.com Sourcing Strategy"
              - "Global Supplier Identification"
              - "Procurement Process Optimization"
              - "International Trade Facilitation"
              - "Cross-border Logistics Planning"

      # ── US Company Formation & Infrastructure ──
      - slug: us-company-formation
        title: "US Company Formation & Infrastructure"
        title_tr: "AB Şirket Kurulumu ve Altyapı"
        sections:
          - type: service_list
            items:
              - "US Company Registration (LLC)"
              - "EIN & ITIN Acquisition"
              - "DUNS Number Registration"
              - "US Phone & SMS Services"
              - "US Domain & Hosting Setup"
              - "US Bank Account Opening"
              - "Payment Processor Integration (Stripe, Shopify)"
              - "Online Store Setup"

  # ── ABOUT ─────────────────────────────────────────────────────────────────
  - slug: about
    title: "About"
    title_tr: "Hakkımızda"
    template: default
    show_in_menu: true
    menu_order: 3
    sections:
      - type: text_block
        content: ""             # TODO: Company story, mission, vision

  # ── INSIGHTS (BLOG) ───────────────────────────────────────────────────────
  - slug: insights
    title: "Insights"
    title_tr: "İçgörüler"
    template: blog-index
    show_in_menu: true
    menu_order: 4

  # ── CONTACT ───────────────────────────────────────────────────────────────
  - slug: contact
    title: "Contact"
    title_tr: "İletişim"
    template: default
    show_in_menu: true
    menu_order: 5
    sections:
      - type: contact_form
      - type: contact_info

  # ── LEGAL ─────────────────────────────────────────────────────────────────
  - slug: privacy-policy
    title: "Privacy Policy"
    title_tr: "Gizlilik Politikası"
    template: default
    show_in_menu: false

  - slug: terms
    title: "Terms of Service"
