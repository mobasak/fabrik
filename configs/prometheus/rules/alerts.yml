# Prometheus Alert Rules — Fabrik VPS
# Used by Alertmanager -> ARO Brain -> Apprise notification chain
# Alert names MUST match the handlers in ARO decision engine

groups:
  - name: container_health
    rules:
      - alert: ContainerDown
        expr: absent(container_last_seen{name!=""}) or (time() - container_last_seen{name!=""}) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} has not been seen for over 2 minutes."

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU ({{ printf \"%.1f\" $value }}%)"
          description: "Container {{ $labels.name }} CPU usage above 80% for 5 minutes."
          value: "{{ $value }}"

      # Watches containers that have an explicit `mem_limit:` / `deploy.resources.limits.memory`.
      # The `> 0` guard on the denominator skips containers with no limit, where cAdvisor
      # reports `container_spec_memory_limit_bytes = 0` and the division yields `+Inf`,
      # which would permanently exceed any threshold (root-cause of the 2026-04-19 spam).
      # For unlimited containers, see `ContainerMemoryHighOfHost` below.
      - alert: ContainerHighMemory
        expr: |
          100 * container_memory_usage_bytes{name!=""}
          / (container_spec_memory_limit_bytes{name!=""} > 0) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory ({{ printf \"%.1f\" $value }}%)"
          description: "Container {{ $labels.name }} memory usage above 85% of its configured limit for 5 minutes."
          value: "{{ $value }}"

      # Catches memory pressure from containers WITHOUT an explicit limit. Without this
      # rule they'd be invisible to ContainerHighMemory (the `> 0` guard above skips them).
      # Threshold is % of HOST memory, not of container limit.
      - alert: ContainerMemoryHighOfHost
        expr: |
          100 * container_memory_usage_bytes{name!=""}
          / on() group_left() node_memory_MemTotal_bytes > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} using {{ printf \"%.1f\" $value }}% of host memory"
          description: "Container {{ $labels.name }} (no memory limit) is using above 15% of VPS total memory for 10 minutes."
          value: "{{ $value }}"

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name!=""}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} was OOM killed"
          description: "Container {{ $labels.name }} experienced an OOM kill in the last 5 minutes."

      - alert: ContainerRestarting
        expr: increase(container_restart_count{name!=""}[15m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} restart loop"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in 15 minutes."
          value: "{{ $value }}"

  - name: host_health
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 85% for 10 minutes"
          description: "VPS CPU usage is {{ printf \"%.1f\" $value }}%."
          value: "{{ $value }}"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host memory above 90%"
          description: "VPS memory usage is {{ printf \"%.1f\" $value }}%."
          value: "{{ $value }}"

      - alert: HostDiskFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host disk above 85%"
          description: "VPS root disk usage is {{ printf \"%.1f\" $value }}%."
          value: "{{ $value }}"

  - name: service_health
    rules:
      - alert: ServiceUnhealthy
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} in job {{ $labels.job }} has been down for 2 minutes."

  # aro-wake SLI alerts (agent-sre framing per Gemini deep research doc).
  # Added 2026-06-06 alongside the /metrics endpoint on vps1.
  - name: aro_wake
    rules:
      - alert: AroWakeLowSuccessRate
        expr: |
          sum(rate(aro_wake_requests_total{status="success"}[10m])) by (host)
            / sum(rate(aro_wake_requests_total[10m])) by (host) < 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "aro-wake success rate < 90% on {{ $labels.host }} for 15m"
          description: "Claude calls from aro-wake on {{ $labels.host }} are failing >10% over the last 10m window. Check /var/log/aro-wake.log + Claude OAuth token freshness."

      - alert: AroWakeCostBurnHigh
        expr: sum(rate(aro_wake_cost_usd_total[1h])) by (host) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "aro-wake spending >$5/h on {{ $labels.host }}"
          description: "Runaway reasoning loop suspected — aro-wake on {{ $labels.host }} has been burning >$5/h Claude cost for the last 10m. Inspect actions log."
