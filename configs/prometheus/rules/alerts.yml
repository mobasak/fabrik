# Prometheus Alert Rules — Fabrik VPS
# Used by Alertmanager -> ARO Brain -> Apprise notification chain
# Alert names MUST match the handlers in ARO decision engine

groups:
  - name: container_health
    rules:
      - alert: ContainerDown
        expr: absent(container_last_seen{name!=""}) or (time() - container_last_seen{name!=""}) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} has not been seen for over 2 minutes."

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU ({{ printf \"%.1f\" $value }}%)"
          description: "Container {{ $labels.name }} CPU usage above 80% for 5 minutes."
          value: "{{ $value }}"

      # The cost a CPU cap imposes (D-1324 capped vps1; W-fc701b31): the share of CFS periods in
      # which the container was throttled, sustained 15 minutes (first possible fire at 16m — a 5m
      # rate needs two samples). The floor — more than 1 CFS period per second, i.e. runnable in at
      # least 10% of the default 100 ms periods — keeps an idle container's handful of periods from
      # making the ratio noise: on 7 days of vps1 data (2026-10-29) the rule fires 0 times with it
      # and once without (watchdog-test, 0.12 periods/s). By design it does NOT reach a short burst
      # or a low-duty worker (trytond-worker's 0.96 was a 5-minute peak below 1 period/s); a
      # throttled-volume floor or stall seconds were measured and miss it too. One alert per
      # container id (a recreated container briefly fires twice); the division matches on every
      # label, so a label mismatch between the two counters drops the series (cAdvisor emits one
      # label set per cgroup) — an `on(instance, name)` division would instead fail the whole
      # evaluation for a recreated container's two ids. Warning routes to aro-wake only, never a
      # human page (core/55-observability.md:520). Fix a firing one by raising the container's cap
      # in its compose and scripts/sysadmin/vps1_cpu_limits.py, not by loosening this rule.
      - alert: ContainerCPUThrottled
        expr: |
          rate(container_cpu_cfs_throttled_periods_total{name!=""}[5m])
          / rate(container_cpu_cfs_periods_total{name!=""}[5m]) > 0.25
          and on(instance, name) rate(container_cpu_cfs_periods_total{name!=""}[5m]) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU-throttled in {{ $value | humanizePercentage }} of periods"
          description: "Container {{ $labels.name }} was throttled in more than 25% of its CFS periods for 15 minutes while running at least 1 period per second — its CPU cap is too low for its load."
          value: "{{ $value }}"

      # Watches containers that have an explicit `mem_limit:` / `deploy.resources.limits.memory`.
      # The `> 0` guard on the denominator skips containers with no limit, where cAdvisor
      # reports `container_spec_memory_limit_bytes = 0` and the division yields `+Inf`,
      # which would permanently exceed any threshold (root-cause of the 2026-04-19 spam).
      # For unlimited containers, see `ContainerMemoryHighOfHost` below.
      # `for: 15m` (raised from 5m, 2026-07-08): at 5m this flapped ~38×/day on transient
      # allocation/GC spikes that a container recovers from on its own. A *sustained* 15-min
      # breach of 85% is a real leak/undersize worth waking on; a brief spike is not. The
      # 85% threshold + `> 0` guard are unchanged. (If a specific container sits >85% steadily
      # because its limit is genuinely too low, raise that limit in scripts/vps_apply_limits.sh
      # rather than desensitising the alert.)
      # The WORKING SET, not `container_memory_usage_bytes` (W-4801e4c3): usage includes page
      # cache, which the kernel reclaims before the limit bites, so on Prometheus (a cache-heavy
      # TSDB) usage read 66% of the limit while the working set read 47%, and usage crossed 85%
      # for ~54 h in one week with the working set never above it. The limit acts on the working
      # set, and the Grafana dashboards already graph it.
      - alert: ContainerHighMemory
        expr: |
          100 * container_memory_working_set_bytes{name!=""}
          / (container_spec_memory_limit_bytes{name!=""} > 0) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory ({{ printf \"%.1f\" $value }}%)"
          description: "Container {{ $labels.name }} working set above 85% of its configured limit for 15 minutes."
          value: "{{ $value }}"

      # Catches memory pressure from containers WITHOUT an explicit limit. Without this
      # rule they'd be invisible to ContainerHighMemory (the `> 0` guard above skips them);
      # a limited container is ContainerHighMemory's alone (the `unless`).
      # Threshold is % of the container's OWN host memory: `machine_memory_bytes` of the same
      # cAdvisor instance (hub and spokes each report their own). The old `on() group_left()
      # node_memory_MemTotal_bytes` errored on every evaluation once the spokes' node exporters
      # joined (three MemTotal series in one match group), so this rule never fired (W-4801e4c3).
      # A cAdvisor whose machine_memory_bytes is missing drops its containers here (fails open;
      # ServiceUnhealthy covers a down scrape).
      - alert: ContainerMemoryHighOfHost
        expr: |
          100 * container_memory_working_set_bytes{name!=""}
          / on(instance) group_left() machine_memory_bytes > 15
          unless on(instance, name) (container_spec_memory_limit_bytes{name!=""} > 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} using {{ printf \"%.1f\" $value }}% of host memory"
          description: "Container {{ $labels.name }} (no memory limit) is using above 15% of its host's total memory for 10 minutes."
          value: "{{ $value }}"

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name!=""}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} was OOM killed"
          description: "Container {{ $labels.name }} experienced an OOM kill in the last 5 minutes."

      - alert: ContainerRestarting
        expr: increase(container_restart_count{name!=""}[15m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} restart loop"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in 15 minutes."
          value: "{{ $value }}"

  - name: host_health
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 85% for 10 minutes"
          description: "VPS CPU usage is {{ printf \"%.1f\" $value }}%."
          value: "{{ $value }}"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host memory above 90%"
          description: "VPS memory usage is {{ printf \"%.1f\" $value }}%."
          value: "{{ $value }}"

      - alert: HostDiskFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host disk above 85%"
          description: "VPS root disk usage is {{ printf \"%.1f\" $value }}%."
          value: "{{ $value }}"

  - name: service_health
    rules:
      - alert: ServiceUnhealthy
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} in job {{ $labels.job }} has been down for 2 minutes."

  # aro-wake SLI alerts (agent-sre framing per Gemini deep research doc).
  # Added 2026-06-06 alongside the /metrics endpoint on vps1.
  - name: aro_wake
    rules:
      - alert: AroWakeLowSuccessRate
        # Denominator excludes `rate_limited` (we refused at the gate, Claude
        # didn't run — not a failure of the LLM path). Excluding it keeps the
        # SLI honest: ratio = (successful Claude calls) / (attempted Claude
        # calls), not (all received requests).
        # WINDOW SIZED TO THE TRAFFIC, not to a round number. Measured 2026-08-31:
        # ~1811 alertmanager wakes in 30d on vps1 = ~2.5/hour, and they arrive in
        # bursts (Alertmanager group_interval 5m / repeat_interval 30m). Over a 10m
        # window MOST evaluations therefore see ZERO requests, so numerator and
        # denominator are both 0, the ratio is NaN, `NaN < 0.90` is false, and the
        # `for: 15m` clock never even starts. That is why this alert stayed SILENT
        # through a 30-day stretch that was 74% failures (1344 fail / 467 success) —
        # a real outage the SLO was supposed to catch and structurally could not.
        # Fix: measure over 6h (so a burst is inside the window) and require a
        # MINIMUM VOLUME before judging a ratio, so the alert is meaningful rather
        # than merely non-NaN.
        expr: |
          (
            sum(increase(aro_wake_requests_total{status="success"}[6h])) by (host)
              / sum(increase(aro_wake_requests_total{status!="rate_limited"}[6h])) by (host) < 0.90
          )
          and
          sum(increase(aro_wake_requests_total{status!="rate_limited"}[6h])) by (host) >= 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "aro-wake success rate < 90% on {{ $labels.host }} for 15m"
          description: "Claude calls from aro-wake on {{ $labels.host }} are failing >10% over the last 10m window (rate-limited wakes excluded from denominator). Check /var/log/aro-wake.log + Claude OAuth token freshness."

      - alert: AroWakeCostBurnHigh
        expr: sum(rate(aro_wake_cost_usd_total[1h])) by (host) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "aro-wake spending >$5/h on {{ $labels.host }}"
          description: "Runaway reasoning loop suspected — aro-wake on {{ $labels.host }} has been burning >$5/h Claude cost for the last 10m. Inspect actions log."
