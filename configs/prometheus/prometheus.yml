global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
rule_files:
- /etc/prometheus/rules/*.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: node
  static_configs:
  - targets:
    - node-exporter:9100
- job_name: aro-wake
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - 10.0.1.1:8201
    labels:
      host: vps1
      role: hub
  - targets:
    - 10.99.0.2:8201
    labels:
      host: vps2
      role: spoke
  - targets:
    - 10.99.0.3:8201
    labels:
      host: vps3
      role: spoke
- job_name: cadvisor
  static_configs:
  - targets:
    - cadvisor:8080
    labels:
      host: vps1
      role: hub
# Federated spoke node-exporter (2026-06-17 — closes the
# "spoke sysadmins can't see fleet alerts" autonomy gap noted in
# docs/infrastructure/vps-ai-sysadmin.md:154).
- job_name: node-spokes
  static_configs:
  - targets:
    - 10.99.0.2:9100
    labels:
      host: vps2
      role: spoke
  - targets:
    - 10.99.0.3:9100
    labels:
      host: vps3
      role: spoke
- job_name: cadvisor-spokes
  static_configs:
  - targets:
    - 10.99.0.2:8080
    labels:
      host: vps2
      role: spoke
  - targets:
    - 10.99.0.3:8080
    labels:
      host: vps3
      role: spoke
- job_name: promtail-spokes
  metrics_path: /metrics
  static_configs:
  - targets:
    - 10.99.0.2:9080
    labels:
      host: vps2
      role: spoke
  - targets:
    - 10.99.0.3:9080
    labels:
      host: vps3
      role: spoke
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
- job_name: gatus
  static_configs:
  - targets:
    - gatus:8080
- job_name: fabrik-services
  scrape_interval: 30s
  metrics_path: /metrics
  scheme: https
  tls_config:
    insecure_skip_verify: false
  static_configs:
  - targets: null
- job_name: grafana
  static_configs:
  - targets:
    - grafana:3000
- job_name: authelia
  static_configs:
  - targets:
    - authelia:9959
- job_name: meilisearch
  authorization:
    type: Bearer
    credentials_file: /etc/prometheus/secrets/meilisearch-key
  static_configs:
  - targets:
    - meilisearch:7700
- job_name: postgres
  static_configs:
  - targets:
    - postgres-exporter:9187
- job_name: redis
  static_configs:
  - targets:
    - redis-exporter:9121
