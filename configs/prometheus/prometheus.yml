global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # aro-wake — per-host AI sysadmin SLI metrics (trio plan Phase 3 follow-up,
  # added 2026-06-06). Full fleet coverage: vps1 via docker-bridge (10.0.1.1),
  # spokes via wg0 mesh (10.99.0.2, 10.99.0.3). Cross-mesh container→host
  # NAT path verified 2026-06-06 — Prometheus container's outbound traffic
  # gets SNAT'd to vps1's wg0 IP (10.99.0.1), which the spokes' UFW rule
  # `from 10.99.0.0/24 to any port 8201 proto tcp` already allows.
  - job_name: aro-wake
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['10.0.1.1:8201']
        labels:
          host: vps1
          role: hub
      - targets: ['10.99.0.2:8201']
        labels:
          host: vps2
          role: spoke
      - targets: ['10.99.0.3:8201']
        labels:
          host: vps3
          role: spoke

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: netdata
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ['netdata:19999']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: gatus
    static_configs:
      - targets: ['gatus:8080']

  # Fabrik application services — expose /metrics via prometheus-client
  # Add services here as they implement business metrics
  # Scrape interval 30s (lower frequency than infra — business metrics are less time-sensitive)
  - job_name: fabrik-services
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: false
    static_configs:
      - targets:
        # Add service domains as they implement /metrics:
        # - proxy.vps1.ocoron.com
        # - captcha.vps1.ocoron.com
        # - translator.vps1.ocoron.com
        # (uncomment when /metrics is deployed to each service)
    # NOTE: X-Internal-Token is NOT required for /metrics — it is Authelia-bypassed
    # via the *.vps1.ocoron.com -> /metrics resource bypass rule in Authelia config

  # ─────────────────────────────────────────────────────────────────────────
  # Infrastructure services — application-level metrics (added 2026-05-08)
  # ─────────────────────────────────────────────────────────────────────────

  # Grafana — anonymous /metrics endpoint
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Authelia — telemetry on dedicated port 9959 (requires telemetry.metrics
  # enabled in /opt/authelia/config/configuration.yml)
  - job_name: authelia
    static_configs:
      - targets: ["authelia:9959"]

  # Meilisearch — /metrics requires Bearer auth + MEILI_EXPERIMENTAL_ENABLE_METRICS=true
  - job_name: meilisearch
    authorization:
      type: Bearer
      credentials: n7mjRrSipeqy8nWzadLZYarxiUqO35tW
    static_configs:
      - targets: ["meilisearch:7700"]

  # NOTE: GlitchTip is intentionally NOT scraped here.
  # GlitchTip ships without django-prometheus enabled — /metrics returns 404.
  # Container-level metrics come from cAdvisor; uptime from Gatus.
  # To add app-level scraping, install django-prometheus into the GlitchTip
  # container and expose /metrics via Django URL routing.

  # Database exporters (added 2026-05-08 — Gap #3)
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
