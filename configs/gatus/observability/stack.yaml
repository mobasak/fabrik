endpoints:
- name: grafana
  group: observability
  url: http://grafana:3000/api/health
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  - '[BODY].database == ok'
  alerts:
  - type: custom
    failure-threshold: 2
    send-on-resolved: true
- name: prometheus
  group: observability
  url: http://prometheus:9090/-/healthy
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: custom
    failure-threshold: 2
    send-on-resolved: true
- name: alertmanager
  group: observability
  url: http://alertmanager:9093/-/healthy
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: custom
    failure-threshold: 2
    send-on-resolved: true
- name: loki
  group: observability
  url: http://loki:3100/ready
  interval: 60s
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: custom
    failure-threshold: 2
    send-on-resolved: true
