# Alertmanager Configuration — Fabrik VPS
# Deployed: 2026-04-14
# Routes alerts to ARO Brain (future) and Apprise (fallback)

global:
  resolve_timeout: 5m

route:
  receiver: aro-brain
  group_by: ['alertname', 'container']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts — short repeat
    - match:
        severity: critical
      receiver: aro-brain
      repeat_interval: 30m

receivers:
  # Primary: ARO Brain webhook (future — will process via LLM)
  # Until ARO is deployed, this will 404 silently (Alertmanager retries gracefully)
  - name: aro-brain
    webhook_configs:
      - url: http://aro-brain:8017/api/alerts
        send_resolved: true
        max_alerts: 10

  # Fallback: Direct to Apprise for immediate notification
  - name: apprise-fallback
    webhook_configs:
      - url: http://apprise:8000/notify
        send_resolved: true

inhibit_rules:
  # If a node is down, suppress all container alerts on that node
  - source_match:
      alertname: NodeDown
    target_match_re:
      alertname: Container.*
    equal: ['instance']
