# Models tested in the translation v2 bake-off.
#
# Each entry: provider (route), model id, openrouter-route or direct-call hint,
# estimated cost per million tokens (informational).
#
# Selection rationale: includes (a) the mt-router TIER3 models (so we have
# measured scores for what the router actually picks), (b) the models the
# operator uses as Kilo Default / Code / Orchestrator (so the same model
# answering chat also has a translation score), (c) cheap-translator
# candidates from OpenRouter so we can compare cost/quality.

defaults:
  max_tokens: 600       # Translations are usually shorter than source × 1.3.
  temperature: 0.0      # Deterministic — translation should be reproducible.
  timeout_s: 60
  retry_max: 2

models:
  # ------- mt-router TIER3 winners (need scoring continuity) -------
  - id: deepseek/deepseek-v3.2
    route: openrouter
    role: mt-router TIER3 (TR/ES/EU/EN default)
    bakeoff_2026_05_26_avg: 79.3   # for reference; v2 will overwrite

  - id: google/gemini-2.5-flash
    route: openrouter
    role: mt-router TIER3 (ZH/KO/AR/HI)
    bakeoff_2026_05_26_avg: 76.9

  - id: x-ai/grok-4.3
    route: openrouter
    role: mt-router default LLM-with-context translator
    bakeoff_2026_05_26_avg: 80.6

  - id: mistralai/mistral-small-3.2-24b-instruct
    route: openrouter
    role: mt-router TIER3 (PT winner)
    bakeoff_2026_05_26_avg: 77.1

  # ------- operator's Kilo stack picks (must have translation scores) -------
  - id: z-ai/glm-5.2
    route: openrouter
    role: operator Kilo Default + Ask
    bakeoff_2026_05_26_avg: null   # NEW — not in v1

  - id: qwen/qwen3.7-max
    route: openrouter
    role: operator Kilo Code mode
    bakeoff_2026_05_26_avg: null

  - id: google/gemini-3.1-pro-preview
    route: openrouter
    role: operator Kilo Orchestrator
    bakeoff_2026_05_26_avg: null

  # ------- ultra-cheap candidates (for "is good-enough good enough?") -------
  - id: openai/gpt-oss-120b
    route: openrouter
    role: cheap baseline (open weights, fast)
    bakeoff_2026_05_26_avg: null

  - id: deepseek/deepseek-v4-flash
    route: openrouter
    role: cheap T2 flash
    bakeoff_2026_05_26_avg: null

  # ------- DashScope dedicated MT model (operator sweet-spot) -------
  - id: qwen/qwen-mt-turbo
    route: dashscope
    role: dedicated MT model (Alibaba); operator sweet-spot
    bakeoff_2026_05_26_avg: null

# Languages tested in v2 (12 vs v1's 5).
# v1 covered: tr es pt ja id
# v2 adds:    ar de fr hi ko zh it
# v2.1 adds:  bn ru ur — completes "top 10 most spoken" coverage:
#             EN (source) · ZH · HI · ES · FR · AR · BN · RU · PT · ID · UR
languages:
  # Top-10 most-spoken (after EN source): ZH HI ES FR AR BN RU PT ID UR
  - tr
  - es
  - pt
  - ja
  - id
  - ar
  - de
  - fr
  - hi
  - ko
  - zh
  - it
  - bn
  - ru
  - ur
  # Common European (added v2.2)
  - pl
  - nl
  - ro
  - el
  - uk
  - sv
  - cs
  - hu

# Operator's sweet-spot models for translation routing — track these
# separately for documentation purposes; the bake-off itself treats all
# models equally.
sweet_spots:
  - x-ai/grok-4.3              # v2.2 #2 (87.6); operator-tracked.
  - qwen/qwen-mt-turbo         # DashScope dedicated MT; wired 2026-06-29
                               # (qwen-mt-pro is a tier above turbo; same API surface).

# Hard cost ceiling for one bake. Operator must approve before this is exceeded.
# v2.1 realistic estimate: 11 sentences × 15 langs × 9 models × ~150 tokens
# in + 150 tokens out = ~4.5M total tokens. At mixed prices, $3-7.
budget_usd: 10.00
