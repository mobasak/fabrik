# Role configurations for the embedding selection pipeline.
#
# Mirrors the chat-side role_configs.yaml but with embedding-specific filters.
# Used by embedding_pre_filter.py → embedding_selector.py → embedding_role_mapper.py.
#
# Fields
# ------
# slots                 Number of priority slots to fill (P1..Pn).
# min_quality_tier      1=bulk, 2=mid, 3=frontier (cost-proxy until MIRACL
#                       scraper ships — see embedding_models_db.derive_quality_tier).
# min_context_window_k  Hard floor for context length (in thousands of tokens).
# require_multilingual  True → only is_multilingual=1 rows survive.
# require_code_tuned    True → only is_code_tuned=1 rows survive.
# allow_free            False → exclude :free / /free model IDs (rate-limited).
# stability_required    True → exclude preview/alpha/beta/experimental (is_ga=1 only).
# cost_axis             "input" → minimize input_cost_per_m within survivors.
# tie_break             "quality_desc" → highest quality_tier wins ties,
#                       then context_window_k DESC, then id ASC (deterministic).
# notes                 Free-form rationale stored in `embedding_roles.reason`.
#
# Quality > cost philosophy (FUTURE — needs MIRACL/MTEB scraper)
# --------------------------------------------------------------
# Embedding cost is dominated by storage + re-embedding, not per-token fees.
# Once benchmark scores ship, switch `cost_axis: input` → `cost_axis: quality`
# and add `max_input_cost_per_m` budget caps per role. For now, "cheapest above
# floors" is deterministic and produces sensible results given the floors.

roles:
  multilingual_primary:
    slots: 3
    min_quality_tier: 1
    min_context_window_k: 32
    require_multilingual: true
    require_code_tuned: false
    allow_free: false
    stability_required: true
    cost_axis: input
    tie_break: quality_desc
    notes: |
      Long-doc multilingual retrieval. ≥32k context lets us embed full
      Turkish news articles, English research papers, and multi-language
      chat transcripts without chunking. qwen3-embedding-8b is today's
      target winner per the user; the floors ensure we hit it.

  frontier_reference:
    slots: 2
    min_quality_tier: 3
    min_context_window_k: 8
    require_multilingual: false
    require_code_tuned: false
    allow_free: false
    stability_required: true
    cost_axis: input
    tie_break: quality_desc
    notes: |
      Highest-quality reference embedder for A/B comparisons, golden-set
      evaluation, and as a fallback when multilingual_primary breaks. Tier-3
      floor means cost-proxy >= $0.10/M, which today catches gemini-embedding,
      openai/text-embedding-3-large, etc.

  code_embedding:
    slots: 1
    min_quality_tier: 1
    min_context_window_k: 8
    require_multilingual: false
    require_code_tuned: true
    allow_free: false
    stability_required: true
    cost_axis: input
    tie_break: quality_desc
    notes: |
      Code-aware retrieval for the IDE-side semantic search use case.
      Today only mistralai/codestral-embed-2505 qualifies; the floor is
      written so this stays deterministic if more code embedders ship.
