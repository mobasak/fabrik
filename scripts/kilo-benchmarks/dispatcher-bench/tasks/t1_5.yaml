id: t1_5
category: 1
host: fixture
title: compose.yaml deploy invariants
accept: t1_5_accept.py
touches: ["compose.yaml"]
revert_red: false
prompt: |
  TICKET t1-5 — compose.yaml violates the platform deploy invariants

  Platform policy (enforced at deploy): (1) EVERY service declares
  deploy.resources.limits.memory — the VPS is shared and one unbounded container
  OOMs the box; (2) NO service binds host ports — all traffic is routed by the
  Traefik reverse proxy over the external `fabrik` network.

  Scope: bring compose.yaml into compliance. Give api 512M and worker 256M memory
  limits (beat already has one). Remove host port bindings; keep the Traefik labels
  and everything else intact.

  Touches: compose.yaml only.

  Acceptance criteria:
  - Every service has deploy.resources.limits.memory.
  - No `ports:` key anywhere.
  - Traefik labels, networks, env untouched.
