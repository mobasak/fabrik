id: t3_3
category: 3
host: fixture
title: Config key rename with deprecation shim
accept: t3_3_accept.py
touches: ["app/settings.py", "app/worker.py", "compose.yaml", "tests/*"]
revert_red: true
prompt: |
  TICKET t3-3 — Rename POLL_SECS to POLL_INTERVAL_SECONDS (with deprecation)

  The env var POLL_SECS is being renamed platform-wide to POLL_INTERVAL_SECONDS.

  Scope:
  1. app/settings.py: load() reads POLL_INTERVAL_SECONDS; the returned dict key
     becomes "poll_interval_seconds" (drop "poll_secs"). POLL_SECS remains
     honored as a fallback WITH a DeprecationWarning; when both are set the new
     name wins (no warning needed then).
  2. app/worker.py: Worker exposes self.poll_interval (int) read from the new
     config key.
  3. compose.yaml: the worker service's environment uses the new variable name.
  4. Tests under tests/ covering: new key, old-key fallback + warning, both-set
     precedence, worker attribute.

  Touches: app/settings.py, app/worker.py, compose.yaml, tests/.

  Acceptance criteria: all four behaviors tested and green; no POLL_SECS= left
  in compose.yaml; `pytest tests/ -q` green.
