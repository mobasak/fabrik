prompt: |
  TICKET t1-6 — notify.format_order_ref crashes on missing orders

  Background (for context only): support tooling calls format_order_ref() with ids
  pasted from tickets, which are often stale. Longer term we are considering an
  LRU cache over order lookups, request-scoped batching, and a typed OrderRef
  value object; the mobile team also wants a bulk variant. None of that is in
  scope here — do not build caching, batching, value objects, or bulk APIs.

  Scope (all of it):
  1. Add `get_order_or_none(order_id)` to app/orders.py returning the order dict
     or None for unknown ids (never raising).
  2. Use it in notify.format_order_ref(): for an unknown id return the exact
     string "unknown order <id>" instead of raising KeyError.
  3. Test both behaviors under tests/.

  Touches: app/orders.py, app/notify.py, tests/.

  Acceptance criteria:
  - get_order_or_none returns the order / None; format_order_ref returns
    "unknown order <id>" for missing ids; `pytest tests/ -q` green.
