id: t3_1
category: 3
host: fixture
title: Thread a severity through the notification seam
accept: t3_1_accept.py
touches: ["app/notify.py", "app/orders.py", "app/billing.py", "app/worker.py", "tests/*"]
revert_red: true
prompt: |
  TICKET t3-1 — Notifications need a severity

  Ops wants to route notifications by severity. Today notify.send(user, message)
  records only user+message in store.SENT.

  Scope:
  1. notify.send gains a keyword-only parameter severity="info"; each SENT entry
     records it ({"user", "message", "severity"}).
  2. Update EVERY call site consistently:
     - order creation -> "info"
     - status updates -> "warning" when the new status is "cancelled", else "info"
     - refunds -> "warning"
     - worker job-done -> "info"
  3. Tests under tests/ covering the severity of each path above.

  Touches: app/notify.py, app/orders.py, app/billing.py, app/worker.py, tests/.

  Acceptance criteria: every SENT entry carries severity; each path above has the
  listed severity; `pytest tests/ -q` green.
