prompt: |
  TICKET t1-2 — Add dismissal tracking to domscan_domains

  Operators want to dismiss domain candidates so they stop resurfacing in scans.

  Scope: add two columns to the existing `domscan_domains` table:
  - `dismissed` BOOLEAN NOT NULL with server_default false
  - `dismissed_at` TIMESTAMPTZ NULL

  Deliverables:
  1. One new Alembic migration in alembic/versions/ chaining from the CURRENT head
     (exactly one head after your change), following the house style of the existing
     migrations (op.add_column / op.drop_column, typed revision fields). Include a
     correct downgrade().
  2. Update db/schema.sql so the frozen schema matches (add both columns to the
     domscan_domains definition).

  Constraints:
  - OFFLINE artifacts only — do NOT connect to or run against any database.
  - Do not touch any other table, model, or API file.

  Touches: alembic/versions/ (one new file), db/schema.sql.
