id: t1_3
category: 1
host: fixture
title: Worker requeues in-flight job on SIGTERM
accept: t1_3_accept.py
touches: ["app/worker.py", "tests/*"]
revert_red: true
prompt: |
  TICKET t1-3 — Worker drops its in-flight job on SIGTERM

  During deploys the worker receives SIGTERM. Today Worker.handle_sigterm() clears
  self.current, so the job it was processing is lost forever (data loss confirmed
  in production: job vanished from the queue, never marked done).

  Scope: on SIGTERM the worker must RETURN its in-flight job to the FRONT of the
  queue (store.JOBS) with status reset to "pending", then stop. An idle worker
  (no current job) just stops. Cover the new behavior with tests under tests/.

  Touches: app/worker.py, tests/.

  Acceptance criteria:
  - In-flight job is back at store.JOBS[0] with status "pending" after handle_sigterm().
  - worker.stopping is True and worker.current is None afterwards.
  - Idle shutdown leaves the queue untouched.
  - `pytest tests/ -q` green.
