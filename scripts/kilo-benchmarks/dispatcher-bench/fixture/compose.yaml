services:
  api:
    image: orderflow-api:latest
    container_name: orderflow-api
    networks: [fabrik]
    ports:
      - "8016:8016"
    labels:
      - traefik.enable=true
      - traefik.http.routers.orderflow.rule=Host(`orderflow.vps1.ocoron.com`)
    environment:
      - PORT=8016
  worker:
    image: orderflow-worker:latest
    container_name: orderflow-worker
    networks: [fabrik]
    environment:
      - POLL_SECS=30
  beat:
    image: orderflow-worker:latest
    container_name: orderflow-beat
    command: ["python", "-m", "app.worker", "--beat"]
    networks: [fabrik]
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  fabrik:
    external: true
