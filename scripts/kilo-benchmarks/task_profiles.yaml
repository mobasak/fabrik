# Task profiles for llm_selector.select_llm()
#
# Pipelines reference profile NAMES, never model IDs. The selector resolves
# the profile to the cheapest live model that satisfies the floors and the
# request's input_tokens.
#
# Fields
# ------
# min_tier            1=bulk, 2=mid, 3=frontier (see migrate_selector_columns.py)
# cost_axis           "input"  → minimize input_cost_per_m (huge prompt, small answer)
#                     "output" → minimize output_cost_per_m (long generation)
# needs_vision        Profile inherently requires multimodal — selector filters
#                     by has_vision=1.
# allow_free          False → exclude :free / /free model IDs and $0-priced
#                     models (rate-limited, unsuitable for batch).
# stability_required  True  → exclude preview/alpha/beta/experimental
#                     (is_ga=1 only).

profiles:
  # Tier 1, input-axis. Tokenizer-style throughput: huge prompt, tiny answer.
  # Same shape as `extract`; named separately so pipelines doing token counting
  # / chunking / embedding-pre-flight can declare intent explicitly.
  tokenizer:
    min_tier: 1
    cost_axis: input
    needs_vision: false
    allow_free: false
    stability_required: true

  extract:
    min_tier: 1
    cost_axis: input
    needs_vision: false
    allow_free: false
    stability_required: true

  classify:
    min_tier: 1
    cost_axis: input
    needs_vision: false
    allow_free: false
    stability_required: true

  summarize:
    min_tier: 1
    cost_axis: input
    needs_vision: false
    allow_free: false
    stability_required: true

  # Same tier as extract/classify/summarize but documents the intent that the
  # input is exceptionally large (e.g. multi-document digest). Uses input-axis
  # to keep cost predictable on giant prompts.
  long_digest:
    min_tier: 1
    cost_axis: input
    needs_vision: false
    allow_free: false
    stability_required: true

  # Mid-tier; output-axis because synthesis writes long answers.
  synthesize:
    min_tier: 2
    cost_axis: output
    needs_vision: false
    allow_free: false
    stability_required: true

  # Frontier; output-axis because reasoning chains are output-heavy.
  reason:
    min_tier: 3
    cost_axis: output
    needs_vision: false
    allow_free: false
    stability_required: true
