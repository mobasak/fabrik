# Role-specific configurations.
#
# Selection mode: "cheapest_above_floors" — for each role, filter the shortlist
# to models meeting BOTH a quality floor (role's primary metric) AND a speed
# floor (output tokens/sec from artificialanalysis.ai). Among survivors, sort
# by total_cost ascending. P1 = cheapest qualified agent; P2..P5 = progressively
# more expensive fallbacks (still above floors).
#
# Rationale: user intent is "pay as low as possible without losing quality and
# speed." A strict Pareto frontier ranks by capability; here we invert — quality
# and speed are constraints, cost is the objective.
#
# Models lacking speed data (NULL) are EXCLUDED from selection. Add manual
# entries to cache/speed_overrides.json to bring them back.

selection_mode: cheapest_above_floors

roles:
  # ──── Coding (split by ticket complexity) ─────────────────────────────────
  # Tickets are classified at dispatch time by classify_ticket.py. Simple work
  # (renames, type hints, docstrings, single-file changes <100 lines) routes to
  # coding_simple; everything else and ambiguous tickets route to coding_complex.
  # Default-to-complex when uncertain — quality regressions cost more than
  # cost regressions.

  coding_simple:
    primary_metric: weighted_coding
    quality_floor: 75.0        # admits Qwen3.6 Plus (77.9), GLM 5 (77.0), Grok 4 (~78.7)
    speed_floor: 40.0
    # No tbench secondary floor — surface-level edits don't need terminal-bench
    # agentic ability, and most cheap models lack tbench data anyway.
    cost_cap: 5.00             # hard ceiling — simple work should never escalate to $30 Opus
    fleet_size: 5

  coding_complex:
    primary_metric: weighted_coding
    quality_floor: 85.0        # only top-tier coders: Gemini Pro (93.9), GPT-5.4 (89.3), GPT-5.3-Codex (88.7), Opus (86.9)
    speed_floor: 40.0
    # tbench secondary floor as belt-and-suspenders. wc≥85 already implies
    # high tbench for current models, but a future model with high wc / low
    # tbench would be caught here before it ships broken multi-step code.
    secondary_floors:
      tbench_accuracy: 60.0
    cost_cap: null
    fleet_size: 5

  reviewing:
    primary_metric: arena_elo
    quality_floor: 1480        # good reasoning ELO
    speed_floor: 30.0          # reviews tolerate slower models
    cost_cap: null
    fleet_size: 5

  fixing:
    primary_metric: mean_normalized_tbench_elo
    quality_floor: 0.70        # tbench/100 + elo/1600 averaged
    speed_floor: 40.0
    # Same agentic-fitness gate as coding. Composite metric can paper over
    # low tbench if elo is high (e.g. GLM-5: tbench=52.4 but composite=0.72).
    # Hard tbench floor catches that.
    secondary_floors:
      tbench_accuracy: 60.0
    cost_cap: null
    fleet_size: 5

  documentation:
    primary_metric: arena_elo
    quality_floor: 1430        # docs need less reasoning than coding
    speed_floor: 50.0          # docs should be quick to generate
    cost_cap: null
    fleet_size: 5

  testing:
    primary_metric: tbench_accuracy
    # Raised from 60 to 75 (2026-05) to eliminate the P1→P2 quality cliff.
    # Previous floor admitted Gemini 3 Pro (tbench=69.4) and GPT-5.2-Codex
    # (tbench=66.5) as fallbacks behind Gemini 3.1 Pro (80.2), meaning the
    # first rate-limit dropped quality 14%. Accept a smaller fleet (3 entries
    # likely) in exchange for smooth degradation between priorities.
    quality_floor: 75.0
    speed_floor: 40.0
    cost_cap: 20.0             # tests are repetitive — keep them cheap
    fleet_size: 5
