# Direct-vendor pricing registry — drives fetch_direct_vendor_prices.py.
#
# Per docs/development/plans/2026-06-29-plan-direct-vendor-pricing.md
# (Phase 1 architecture). Each vendor entry MAY contain:
#
#   pricing_url:    URL the orchestrator fetches
#   fetch_method:   "static" | "rendered" | "stealth" (chooses WebScraper method)
#   parser_module:  Python import path; the orchestrator does
#                   `importlib.import_module(parser_module).extract(payload, url)`
#                   and expects list[ParsedRow] back. Pure function, no I/O.
#   models:         dict mapping DB id → page-side slug + expected pricing_unit.
#                   The orchestrator joins ParsedRow.model_slug to the DB
#                   row via the page-side slug. Unit mismatch REFUSES to write.
#   consecutive_fetch_failures: bumped on HTTP error / parser exception
#                               (handled by orchestrator, not stored in YAML for
#                               Phase 1 — kept in memory + audit log; can be
#                               persisted in YAML in a later phase).
#
# Phase 1 ships parsers for 5 vendors only (the static-HTML audio set).
# The remaining 22 vendors are stubbed with `parser_module: null` so they
# show up in the audit log + scraper output as "not yet ground".

# ============================================================
# Phase 1 — populated, parsers ship in this commit
# ============================================================

assemblyai:
  pricing_url: https://www.assemblyai.com/pricing
  fetch_method: static
  parser_module: direct_vendor_parsers.assemblyai
  models:
    assemblyai/universal-2:
