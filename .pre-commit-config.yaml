# Pre-commit Configuration for Fabrik (MINIMAL - Final Commit Blockers Only)
#
# Most checks have moved to scripts/final_gate.py which coder AI runs BEFORE
# Traycer commit. This file contains only absolute blockers that must never
# be bypassed.
#
# Setup: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# Full quality checks: python scripts/final_gate.py

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # === ABSOLUTE BLOCKERS (always run at commit) ===
      - id: check-added-large-files
        args: ['--maxkb=500']  # 500KB - catches accidental large files
      - id: check-merge-conflict
      - id: detect-private-key

      # === FORMATTING HOOKS (called by final_gate.py, not at commit) ===
      # These are available for final_gate.py to call via:
      #   pre-commit run trailing-whitespace --all-files
      #   pre-commit run end-of-file-fixer --all-files
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]

  # Forbidden files blocker - prevents committing secrets even if .gitignore fails
  - repo: local
    hooks:
      # NOTE: the Agent-Provenance-Trailer guard is deliberately NOT a pre-commit hook. It runs
      # as a plain `.git/hooks/commit-msg` shim (install: `python3 scripts/check_commit_trailers.py
      # --install`). Routing it through pre-commit's commit-msg stage added a SECOND
      # staged_files_only() stash/restore cycle to every commit — on a tree three agents share,
      # where a pre-commit stash has already reverted uncommitted work once — and re-triggered
      # the "Your pre-commit configuration is unstaged" abort at a second point in the commit.
      # A 3-line shim has neither failure mode. See docs/workstation/hooks-index.md.

      - id: forbid-secrets
        name: Block forbidden files (.env, keys, certs)
        entry: "bash -c 'echo ERROR: Forbidden file detected && exit 1'"
        language: system
        files: '(^\.env$|^\.env\.local$|\.pem$|\.key$|^id_rsa$|^id_ed25519$|\.p12$|\.pfx$|^secrets/)'
        pass_filenames: true

      # Auto-sync governance files to all /opt projects when they change
      # Only runs in Fabrik repo - silently passes in other projects
      # Triggers on: governance files, core scripts, enforcement scripts, reference docs
      # Command-corpus drift gate: installed ~/.claude/commands must match
      # the rendered _sources/_fragments (hand-edits are silently lost on re-render)
      - id: command-corpus-check
        name: Command corpus matches rendered sources
        entry: bash -c 'if [ "$(pwd)" = "/opt/fabrik" ]; then python3 /opt/fabrik/commands/assemble_commands.py --check; fi'
        language: system
        # docs/orchestrator too: the orchestrator wrappers + their canonical docs render through
        # the same assembler (ORCH_SOURCES), and a commit editing only those paths previously
        # matched NO filter — the drift detector was dead on its own trigger surface (a doc edit
        # silently drifts the tracked wrapper's computed --phases until the next commands/ commit).
        files: '^(commands|docs/orchestrator)/'
        pass_filenames: false

      - id: governance-sync
        name: Sync governance + enforcement to all projects
        entry: bash -c 'if [ "$(pwd)" = "/opt/fabrik" ]; then /opt/fabrik/.venv/bin/python /opt/fabrik/scripts/sync_enforcement_to_projects.py --force 2>&1 | tail -3; fi'
        language: system
        files: '(^templates/governance/|^AGENTS\.md$|^agents-fabrik\.md$|^agents-fabrik-core\.md$|^AGENTS-compact\.md$|^opencode\.json$|^\.windsurfrules$|^\.windsurf/rules/|^\.claude/hooks/|^\.claude/settings\.json$|^\.windsurf/hooks\.json$|^scripts/(final_gate|kilo_code_review|kilo_docs_enforcer|docs_updater|update_agents_toc|health_checker|fabrik_synced_manifest|sync_enforcement_to_projects|doc_reconcile|select_rules|review_rubric|rules_match|release_cut|mail|command_run)\.py$|^scripts/enforcement/|^docs/reference/technology-stack-decision-guide\.md$|^docs/reference/prebuilt-app-containers\.md$|^scripts/kilo_47_agents_final\.json$)'
        pass_filenames: false
