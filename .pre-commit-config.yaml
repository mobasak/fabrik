# Pre-commit Configuration for Fabrik (MINIMAL - Final Commit Blockers Only)
#
# Most checks have moved to scripts/final_gate.py which coder AI runs BEFORE
# Traycer commit. This file contains only absolute blockers that must never
# be bypassed.
#
# Setup: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# Full quality checks: python scripts/final_gate.py

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # === ABSOLUTE BLOCKERS (always run at commit) ===
      - id: check-added-large-files
        args: ['--maxkb=500']  # 500KB - catches accidental large files
      - id: check-merge-conflict
      - id: detect-private-key

      # === FORMATTING HOOKS (called by final_gate.py, not at commit) ===
      # These are available for final_gate.py to call via:
      #   pre-commit run trailing-whitespace --all-files
      #   pre-commit run end-of-file-fixer --all-files
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]

  # Forbidden files blocker - prevents committing secrets even if .gitignore fails
  - repo: local
    hooks:
      - id: forbid-secrets
        name: Block forbidden files (.env, keys, certs)
        entry: "bash -c 'echo ERROR: Forbidden file detected && exit 1'"
        language: system
        files: '(^\.env$|^\.env\.local$|\.pem$|\.key$|^id_rsa$|^id_ed25519$|\.p12$|\.pfx$|^secrets/)'
        pass_filenames: true

      # Auto-sync governance files to all /opt projects when they change
      # Only runs in Fabrik repo - silently passes in other projects
      # Triggers on: governance files, core scripts, enforcement scripts, reference docs
      - id: governance-sync
        name: Sync governance + enforcement to all projects
        entry: bash -c 'if [ "$(pwd)" = "/opt/fabrik" ]; then /opt/fabrik/.venv/bin/python /opt/fabrik/scripts/sync_enforcement_to_projects.py --force 2>&1 | tail -3; fi'
        language: system
        files: '(^AGENTS\.md$|^AGENTS-compact\.md$|^opencode\.json$|^\.windsurfrules$|^\.windsurf/rules/|^scripts/(final_gate|kilo_code_review|kilo_docs_enforcer|docs_updater|update_agents_toc|health_checker)\.py$|^scripts/enforcement/|^docs/reference/windsurf/cascade-models\.md$|^docs/reference/technology-stack-decision-guide\.md$|^docs/reference/prebuilt-app-containers\.md$|^docs/reference/kilo/KILO_AGENT_NAMING\.md$|^scripts/kilo_47_agents_final\.json$)'
        pass_filenames: false
