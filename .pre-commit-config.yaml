# Pre-commit Configuration for Fabrik (MINIMAL - Final Commit Blockers Only)
#
# Most checks have moved to scripts/final_gate.py which coder AI runs BEFORE
# Traycer commit. This file contains only absolute blockers that must never
# be bypassed.
#
# Setup: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# Full quality checks: python scripts/final_gate.py

# New clones get BOTH hook types from a bare `pre-commit install`. Without this, the pre-push
# gate below exists in config and is installed nowhere — config presence is not enforcement.
default_install_hook_types: [pre-commit, post-commit, pre-push]
# Without this, EVERY hook below with no explicit `stages:` also runs at pre-push — proven by
# running the real hook: the governance-sync (which writes into 47 project trees) and the whole
# commit-blocker set fired on a push. Pin the default to the commit stage; the push gate opts in.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # === ABSOLUTE BLOCKERS (always run at commit) ===
      - id: check-added-large-files
        args: ['--maxkb=500']  # 500KB - catches accidental large files
      - id: check-merge-conflict
      - id: detect-private-key

      # === FORMATTING HOOKS — manual stage, and NOTHING CALLS THEM ===
      # ⚠️ This block used to say "called by final_gate.py … via `pre-commit run
      # trailing-whitespace --all-files`". That was false: `grep -n "pre-commit" scripts/final_gate.py`
      # returns no invocation, and the gate has its own implementation
      # (`fix_trailing_whitespace()`, final_gate.py:412, wired at :505) which is diff-SCOPED —
      # deliberately, since `--all-files` on a tree three sessions share would reformat their
      # uncommitted work. These two stay as a manual escape hatch; run them by hand or not at all.
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]

  # Forbidden files blocker - prevents committing secrets even if .gitignore fails
  - repo: local
    hooks:
      # NOTE: the Agent-Provenance-Trailer guard is deliberately NOT a pre-commit hook. It runs
      # as a plain `.git/hooks/commit-msg` shim (install: `python3 scripts/check_commit_trailers.py
      # --install`). Routing it through pre-commit's commit-msg stage added a SECOND
      # staged_files_only() stash/restore cycle to every commit — on a tree three agents share,
      # where a pre-commit stash has already reverted uncommitted work once — and re-triggered
      # the "Your pre-commit configuration is unstaged" abort at a second point in the commit.
      # A 3-line shim has neither failure mode. See docs/workstation/hooks-index.md.

      # === PUSH GATE — the local replacement for GitHub Actions ===
      # Operator directive 2026-08-25 ("we want same checks here, why do we pay them?"): 36 of
      # 46 repos are private, and private repos burn metered Actions minutes.
      #
      # SCOPE IS PARITY, deliberately. `.github/workflows/ci.yml` enforced exactly ONE thing on
      # push — `check_duplicates.py` — and `docs-check.yml` triggered on branch `main` while
      # this repo's default is `master`, so it never fired on a push at all. Running the full
      # Tier-2 gate here would be a NEW tax Actions never charged, on a box where three agents
      # push constantly; the completion gate stays where the contract puts it (§ Completion
      # Contract, run before commit). Measured cost of this hook: 0.49s.
      #
      # ⚠️ pre-push DOES stash. A 2026-08-25 finding of mine asserted the opposite ("pre-push
      # operates on rev ranges and leaves the worktree alone") on the strength of a scratch-repo
      # trial; running the real hook on THIS tree prints "Unstaged files detected / Stashing
      # unstaged files" every time, and the first wiring attempt hit the follow-on
      # "Stashed changes conflicted with hook auto-fixes... Rolling back fixes" — the exact
      # WIP-destruction shape that got the trailer guard removed from pre-commit (NOTE above).
      # It is survivable ONLY because this hook writes nothing into the tree (see --report), so
      # there are no auto-fixes to conflict with. Any hook added to this stage MUST stay
      # non-mutating, or it re-opens that failure on a tree three sessions share.
      - id: push-gate
        name: duplicate check before push (replaces GitHub Actions CI)
        # --report to /tmp: the default writes `duplicate-report.json` INTO the repo, and
        # pre-commit fails any hook that modifies a tracked file ("files were modified by this
        # hook") — so the gate went red on a push where the check itself printed PASS.
        entry: python3 scripts/enforcement/check_duplicates.py --report /tmp/fabrik-duplicate-report.json
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: forbid-secrets
        name: Block forbidden files (.env, keys, certs)
        entry: "bash -c 'echo ERROR: Forbidden file detected && exit 1'"
        language: system
        files: '(^\.env$|^\.env\.local$|\.pem$|\.key$|^id_rsa$|^id_ed25519$|\.p12$|\.pfx$|^secrets/)'
        pass_filenames: true

      # Auto-sync governance files to all /opt projects when they change
      # Only runs in Fabrik repo - silently passes in other projects
      # Triggers on: governance files, core scripts, enforcement scripts, reference docs
      # Command-corpus drift gate: installed ~/.claude/commands must match
      # the rendered _sources/_fragments (hand-edits are silently lost on re-render)
      # Decision-ledger integrity (01M1KDHT, 2026-09-03): three sessions mint ids from a stale
      # max-id read; two collisions in one day were cleaned by hand while the detector sat unwired.
      # Scoped to THIS repo's ledger (`--root .`), exits 1 on a duplicate id or a dangling supersede.
      - id: decisions-ledger-check
        name: Decision ledger has unique ids + resolving supersede pointers
        entry: python3 scripts/decisions.py --root . --check
        language: system
        files: ^docs/DECISIONS\.md$
        pass_filenames: false
      - id: command-corpus-check
        name: Command corpus matches rendered sources
        entry: bash -c 'if [ "$(pwd)" = "/opt/fabrik" ]; then python3 /opt/fabrik/commands/assemble_commands.py --check; fi'
        language: system
        # docs/orchestrator too: the orchestrator wrappers + their canonical docs render through
        # the same assembler (ORCH_SOURCES), and a commit editing only those paths previously
        # matched NO filter — the drift detector was dead on its own trigger surface (a doc edit
        # silently drifts the tracked wrapper's computed --phases until the next commands/ commit).
        files: '^(commands|docs/orchestrator)/'
        pass_filenames: false

      # COMMIT-MOMENT review grading (2026-08-30): the checker's blocking scan reads `git status`,
      # so a review COMMITTED without a gate run while dirty escaped blocking forever — observed
      # live (a phase review failing four blocking rules entered history ungated; the advisory
      # sweep checks a narrower class set and never saw it). Staged paths get the full battery
      # here, where the author is present and the artifact is theirs — never a retroactive scan.
      - id: review-coverage-staged
        name: Staged review artifacts pass the coverage grammar
        entry: python3 scripts/enforcement/check_review_coverage.py
        language: system
        files: '^docs/development/reviews/.*\.md$'
        # archived/ parity with the checker's own scan (_changed_md excludes it): archiving a
        # legacy report is a move, not an endorsement — grading it there is a false red.
        exclude: '^docs/development/reviews/archived/'

      # POST-COMMIT since the operator decision 2026-08-29: as the slowest pre-commit hook this was
      # the widest window for the tree-delta check to catch an UNRELATED concurrent writer, aborting
      # rules commits while the sync itself succeeded. Post-commit cannot abort and has no stash
      # window. ⚠️ MEASURED: post-commit gets NO file list from pre-commit (a files:-filtered hook
      # always Skips there), so the hook is always_run and the wrapper re-applies the `files:` regex
      # below against HEAD's own paths — the regex stays the canonical trigger set (CLAUDE.md
      # § Sync-consciousness), read by the wrapper at runtime, never duplicated.
      - id: governance-sync
        name: Sync governance + enforcement to all projects
        entry: bash /opt/fabrik/scripts/governance_sync_postcommit.sh
        language: system
        stages: [post-commit]
        always_run: true
        files: '(^templates/governance/|^AGENTS\.md$|^agents-fabrik\.md$|^agents-fabrik-core\.md$|^AGENTS-compact\.md$|^opencode\.json$|^\.windsurfrules$|^\.windsurf/rules/|^\.claude/hooks/|^\.claude/settings\.json$|^\.windsurf/hooks\.json$|^scripts/(final_gate|kilo_code_review|kilo_docs_enforcer|docs_updater|update_agents_toc|health_checker|fabrik_synced_manifest|sync_enforcement_to_projects|doc_reconcile|select_rules|review_rubric|rules_match|release_cut|mail|command_run|rivals_run|thread_anchor)\.py$|^scripts/enforcement/|^docs/reference/technology-stack-decision-guide\.md$|^docs/reference/prebuilt-app-containers\.md$|^scripts/kilo_47_agents_final\.json$)'
        pass_filenames: false
