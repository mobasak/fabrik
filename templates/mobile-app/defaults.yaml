# ─── shape: project-shape descriptor (Phase 4k) ───
# Consumed by `fabrik apply` via `orchestrator/infrastructure.py::resolve_applicability`.
# Authoritative matrix: `spec_loader.Shape` docstring + plan §CLI Entry Points.
# Changing a flag here changes which infrastructure registrars run for every
# project scaffolded from this template. Keep in sync with the pydantic Shape model.
# NOTE: the mobile binary ships through EAS / App Store / Play Store,
# but this template ALSO scaffolds a companion backend service
# (see compose.yaml.j2) that IS deployed to the VPS via `fabrik apply` (SSH + Docker Compose).
# kind=service so GlitchTip error tracking fires for the backend;
# is_public stays false so Gatus is opt-in (flip to true in the spec
# when the backend has a stable public domain).
shape:
  kind: service
  is_public: false
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: false
  needs_database: false
  has_search_feature: false

env:
  NODE_ENV: production
  TZ: UTC
