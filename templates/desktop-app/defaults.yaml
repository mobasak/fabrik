# ─── shape: project-shape descriptor (Phase 4k) ───
# Consumed by `fabrik apply` via `orchestrator/infrastructure.py::resolve_applicability`.
# Authoritative matrix: `spec_loader.Shape` docstring + plan §CLI Entry Points.
# Changing a flag here changes which infrastructure registrars run for every
# project scaffolded from this template. Keep in sync with the pydantic Shape model.
# NOTE: a desktop app is a packaged artefact (the Electron installer), not a VPS
# service: it ships through your own update domain in front of object storage
# (.windsurf/rules/desktop-app/72-desktop.md § Auto-Update), so every flag is
# false and no registrar applies. The template carries no Dockerfile/compose
# (W-bfaa9e9b retired a companion container that could not start). A backend the
# app talks to is its own Fabrik service, scaffolded and deployed separately.
shape:
  kind: static
  is_public: false
  is_admin_dashboard: false
  has_bearer_api: false
  has_persistent_data: false
  needs_database: false
  has_search_feature: false

env:
  NODE_ENV: production
  TZ: UTC
