# ─── shape: project-shape descriptor (Phase 4k) ───
# Consumed by `fabrik apply` via `orchestrator/infrastructure.py::resolve_applicability`.
# Authoritative matrix: `spec_loader.Shape` docstring + plan §CLI Entry Points.
# Changing a flag here changes which infrastructure registrars run for every
# project scaffolded from this template. Keep in sync with the pydantic Shape model.
shape:
  kind: service
  is_public: true
  is_admin_dashboard: false        # end-user auth is Supabase (Pattern B), not Authelia
  has_bearer_api: true             # the FastAPI backend exposes a bearer-auth API
  has_persistent_data: true
  needs_database: true
  needs_cache: true                # Redis: token denylist / API rate-limit / tenant cache (REDIS_URL delivered; wire as needed)
  exposes_metrics: true            # backend serves /metrics (Prometheus scrapes the api service)
  has_search_feature: false

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
