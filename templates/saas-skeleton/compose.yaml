# Docker Compose for `fabrik apply` deployment (SSH + Docker Compose)
# Update service name and domain before deploying

services:
  web:
    build: .
    platform: linux/amd64  # MANDATORY - VPS is x86_64
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-SaaS App}
      # Pattern A: frontend only needs the backend API base URL (no DB/auth secrets).
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # F5: declaring the memory limit here makes Docker enforce it (Fabrik
    # invariant — `deployer_ssh._validate_compose()` requires it per service).
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-saas}.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-saas}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-saas}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-saas}.loadbalancer.server.port=3000"

networks:
  default:
    name: fabrik
    external: true
