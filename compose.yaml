services:
  fabrik:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - VPS_HOST=${VPS_HOST:?VPS_HOST is required}
      - VPS_USER=${VPS_USER:-deploy}
      - SITE_PROVISIONER_URL=${SITE_PROVISIONER_URL:-https://provision.vps1.ocoron.com}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - fabrik

networks:
  fabrik:
    external: true
